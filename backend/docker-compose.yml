services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgpis}
      POSTGRES_USER: ${POSTGRES_USER:-sgpis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      # Se ejecuta solo al primer arranque, con el volumen de datos vacío.
      - ./db/esquema_bd.sql:/docker-entrypoint-initdb.d/01_esquema_bd.sql:ro
      - datos_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sgpis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sgpis}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:?Define JWT_EXPIRATION en .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  datos_pg:
