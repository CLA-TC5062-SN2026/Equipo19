[project]
name = "sgpis-backend"
version = "0.1.0"
description = "API REST de SGPIS (contrato openapi_equipo.yaml v2.0.0), equipo 19"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "openapi-core>=0.19",
    "pyyaml>=6.0",
    "pylint>=4.1.3",
    "flake8>=7.5.0",
    "mypy>=2.4.1",
    "bandit>=1.9.4",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# ---------------------------------------------------------------------------
# Análisis estático (S09_A1). Misma longitud de línea en pylint y flake8.
# ---------------------------------------------------------------------------
[tool.pylint.main]
py-version = "3.12"
jobs = 0
persistent = false

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
# Los modelos de SQLAlchemy y de Pydantic son contenedores de datos sin métodos
# públicos; esta regla los marcaría a todos (89 clases) sin aportar nada.
disable = ["too-few-public-methods"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
