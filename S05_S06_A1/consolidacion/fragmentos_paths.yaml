    - $ref: '#/components/parameters/ParqueId'
  post:
    tags: [Fases]
    operationId: crearAvanceFase
    summary: Avanzar de fase por excepción
    description: |
      Coordinación AMPIP pasa el parque a la fase siguiente sin cerrar la actual. La fase anterior queda "avanzada por
      excepción" con motivo, usuario y fecha, y la operación queda en la bitácora (RF-35).

      Errores:
      - 422 `motivo_requerido`: "Para avanzar sin cerrar la fase actual registre el motivo de la excepción".
      - 409 `fase_destino_invalida`: la fase destino no es la siguiente de la secuencia.
    x-acceptance-criteria: [RF-32-AC-4, RF-32-AC-5]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AvanceFaseCreate'
    responses:
      '201':
        description: Avance registrado.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/FaseExpediente'
