/bitacora:
  get:
    tags: [Bitácora]
    operationId: listarBitacora
    summary: Consultar la bitácora
    description: |
      Solo Coordinación AMPIP consulta la bitácora, del registro más reciente al más antiguo, con filtros por parque,
      usuario, acción y rango de fechas. Ningún registro trae el contenido ni un enlace al contenido de una evidencia.
      Los registros los crea el servidor como efecto de cada operación auditada (incluidos los 403, RF-35-AC-2); no
      hay operación para crear, modificar ni borrar registros (RNF-03).
    x-acceptance-criteria: [RF-35-AC-1, RF-35-AC-2, RF-35-AC-3, RF-35-AC-4]
    parameters:
      - name: parqueId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: usuarioId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: accion
        in: query
        required: false
        schema:
          type: string
          example: descargar
      - name: desde
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: hasta
        in: query
        required: false
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/TamanoPagina'
    responses:
      '200':
        description: Página de registros.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaginaBitacora'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '422':
        $ref: '#/components/responses/UnprocessableEntity'
      '500':
        $ref: '#/components/responses/InternalError'

