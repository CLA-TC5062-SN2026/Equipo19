    - $ref: '#/components/parameters/FasePath'
  post:
    tags: [Fases]
    operationId: cerrarFase
    summary: Cerrar una fase del expediente
    description: |
      Coordinación AMPIP cierra la fase actual: queda "completada" con usuario y fecha, y la siguiente pasa a "en
      proceso". APPI y consultores reciben 403 (RF-32-AC-3).

      Errores:
      - 409 `fase_no_actual`: solo se cierra la fase en curso.
    x-acceptance-criteria: [RF-32-AC-3]
