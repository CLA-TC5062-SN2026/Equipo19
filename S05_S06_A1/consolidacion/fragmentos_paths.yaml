/parques/{parqueId}/evidencias:
  parameters:
    - $ref: '#/components/parameters/ParqueId'
  post:
    tags: [Evidencias]
    operationId: crearEvidencias
    summary: Subir uno o varios archivos de evidencia vinculados a uno o varios criterios
    description: |
      La APPI del parque sube de 1 a 10 archivos en una operación y los vincula a uno o más criterios aplicables del
      parque. Por cada archivo válido se crea una evidencia con un vínculo por criterio, cada vínculo en estado
      "enviada" (C-19). Se guardan nombre original, tipo, tamaño, fecha y hora, versión, autor y la referencia al
      objeto; el archivo nunca se guarda en PostgreSQL. Como efecto lateral, cada criterio vinculado que estaba
      "pendiente", "cumplido" o "no cumplido" pasa a "en revisión".

      Los archivos que no pasan la validación se reportan en `rechazadas` con su motivo y no detienen a los demás
      (RF-05-AC-8). Si se envía un solo archivo y se rechaza, la respuesta es el error correspondiente (413 o 422).
      El límite de tamaño es el configurado en `/configuracion` (inicial 100 MB, inclusive). Formatos permitidos:
      PDF, JPG, PNG, HEIC, XLSX y DOCX. Gerente corporativo, Coordinación AMPIP y consultores reciben 403.

      Errores:
      - 413 `archivo_excede_limite`: "El archivo supera el límite de {n} MB".
      - 422 `formato_video_no_permitido`: "Este sistema no acepta archivos de video; suba una fotografía o captura de
        pantalla con fecha visible".
      - 422 `formato_no_permitido`: "Formato de archivo no permitido; use PDF, JPG, PNG, HEIC, XLSX o DOCX".
      - 422 `criterio_no_aplica`: "Este criterio no aplica al tipo de PI del parque".
    x-acceptance-criteria: [RF-05-AC-1, RF-05-AC-5, RF-05-AC-7, RF-05-AC-8, RF-06-AC-1, RF-06-AC-2, RF-06-AC-3, RF-06-AC-4, RF-06-AC-5, RF-06-AC-6, RF-17-AC-3, RF-23-AC-2, RF-27-AC-4, RF-27-AC-7]
    parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/EvidenciaCreate'
    responses:
      '201':
        description: Al menos un archivo se aceptó; el cuerpo lista los creados y los rechazados.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CargaEvidencias'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '413':
        $ref: '#/components/responses/PayloadTooLarge'
      '422':
        $ref: '#/components/responses/UnprocessableEntity'
      '500':
        $ref: '#/components/responses/InternalError'

/evidencias/{evidenciaId}/vinculos/{criterioId}:
  parameters:
    - $ref: '#/components/parameters/EvidenciaId'
    - $ref: '#/components/parameters/CriterioId'
  patch:
    tags: [Evidencias]
    operationId: aceptarVinculoEvidencia
    summary: Aceptar la evidencia para un criterio
    description: |
      El consultor asignado marca como "aceptada" la evidencia para ese criterio. El estado vive en el vínculo, así
      que aceptar el Reglamento Interno para 3.1 no lo acepta para 3.4 (RF-05-AC-7). "Observada" no se fija por aquí:
      se registra con `POST /evidencias/{evidenciaId}/observaciones`.

      Errores:
      - 409 `transicion_no_permitida`: el vínculo no está en "enviada".
    x-acceptance-criteria: [RF-27-AC-1, RF-27-AC-5, RF-05-AC-7]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VinculoEvidenciaUpdate'
    responses:
      '200':
        description: Vínculo aceptado.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VinculoEvidencia'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '409':
        $ref: '#/components/responses/Conflict'
      '422':
        $ref: '#/components/responses/UnprocessableEntity'
      '500':
        $ref: '#/components/responses/InternalError'

