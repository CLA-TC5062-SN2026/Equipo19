    operationId: listarFasesParque
    summary: Consultar las fases del expediente
    description: |
      Las nueve fases de la secuencia (guardada como datos, C-15) con su estado para el expediente vigente:
      "pendiente", "en proceso", "completada" o "avanzada por excepción". Una fase con entregables subidos sigue "en
      proceso" hasta que Coordinación AMPIP la cierra o ocurre el evento que la define (RF-32-AC-2).
    x-acceptance-criteria: [RF-32-AC-1, RF-32-AC-2]
    responses:
      '200':
        description: Fases del expediente en orden.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/FaseExpediente'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/InternalError'

