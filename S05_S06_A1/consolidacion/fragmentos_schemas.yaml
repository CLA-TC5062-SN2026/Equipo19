RegistroCreate:
  type: object
  required: [tokenInvitacion, contrasena]
  properties:
    tokenInvitacion:
      type: string
      minLength: 32
      description: Token de un solo uso que llegó en el correo de invitación (RF-03-AC-1).
    contrasena:
      type: string
      format: password
      minLength: 10
      writeOnly: true

SesionCreada:
  type: object
  required: [token, tipoToken, expiraEn, expiraPorInactividadMin, usuario]
  properties:
    token:
      type: string
      description: JWT con `sub`, `sid`, `iat` y `exp`.
    tipoToken:
      type: string
      enum: [Bearer]
    expiraEn:
      type: string
      format: date-time
      description: Expiración absoluta del token (`exp`), según `JWT_EXPIRATION`.
    expiraPorInactividadMin:
      type: integer
      example: 60
    usuario:
      $ref: '#/components/schemas/Usuario'

Configuracion:
  type: object
  required: [tamanoMaximoEvidenciaMB, vigenciaDistintivoAnios, actualizadoEn]
  properties:
    tamanoMaximoEvidenciaMB:
      type: integer
      minimum: 1
      maximum: 100
      example: 100
    vigenciaDistintivoAnios:
      type: integer
      minimum: 1
      maximum: 10
      example: 3
    actualizadoEn:
      type: string
      format: date-time
    actualizadoPor:
      type: string
      format: uuid
      nullable: true

ConfiguracionUpdate:
  type: object
  minProperties: 1
  properties:
    tamanoMaximoEvidenciaMB:
      type: integer
      minimum: 1
      description: Valores mayores a 100 se rechazan con 422 `limite_excede_maximo`.
      example: 50
    vigenciaDistintivoAnios:
      type: integer
      minimum: 1
      maximum: 10

EvidenciaCreate:
  type: object
  required: [archivos, criterioIds, fase]
  properties:
    archivos:
      type: array
      minItems: 1
      maxItems: 10
      items:
        type: string
        format: binary
      description: PDF, JPG, PNG, HEIC, XLSX o DOCX; cada archivo hasta el límite configurado (inclusive).
    criterioIds:
      type: array
      minItems: 1
      items:
        type: string
        format: uuid
      description: Criterios del parque a los que se vincula cada archivo (C-19).
    fase:
      $ref: '#/components/schemas/Fase'
    descripcion:
      type: string

CargaEvidencias:
  type: object
  required: [creadas, rechazadas]
  properties:
    creadas:
      type: array
      items:
        $ref: '#/components/schemas/Evidencia'
    rechazadas:
      type: array
      items:
        $ref: '#/components/schemas/ArchivoRechazado'

ArchivoRechazado:
  type: object
  required: [nombreArchivo, codigo, mensaje]
  properties:
    nombreArchivo:
      type: string
    codigo:
      type: string
      example: archivo_excede_limite
    mensaje:
      type: string
      example: El archivo supera el límite de 100 MB

EstadoVinculo:
  type: string
  description: Estado de la evidencia para un criterio (RF-05, RF-27). Vive en el vínculo, no en el archivo (C-19).
  enum: [enviada, observada, aceptada]

VinculoEvidencia:
  type: object
  required: [evidenciaId, criterioId, claveCriterio, estado, fechaEstado, estadoCriterio]
  properties:
    evidenciaId:
      type: string
      format: uuid
    criterioId:
      type: string
      format: uuid
    claveCriterio:
      type: string
      example: '3.1'
    estado:
      $ref: '#/components/schemas/EstadoVinculo'
    fechaEstado:
      type: string
      format: date-time
    estadoCriterio:
      $ref: '#/components/schemas/EstadoCalificacion'

VinculoEvidenciaUpdate:
  type: object
  required: [estado]
  properties:
    estado:
      type: string
      description: Única transición del consultor por PATCH; "observada" se registra con una Observación.
      enum: [aceptada]

Evidencia:
  type: object
  required: [id, parqueId, fase, categoria, nombreArchivo, tipoMime, tamanoBytes, versionActual, autorId, fechaCarga, eliminada, vinculos]
  properties:
    id:
      type: string
      format: uuid
    parqueId:
      type: string
      format: uuid
    fase:
      $ref: '#/components/schemas/Fase'
    categoria:
      $ref: '#/components/schemas/CategoriaEvidencia'
    nombreArchivo:
      type: string
    tipoMime:
      type: string
      enum:
        - application/pdf
        - image/jpeg
        - image/png
        - image/heic
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    tamanoBytes:
      type: integer
      minimum: 1
      maximum: 104857600
    versionActual:
      type: integer
      minimum: 1
    autorId:
      type: string
      format: uuid
    fechaCarga:
      type: string
      format: date-time
    descripcion:
      type: string
      nullable: true
    eliminada:
      type: boolean
      description: Baja lógica (RF-05-AC-9); la evidencia sigue en el historial.
    eliminadaEn:
      type: string
      format: date-time
      nullable: true
    eliminadaPor:
      type: string
      format: uuid
      nullable: true
    vinculos:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/VinculoEvidencia'

Observacion:
  type: object
  required: [id, evidenciaId, criterioId, motivo, consultorId, fecha, notificadoAAppi]
  properties:
    id:
      type: string
      format: uuid
    evidenciaId:
      type: string
      format: uuid
    criterioId:
      type: string
      format: uuid
    version:
      type: integer
      minimum: 1
      description: Versión de la evidencia observada (RF-05-AC-6).
    motivo:
      type: string
    consultorId:
      type: string
      format: uuid
    fecha:
      type: string
      format: date-time
    notificadoAAppi:
      type: boolean

ObservacionCreate:
  type: object
  required: [criterioId, motivo]
  properties:
    criterioId:
      type: string
      format: uuid
      description: Vínculo que se observa; los demás vínculos de la misma evidencia no cambian.
    motivo:
      type: string
      minLength: 1
      example: Falta el protocolo de retención del grabador

EstadoFase:
  type: string
  enum: [pendiente, en_proceso, completada, avanzada_por_excepcion]

FaseExpediente:
  type: object
  required: [fase, orden, nombre, estado, actual]
  properties:
    fase:
      $ref: '#/components/schemas/Fase'
    orden:
      type: integer
      minimum: 1
      maximum: 9
    nombre:
      type: string
      example: Plan de trabajo
    estado:
      $ref: '#/components/schemas/EstadoFase'
    actual:
      type: boolean
    fechaInicio:
      type: string
      format: date-time
      nullable: true
    fechaCierre:
      type: string
      format: date-time
      nullable: true
    cerradaPor:
      type: string
      format: uuid
      nullable: true
    motivoExcepcion:
      type: string
      nullable: true

AvanceFaseCreate:
  type: object
  required: [faseDestino]
  properties:
    faseDestino:
      $ref: '#/components/schemas/Fase'
    motivo:
      type: string
      description: Obligatorio; su ausencia responde 422 con el mensaje de RF-32-AC-4.
      example: Análisis entregado; el consultor lo revisa en la visita del 15 de abril

EvaluacionDesempenoCreate:
  type: object
  required: [resultado]
  properties:
    resultado:
      type: string
      minLength: 1

EvaluacionDesempeno:
  type: object
  required: [id, folio, parqueId, generacionId, fecha, consultorId, versionCatalogo, resultado]
  properties:
    id:
      type: string
      format: uuid
    folio:
      type: string
      pattern: ^ED-\d{4}-\d{4}$
      example: ED-2027-0007
    parqueId:
      type: string
      format: uuid
    generacionId:
      type: string
      format: uuid
    fecha:
      type: string
      format: date-time
    consultorId:
      type: string
      format: uuid
    versionCatalogo:
      type: string
      example: catalogo-2023-v1
    resultado:
      type: string

UsuarioParque:
  allOf:
    - $ref: '#/components/schemas/Usuario'
    - type: object
      required: [contactoPrincipal]
      properties:
        contactoPrincipal:
          type: boolean

ContactoPrincipalUpdate:
  type: object
  required: [usuarioId]
  properties:
    usuarioId:
      type: string
      format: uuid

RegistroBitacora:
  type: object
  required: [id, fechaHora, accion, resultado]
  properties:
    id:
      type: integer
      format: int64
    fechaHora:
      type: string
      format: date-time
    usuarioId:
      type: string
      format: uuid
      nullable: true
    rol:
      type: string
      nullable: true
      description: Rol del usuario al momento de la operación (valor de `Rol`).
      enum: [coordinacion_ampip, director_general_ampip, appi, consultor, gerente_corporativo, administrador_tecnico, null]
    parqueId:
      type: string
      format: uuid
      nullable: true
    accion:
      type: string
      example: descargar
    recursoTipo:
      type: string
      nullable: true
      example: evidencia
    recursoId:
      type: string
      nullable: true
    resultado:
      type: string
      enum: [exitoso, denegado, fallido]
    detalle:
      type: string
      nullable: true

PaginaBitacora:
  allOf:
    - $ref: '#/components/schemas/Paginacion'
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RegistroBitacora'

RecomendacionCreate:
  type: object
  required: [texto]
  properties:
    texto:
      type: string
      minLength: 1
      example: Incluir el plano con la ubicación de cámaras y el periodo de retención del grabador

Recomendacion:
  type: object
  required: [id, parqueId, criterioId, texto, consultorId, fecha]
  properties:
    id:
      type: string
      format: uuid
    parqueId:
      type: string
      format: uuid
    criterioId:
      type: string
      format: uuid
    texto:
      type: string
    consultorId:
      type: string
      format: uuid
    fecha:
      type: string
      format: date-time
