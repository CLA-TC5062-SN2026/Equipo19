        atraso. `orden` admite `fechaComprometida` y `clave`.
      x-acceptance-criteria: [RF-09-AC-1]
      parameters:
        - $ref: '#/components/parameters/Atrasado'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
        - $ref: '#/components/parameters/Orden'
      responses:
        '200':
          description: Página del plan de trabajo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPlanTrabajo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Plan de trabajo]
      operationId: crearRenglonPlanTrabajo
      summary: Registrar un criterio en el plan de trabajo
      description: |
        El consultor asignado registra, para un criterio pendiente del parque, un responsable y una fecha comprometida.

        Errores:
        - 409 `renglon_duplicado`: el criterio ya tiene un renglón en el plan de trabajo del parque.
        - 422 `responsable_no_appi`: "El responsable debe ser un usuario APPI de este parque".
        - 422 `criterio_no_aplica`: "Este criterio no aplica al tipo de PI del parque".
        - 422 `criterio_no_existe` / `usuario_no_existe`: id referenciado en el cuerpo que no existe.
      x-acceptance-criteria: [RF-09-AC-1, RF-09-AC-4]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenglonPlanTrabajoCreate'
      responses:
        '201':
          description: Renglón creado.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenglonPlanTrabajo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

