      responses:
        '200':
          description: Revisión del análisis de riesgos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionAnalisisRiesgos'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /parques/{parqueId}/documento-analisis-riesgos:
    parameters:
      - $ref: '#/components/parameters/ParqueId'
    put:
      tags: [Análisis de riesgos]
      operationId: reemplazarDocumentoAnalisisRiesgos
      summary: Subir o reemplazar el documento del análisis de riesgos
      description: |
        La APPI decide subir el documento completo del análisis de riesgos. Queda visible únicamente para la APPI y su
        consultor asignado. Responde 201 si no había documento y 200 si reemplaza el existente.
      x-acceptance-criteria: [RF-16-AC-2]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentoAnalisisRiesgosUpload'
      responses:
        '200':
          description: Documento reemplazado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoAnalisisRiesgos'
        '201':
          description: Documento guardado por primera vez.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoAnalisisRiesgos'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Análisis de riesgos]
      operationId: obtenerDocumentoAnalisisRiesgos
      summary: Descargar el documento del análisis de riesgos
      description: |
        Solo la APPI del parque y su consultor asignado. Coordinación AMPIP, Administrador técnico y consultor de
        comité reciben 403 y el intento se registra en la bitácora. Si la APPI no ha subido el documento, 404.
      x-acceptance-criteria: [RF-16-AC-2, RF-16-AC-3]
      responses:
        '200':
          description: Documento.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Análisis de riesgos]
      operationId: eliminarDocumentoAnalisisRiesgos
      summary: Eliminar el documento del análisis de riesgos
      description: La APPI elimina el documento que subió. Los registros de revisión se conservan.
      x-acceptance-criteria: []
      x-justificacion: >-
        La descripción de RF-16 dice que la APPI decide si sube el documento y puede eliminarlo, pero ningún AC lo
        cubre. Esta operación implementa ese derecho de la APPI.
      responses:
        '204':
          description: Documento eliminado.
        '401':
