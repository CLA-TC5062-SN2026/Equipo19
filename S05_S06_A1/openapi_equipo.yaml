  /parques/{parqueId}/criterios/{criterioId}:
    parameters:
      - $ref: '#/components/parameters/ParqueId'
      - $ref: '#/components/parameters/CriterioId'
    get:
      tags: [Criterios del parque]
      operationId: obtenerCriterioParque
      summary: Consultar un criterio aplicable del parque
      description: |
        Devuelve el criterio con su estado de calificación y su descripción de evidencia suficiente. Un criterio NA
        para el tipo de PI del parque no forma parte de sus criterios aplicables y responde 404.
      x-acceptance-criteria: [RF-24-AC-1, RF-25-AC-1]
      responses:
        '200':
          description: Criterio del parque.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriterioParque'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Criterios del parque]
      operationId: actualizarCriterioParque
      summary: Calificar o reabrir un criterio
      description: |
        Solo el consultor asignado del parque. Cualquier otro rol, incluida la APPI, recibe 403.

        Transiciones permitidas de `estadoCalificacion`:
        - `en_revision` → `cumplido`: exige al menos una evidencia "aceptada" y, para los estándares 2, 3 y 7, un
          registro de revisión del análisis de riesgos vigente para el ciclo actual del parque (una revisión de un
          ciclo anterior no cuenta).
        - `en_revision` → `no_cumplido`.
        - `cumplido` o `no_cumplido` → `en_revision` (reapertura): exige `motivo`; no requiere evidencia nueva.

        Cada cambio, incluidos los automáticos de RF-27-AC-4 y AC-7, agrega un registro al historial
        (`GET /parques/{parqueId}/criterios/{criterioId}/calificaciones`) con fecha, consultor y motivo, y el cálculo de
        cumplimiento lo refleja.

        Errores:
        - 409 `transicion_invalida`: transición no permitida desde el estado actual (por ejemplo, a `cumplido` desde
          `pendiente`, o reabrir un criterio que ya está en `en_revision`).
        - 422 `sin_evidencia_aceptada`: `cumplido` sin ninguna evidencia "aceptada" (el SRS no fija texto literal).
        - 422 `analisis_riesgos_no_vigente`: "No se puede calificar este criterio sin un análisis de riesgos vigente";
          el criterio conserva su estado anterior.
        - 422 `motivo_requerido`: reapertura sin `motivo`.
        - 422 `criterio_no_aplica`: "Este criterio no aplica al tipo de PI del parque".
      x-acceptance-criteria: [RF-16-AC-4, RF-17-AC-1, RF-17-AC-2, RF-27-AC-2, RF-27-AC-3, RF-27-AC-5, RF-27-AC-6, 
            RF-27-AC-8]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriterioParqueUpdate'
      responses:
        '200':
          description: Criterio con su nuevo estado de calificación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriterioParque'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

