  # ================================================================ Parques
  /parques:
    get:
      tags: [Parques]
      operationId: listarParques
      summary: Listar parques
      description: |
        Lista los parques visibles según el rol: Coordinación AMPIP ve todos; el consultor, los parques donde tiene
        asignación vigente; la APPI, su parque. Sin filtro `estado` omite los parques inactivos (dados de baja).
        `orden` admite `nombre`, `fechaAlta` y `region` (por defecto `nombre`).
      x-acceptance-criteria: [RF-29-AC-3]
      parameters:
        - $ref: '#/components/parameters/GeneracionIdQuery'
        - name: region
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Region'
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoParque'
        - name: atrasado
          in: query
          required: false
          description: Filtra por la marca de atraso por falta de actualización anual del programa (RF-30).
          schema:
            type: boolean
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
        - $ref: '#/components/parameters/Orden'
      responses:
        '200':
          description: Página de parques.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaParques'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Parques]
      operationId: crearParque
      summary: Dar de alta parque activo o histórico
      description: |
        Coordinación AMPIP da de alta un parque. El cuerpo es `ParqueCreate` o `ParqueHistoricoCreate`, según
        `tipoRegistro`:
        - `activo`: nombre, desarrollador, tipo de PI, región y generación. El parque se crea en estado "activo" con
          fecha de alta igual a la fecha de la operación.
        - `historico`: datos mínimos (nombre, región, fecha del último dictamen y fecha de término). Se crea en estado
          "historico" sin exigir documentos ni evidencias y sin migrar su expediente.

        Errores (422):
        - `tipo_pi_invalido`: "Debe seleccionar un tipo de PI válido".
        - `region_invalida`: "Debe seleccionar una región válida".
        - `generacion_requerida`: "Debe indicar la generación del parque".
        - `generacion_no_existe`: `generacionId` no corresponde a ninguna generación.
      x-acceptance-criteria: [RF-02-AC-1, RF-02-AC-2, RF-02-AC-3, RF-28-AC-3, RF-31-AC-2]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParqueAlta'
      responses:
        '201':
          description: Parque creado.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parque'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /parques/{parqueId}:
    parameters:
      - $ref: '#/components/parameters/ParqueId'
    get:
      tags: [Parques]
      operationId: obtenerParque
      summary: Consultar expediente del parque
      description: |
        Devuelve los datos del expediente, incluida la versión del catálogo contra la que fue evaluado (solo lectura)
        y las fechas de término y de próxima actualización anual del programa. Un usuario sin relación con el parque
        recibe 403 (RNF-01).
      x-acceptance-criteria: [RF-01-AC-3, RF-30-AC-1]
      responses:
        '200':
          description: Expediente del parque.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parque'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Parques]
      operationId: actualizarParque
      summary: Actualizar parque, fechas del programa o darlo de baja
      description: |
        Coordinación AMPIP actualiza datos generales (nombre, desarrollador, región), registra las fechas del
        programa (`fechaTerminoPrograma`, `fechaProximaActualizacion`) o da de baja el parque con
        `estado: inactivo` y un `motivo`. La versión del catálogo no es editable y el tipo de PI se cambia en
        `PUT /parques/{parqueId}/tipo-pi`.

        La baja es lógica: el parque conserva su historial, el GET sigue respondiendo 200 con `estado: inactivo`, se
        retira de inmediato el acceso de la APPI y del consultor asignado (los permisos se leen de la base en cada
        solicitud) y el parque deja de aparecer en la vista de avance activa. Repetir la baja de un parque ya inactivo
        responde 200 sin efectos.

        Errores:
        - 409 `transicion_invalida`: `estado: inactivo` sobre un parque histórico.
        - 422 `region_invalida`: "Debe seleccionar una región válida".
      x-acceptance-criteria: [RF-01-AC-3, RF-02-AC-3, RF-29-AC-3, RF-30-AC-1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParqueUpdate'
      responses:
        '200':
          description: Parque actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parque'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /parques/{parqueId}/tipo-pi:
    parameters:
      - $ref: '#/components/parameters/ParqueId'
    put:
      tags: [Parques]
      operationId: reemplazarTipoPI
      summary: Cambiar el tipo de PI del parque
      description: |
        Coordinación AMPIP fija el tipo de PI vigente. Si cambia, el sistema cierra la clasificación anterior
        (`fechaHasta` = `fechaCambio`), abre una nueva (`fechaDesde` = `fechaCambio`), recalcula los criterios O/R/NA,
        conserva el cumplimiento anterior asociado a la clasificación previa y pone en "pendiente" los criterios que
        dejan de ser NA.

        Idempotente: si `tipoPI` es igual al vigente, responde 200 sin abrir historial ni recalcular, sin importar
        `fechaCambio`.

        Errores:
        - 422 `tipo_pi_invalido`: "Tipo de PI inválido"; no se crea ningún registro de historial.

        Sin `motivo` responde 422 `motivo_requerido`: "Indique el motivo del cambio de tipo de PI". Las evidencias de
        criterios que pasan a NA se conservan con su estado e historial y dejan de contar en el cálculo (RF-11-AC-6).
      x-acceptance-criteria: [RF-11-AC-1, RF-11-AC-2, RF-11-AC-3, RF-11-AC-4, RF-11-AC-5, RF-11-AC-6]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioTipoPI'
      responses:
        '200':
          description: Tipo de PI vigente; si cambió, criterios recalculados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CambioTipoPIResultado'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /parques/{parqueId}/tipos-pi:
    parameters:
