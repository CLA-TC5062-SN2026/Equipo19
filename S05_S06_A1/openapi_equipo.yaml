      description: |
        Solo Coordinación AMPIP consulta la bitácora, del registro más reciente al más antiguo, con filtros por parque,
        usuario, acción y rango de fechas. Ningún registro trae el contenido ni un enlace al contenido de una evidencia.
        Los registros los crea el servidor como efecto de cada operación auditada (incluidos los 403, RF-35-AC-2); no
        hay operación para crear, modificar ni borrar registros (RNF-03).
      x-acceptance-criteria: [RF-35-AC-1, RF-35-AC-2, RF-35-AC-3, RF-35-AC-4]
      parameters:
        - name: parqueId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: usuarioId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: accion
          in: query
          required: false
          schema:
            type: string
            example: descargar
        - name: desde
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          required: false
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
      responses:
        '200':
          description: Página de registros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaBitacora'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /parques/{parqueId}/criterios/{criterioId}/recomendaciones:
    parameters:
      - $ref: '#/components/parameters/ParqueId'
      - $ref: '#/components/parameters/CriterioId'
    get:
      tags: [Criterios del parque]
      operationId: listarRecomendaciones
      summary: Listar recomendaciones del consultor en un criterio
      x-acceptance-criteria: [RF-36-AC-1]
      responses:
        '200':
          description: Recomendaciones del criterio.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recomendacion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Criterios del parque]
      operationId: crearRecomendacion
      summary: Registrar una recomendación del consultor
      description: |
        El consultor asignado deja una recomendación en el criterio, aunque siga "pendiente". No cambia el estado de
        ninguna evidencia ni la calificación del criterio, y no aparece entre las observaciones (RF-36-AC-2).
      x-acceptance-criteria: [RF-36-AC-1, RF-36-AC-2]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecomendacionCreate'
      responses:
        '201':
          description: Recomendación registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recomendacion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /parques/{parqueId}/criterios/{criterioId}/calificaciones:
    parameters:
      - $ref: '#/components/parameters/ParqueId'
      - $ref: '#/components/parameters/CriterioId'
    get:
      tags: [Criterios del parque]
      operationId: listarCalificacionesCriterio
      summary: Historial de calificaciones de un criterio
      description: |
        Todos los cambios del estado de calificación del criterio en el expediente vigente, del más reciente al más
        antiguo, con quién y cuándo los hizo y el motivo de cada reapertura (RD-14). Incluye los cambios automáticos.
      x-acceptance-criteria: [RF-27-AC-2, RF-27-AC-4, RF-27-AC-7, RF-27-AC-8]
      responses:
        '200':
          description: Historial del criterio.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalificacionCriterio'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /restablecimientos-contrasena:
    post:
      tags: [Autenticación]
      operationId: crearRestablecimientoContrasena
      summary: Fijar contraseña nueva con el enlace de recuperación
      description: |
        Recibe el token del enlace en el cuerpo, fija la contraseña nueva y revoca las sesiones activas del usuario.
        El enlace deja de funcionar 30 minutos después de generado o en cuanto se usa una vez, lo que ocurra primero.

        Errores:
        - 410 `enlace_no_vigente`: el enlace ya se usó o tiene más de 30 minutos.
        - 422 `token_invalido`: el token no corresponde a ningún enlace de recuperación.
      security: []
      x-acceptance-criteria: [RF-26-AC-4]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecimientoContrasenaCreate'
      responses:
        '204':
          description: Contraseña actualizada y sesiones anteriores revocadas.
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /versiones-catalogo/{versionId}/criterios:
    parameters:
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [Catálogo]
      operationId: listarCriteriosVersion
      summary: Listar los criterios de una versión del catálogo
      description: |
        Criterios de la versión con su método de verificación, sus marcas por tipo de PI y la descripción de evidencia
        suficiente, para que Coordinación AMPIP la capture o la revise (RF-24). Solo Coordinación AMPIP.
      x-acceptance-criteria: [RF-01-AC-1, RF-24-AC-1]
      parameters:
        - $ref: '#/components/parameters/Estandar'
      responses:
        '200':
          description: Criterios de la versión, ordenados por clave.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Criterio'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT firmado (HS256) que emite `POST /auth/login`, con los claims `sub` (usuario), `sid` (sesión), `iat` y `exp`.
        `exp` sale de la variable de entorno `JWT_EXPIRATION` y `JWT_SECRET` firma el token; ninguno está en código.
        En CADA solicitud el servidor valida firma y `exp`, y además que la sesión `sid` exista, no esté revocada y
        tenga menos de 60 minutos sin actividad; si pasa, actualiza la última actividad. Si no pasa, responde 401.
        El rol y las asignaciones a parques se leen de la base, nunca de claims del token: cerrar sesión (RF-26-AC-5),
        la inactividad (RF-26-AC-6), la reasignación de consultor (RF-10-AC-2) y las bajas (RF-29) retiran el acceso
        de inmediato.

  headers:
    Location:
      description: URI del recurso creado.
      schema:
        type: string
        format: uri-reference
        example: /api/parques/3f6c1c7e-2b7a-4d43-9a56-0c2b1f1e9d10
    RetryAfter:
      description: Segundos que faltan para que termine el bloqueo de la cuenta.
      schema:
        type: integer
        minimum: 1
        example: 840

  parameters:
    ParqueId:
      name: parqueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CriterioId:
      name: criterioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EvidenciaId:
      name: evidenciaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ObservacionId:
      name: observacionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GeneracionId:
      name: generacionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActualizacionId:
      name: actualizacionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AsignacionId:
      name: asignacionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RenglonId:
      name: renglonId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OpinionId:
      name: opinionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SesionId:
      name: sesionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DictamenId:
      name: dictamenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GeneracionIdQuery:
      name: generacionId
      in: query
      required: false
      description: Filtra por generación.
      schema:
        type: string
        format: uuid
    Estandar:
      name: estandar
      in: query
      required: false
      description: Filtra por estándar del catálogo (1 a 10).
      schema:
        type: integer
        minimum: 1
        maximum: 10
    Atrasado:
      name: atrasado
      in: query
      required: false
      description: Filtra por la marca de atraso que fija la revisión diaria de plazos (RF-09).
      schema:
        type: boolean
    EstadoEvidenciaQuery:
      name: estado
      in: query
      required: false
      description: Filtra por estado de la evidencia.
      schema:
        $ref: '#/components/schemas/EstadoEvidencia'
    Pagina:
      name: pagina
      in: query
      required: false
      description: Número de página, desde 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    TamanoPagina:
      name: tamanoPagina
      in: query
      required: false
      description: Elementos por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Orden:
      name: orden
      in: query
      required: false
      description: |
        Campos de orden separados por coma; el prefijo `-` indica orden descendente. Los campos admitidos dependen del
        listado. El servidor agrega siempre `id` como desempate para que el orden sea estable entre páginas.
      schema:
        type: string
        pattern: '^-?[A-Za-z]+(,-?[A-Za-z]+)*$'
        example: '-fechaCreacion'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        UUID generado por el cliente. El servidor guarda (usuario, clave) → (hash de la solicitud, código y cuerpo de
        la respuesta) durante 24 horas. Un reintento con la misma clave y el mismo cuerpo devuelve 200 con el recurso
        ya creado; la misma clave con un cuerpo distinto responde 422 `idempotency_key_reutilizada`.
      schema:
        type: string
        format: uuid

    FasePath:
      name: fase
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Fase'
  responses:
    BadRequest:
      description: El cuerpo no se puede parsear o está malformado (JSON inválido, multipart roto).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Sin token, token inválido, sesión revocada o expirada por inactividad; en `POST /auth/login`, 
        credenciales inválidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            sesionInvalida:
              summary: Token ausente, inválido, sesión revocada o 60 minutos sin actividad
              value:
                codigo: sesion_invalida
                mensaje: La sesión no es válida o expiró; inicie sesión de nuevo
            credencialesInvalidas:
              summary: Credenciales inválidas en POST /auth/login (RF-26-AC-2)
              value:
                codigo: credenciales_invalidas
                mensaje: Correo o contraseña incorrectos
    Forbidden:
      description: Autenticado, pero el rol o la relación del usuario con el recurso no permiten la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            sinPermiso:
              summary: Rol o relación con el parque sin permiso para la operación
              value:
                codigo: sin_permiso
                mensaje: No tiene permiso para realizar esta operación
    NotFound:
      description: No existe el recurso de la ruta, o el usuario no tiene relación con él que le permita saber que 
        existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicto con el estado actual del recurso destino (duplicado o transición de estado no permitida).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Cuerpo o parámetros bien formados que violan una regla de esquema o de negocio; `mensaje` lleva el 
        texto literal del SRS cuando el AC lo da.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Cuenta bloqueada temporalmente por 5 intentos fallidos consecutivos.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Gone:
      description: El enlace de un solo uso ya se usó o venció.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: El archivo supera el límite configurado de tamaño.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Salud:
      type: object
      required: [estado, baseDatos, ultimaCorridaWorker]
      properties:
        estado:
          type: string
          enum: [ok, degradado]
        baseDatos:
          type: string
          enum: [ok, sin_respuesta]
        ultimaCorridaWorker:
          type: string
          format: date-time
          nullable: true
          description: Fecha y hora de la última corrida de la revisión diaria de plazos; nulo si nunca ha corrido.
    # ---------------------------------------------------- Enumeraciones
    Rol:
      type: string
      description: |
        Rol global del usuario. "Consultor asignado" y "consultor de comité" no son roles: son relaciones de un
        usuario con rol `consultor` con un parque (asignación vigente) o con una sesión de comité.
      enum:
        - coordinacion_ampip
        - director_general_ampip
        - appi
        - consultor
        - gerente_corporativo
        - administrador_tecnico
    TipoPI:
      type: string
      enum: [construccion_abierto, construccion_cerrado, operacion_abierto, operacion_cerrado]
    Marca:
      type: string
      enum: [O, R, NA]
    MarcaAplicable:
      type: string
      description: Marca de un criterio aplicable al parque (los NA no se listan).
      enum: [O, R]
    Region:
      type: string
      description: |
        Estado de la República, como clave ISO 3166-2:MX. MX-AGU Aguascalientes, MX-BCN Baja California, MX-BCS Baja
        California Sur, MX-CAM Campeche, MX-CHP Chiapas, MX-CHH Chihuahua, MX-CMX Ciudad de México, MX-COA Coahuila,
        MX-COL Colima, MX-DUR Durango, MX-GUA Guanajuato, MX-GRO Guerrero, MX-HID Hidalgo, MX-JAL Jalisco, MX-MEX
        Estado de México, MX-MIC Michoacán, MX-MOR Morelos, MX-NAY Nayarit, MX-NLE Nuevo León, MX-OAX Oaxaca, MX-PUE
        Puebla, MX-QUE Querétaro, MX-ROO Quintana Roo, MX-SLP San Luis Potosí, MX-SIN Sinaloa, MX-SON Sonora, MX-TAB
        Tabasco, MX-TAM Tamaulipas, MX-TLA Tlaxcala, MX-VER Veracruz, MX-YUC Yucatán, MX-ZAC Zacatecas. La SPA
        presenta el nombre.
      enum:
        - MX-AGU
        - MX-BCN
        - MX-BCS
        - MX-CAM
        - MX-CHP
        - MX-CHH
        - MX-CMX
        - MX-COA
        - MX-COL
        - MX-DUR
        - MX-GUA
        - MX-GRO
        - MX-HID
        - MX-JAL
        - MX-MEX
        - MX-MIC
        - MX-MOR
        - MX-NAY
        - MX-NLE
        - MX-OAX
        - MX-PUE
        - MX-QUE
        - MX-ROO
        - MX-SLP
        - MX-SIN
        - MX-SON
        - MX-TAB
        - MX-TAM
        - MX-TLA
        - MX-VER
        - MX-YUC
        - MX-ZAC
      example: MX-NLE
    EstadoParque:
      type: string
      description: '`inactivo` = dado de baja (RF-29); `historico` = alta mínima sin expediente (RF-31).'
      enum: [activo, inactivo, historico]
    EstadoUsuario:
      type: string
      enum: [pendiente_activacion, activo, inactivo]
    EstadoEvidencia:
      type: string
      enum: [enviada, observada, aceptada]
      description: Alias histórico de EstadoVinculo para el filtro `estado` de los listados.
    EstadoCalificacion:
      type: string
      enum: [pendiente, en_revision, cumplido, no_cumplido]
    CategoriaEvidencia:
      type: string
      description: '`administrativa` la puede abrir Coordinación AMPIP; `seguridad` no.'
      enum: [administrativa, seguridad]
    Fase:
      type: string
      enum:
        - diagnostico
        - plan_trabajo
        - politica_seguridad
        - analisis_riesgos
        - implementacion_estandares
        - opinion_intermedia_emitida
        - opinion_final_emitida
        - evaluacion_desempeno
        - dictamen
    TipoPINulable:
      type: string
      nullable: true
      description: Tipo de PI; nulo en parques históricos.
      enum: [construccion_abierto, construccion_cerrado, operacion_abierto, operacion_cerrado, null]
    FaseNulable:
      type: string
      nullable: true
      description: Fase del parque; nula en parques históricos.
      enum:
        - diagnostico
        - plan_trabajo
        - politica_seguridad
        - analisis_riesgos
        - implementacion_estandares
        - opinion_intermedia_emitida
        - opinion_final_emitida
        - evaluacion_desempeno
        - dictamen
        - 
    RespuestaAutoevaluacion:
      type: string
      enum: [cumple, cumple_parcial, no_cumple]
    TipoOpinion:
      type: string
      enum: [intermedia, final]
    TipoDictamen:
      type: string
      enum: [otorgar, no_otorgar]
    EstadoDictamen:
      type: string
      enum: [borrador, firmado]
    EstadoSesionComite:
      type: string
      enum: [abierta, cerrada]

    # ---------------------------------------------------- Comunes
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Código estable en snake_case para que la SPA distinga casos sin comparar textos.
          example: tipo_pi_invalido
        mensaje:
          type: string
          description: Texto para el usuario; es el texto literal del SRS cuando el AC lo da.
          example: Debe seleccionar un tipo de PI válido
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleError'
    DetalleError:
      type: object
      required: [campo, problema]
      properties:
        campo:
          type: string
          example: marca_operacion_cerrado
        problema:
          type: string
          example: 'Fila 12: el valor "X" no es O, R ni NA'
    Paginacion:
      type: object
      required: [pagina, tamanoPagina, total]
      properties:
        pagina:
          type: integer
          minimum: 1
        tamanoPagina:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0

    # ---------------------------------------------------- Autenticación
    SesionCreate:
      type: object
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
        contrasena:
          type: string
          format: password
    SesionCreada:
      type: object
      required: [token, tipoToken, expiraEn, expiraPorInactividadMin, usuario]
      properties:
        token:
          type: string
          description: JWT con `sub`, `sid`, `iat` y `exp`.
        tipoToken:
          type: string
          enum: [Bearer]
        expiraEn:
          type: string
          format: date-time
          description: Expiración absoluta del token (`exp`), según `JWT_EXPIRATION`.
        expiraPorInactividadMin:
          type: integer
          example: 60
        usuario:
          $ref: '#/components/schemas/Usuario'

    SesionActual:
      type: object
      required: [sesionId, inicio, ultimaActividad, expiraPorInactividadMin, usuario]
      properties:
        sesionId:
          type: string
          format: uuid
        inicio:
          type: string
          format: date-time
        ultimaActividad:
          type: string
          format: date-time
        expiraPorInactividadMin:
          type: integer
          example: 60
        usuario:
          $ref: '#/components/schemas/Usuario'
    RecuperacionContrasenaCreate:
      type: object
      required: [correo]
      properties:
        correo:
          type: string
          format: email
    VersionCatalogoCreate:
      type: object
      required: [archivo, nombreVersion]
      properties:
        archivo:
          type: string
          format: binary
          description: CSV con las ocho columnas del catálogo.
        nombreVersion:
          type: string
          example: catalogo-2023-v1
    VersionCatalogo:
      type: object
      required: [id, nombre, vigente, totalCriterios, fechaCarga, cargadoPor, estado]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          example: catalogo-2023-v1
        vigente:
          type: boolean
        totalCriterios:
          type: integer
          example: 286
        fechaCarga:
          type: string
          format: date-time
        cargadoPor:
          type: string
          format: uuid
        estado:
          type: string
          enum: [activa, solo_lectura]
          description: Una versión queda en solo lectura cuando una generación nueva activa otra versión.
    MarcasPorTipo:
      type: object
      required: [construccionAbierto, construccionCerrado, operacionAbierto, operacionCerrado]
      properties:
        construccionAbierto:
          $ref: '#/components/schemas/Marca'
        construccionCerrado:
          $ref: '#/components/schemas/Marca'
        operacionAbierto:
          $ref: '#/components/schemas/Marca'
        operacionCerrado:
          $ref: '#/components/schemas/Marca'
    Criterio:
      type: object
      required: [id, versionCatalogoId, estandar, subestandar, clave, texto, metodoVerificacion, categoriaEvidencia, 
            evidenciaSuficiente]
      properties:
        id:
          type: string
          format: uuid
        versionCatalogoId:
          type: string
          format: uuid
        estandar:
          type: integer
          minimum: 1
          maximum: 10
        subestandar:
          type: string
          example: '2.8'
        clave:
          type: string
          example: '2.8.1'
        texto:
          type: string
        metodoVerificacion:
          type: string
        categoriaEvidencia:
          $ref: '#/components/schemas/CategoriaEvidencia'
        evidenciaSuficiente:
          type: string
          nullable: true
        marcas:
          $ref: '#/components/schemas/MarcasPorTipo'
    CriterioUpdate:
      type: object
      required: [evidenciaSuficiente]
      properties:
        evidenciaSuficiente:
          type: string
          minLength: 1
          maxLength: 4000
          example: reproducir en el grabador la grabación de hace 30 días con foto de la pantalla con fecha visible, más
            el protocolo de retención

    # ---------------------------------------------------- Generaciones
    GeneracionCreate:
      type: object
      required: [nombre, fechaInicio, versionCatalogoId]
      properties:
        nombre:
          type: string
          example: '2027'
        fechaInicio:
          type: string
          format: date
          example: '2027-02-01'
        versionCatalogoId:
          type: string
          format: uuid
    Generacion:
      type: object
      required: [id, nombre, fechaInicio, versionCatalogoId, versionCatalogoNombre, totalParques]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          example: '2027'
        fechaInicio:
          type: string
          format: date
        versionCatalogoId:
          type: string
          format: uuid
        versionCatalogoNombre:
          type: string
          example: catalogo-2023-v1
        totalParques:
          type: integer

    # ---------------------------------------------------- Parques
    ParqueAlta:
      description: Cuerpo del alta de parque; `tipoRegistro` decide el esquema.
      oneOf:
        - $ref: '#/components/schemas/ParqueCreate'
        - $ref: '#/components/schemas/ParqueHistoricoCreate'
      discriminator:
        propertyName: tipoRegistro
        mapping:
          activo: '#/components/schemas/ParqueCreate'
          historico: '#/components/schemas/ParqueHistoricoCreate'
    ParqueCreate:
      type: object
      required: [tipoRegistro, nombre, desarrollador, tipoPI, region, generacionId]
      properties:
        tipoRegistro:
          type: string
          enum: [activo]
        nombre:
          type: string
          minLength: 1
        desarrollador:
          type: string
          minLength: 1
        tipoPI:
          $ref: '#/components/schemas/TipoPI'
        region:
          $ref: '#/components/schemas/Region'
        generacionId:
          type: string
          format: uuid
    ParqueHistoricoCreate:
      type: object
      required: [tipoRegistro, nombre, region, fechaUltimoDictamen, fechaTerminoPrograma]
      properties:
        tipoRegistro:
          type: string
          enum: [historico]
        nombre:
          type: string
          minLength: 1
          example: Parque Y
        region:
          $ref: '#/components/schemas/Region'
        fechaUltimoDictamen:
          type: string
          format: date
          example: '2022-03-15'
        fechaTerminoPrograma:
          type: string
          format: date
          example: '2022-01-10'
    ParqueUpdate:
      type: object
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 1
        desarrollador:
          type: string
          minLength: 1
        region:
          $ref: '#/components/schemas/Region'
        fechaTerminoPrograma:
          type: string
          format: date
          example: '2027-11-30'
        fechaProximaActualizacion:
          type: string
          format: date
          example: '2028-02-01'
        estado:
          type: string
          description: Baja lógica del parque.
          enum: [inactivo]
        motivo:
          type: string
          minLength: 1
          description: Motivo de la baja; obligatorio con `estado`.
    Parque:
      type: object
      required: [id, tipoRegistro, nombre, region, estado, fechaAlta, atrasadoActualizacion]
      properties:
        id:
          type: string
          format: uuid
        tipoRegistro:
          type: string
          enum: [activo, historico]
        nombre:
          type: string
        desarrollador:
          type: string
          nullable: true
        tipoPI:
          $ref: '#/components/schemas/TipoPINulable'
        region:
          $ref: '#/components/schemas/Region'
        generacionId:
          type: string
          format: uuid
          nullable: true
        estado:
          $ref: '#/components/schemas/EstadoParque'
        fase:
          $ref: '#/components/schemas/FaseNulable'
        fechaAlta:
          type: string
          format: date
        versionCatalogo:
          type: string
          nullable: true
          description: Versión del catálogo contra la que se evaluó el parque; solo lectura.
          example: catalogo-2023-v1
        consultorAsignadoId:
          type: string
          format: uuid
          nullable: true
        fechaTerminoPrograma:
          type: string
          format: date
          nullable: true
        fechaProximaActualizacion:
          type: string
          format: date
          nullable: true
        fechaUltimaActualizacion:
          type: string
          format: date
          nullable: true
        fechaUltimoDictamen:
          type: string
          format: date
          nullable: true
        atrasadoActualizacion:
          type: boolean
          description: Fecha de próxima actualización vencida sin actualización registrada (RF-30).
        motivoBaja:
          type: string
          nullable: true
        contactoPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: Nulo si el parque no tiene contacto principal (RF-34-AC-3).
    PaginaParques:
      allOf:
        - $ref: '#/components/schemas/Paginacion'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Parque'
    CambioTipoPI:
      type: object
      required: [tipoPI, fechaCambio, motivo]
      properties:
        tipoPI:
          $ref: '#/components/schemas/TipoPI'
        fechaCambio:
          type: string
          format: date
          example: '2027-06-01'
        motivo:
          type: string
          minLength: 1
    CambioTipoPIResultado:
      type: object
      required: [parque, cambio, criteriosQueDejanDeSerNA, criteriosQuePasanANA]
      properties:
        parque:
          $ref: '#/components/schemas/Parque'
        cambio:
          type: boolean
          description: Falso cuando el tipo enviado era el vigente y la operación no tuvo efectos.
        clasificacionCerrada:
          $ref: '#/components/schemas/ClasificacionTipoPI'
        clasificacionNueva:
          $ref: '#/components/schemas/ClasificacionTipoPI'
        criteriosQueDejanDeSerNA:
          type: array
          description: Criterios que pasan de NA a O o R y entran en "pendiente".
          items:
            type: string
            format: uuid
        criteriosQuePasanANA:
          type: array
          items:
            type: string
            format: uuid
    ClasificacionTipoPI:
      type: object
      required: [id, tipoPI, fechaDesde, fechaHasta]
      properties:
        id:
          type: string
          format: uuid
        tipoPI:
          $ref: '#/components/schemas/TipoPI'
        fechaDesde:
          type: string
          format: date
        fechaHasta:
          type: string
          format: date
          nullable: true
        porcentajeObligatoriosAlCierre:
          type: number
          format: float
          nullable: true
          example: 85.0
        porcentajeAvanceGeneralAlCierre:
          type: number
          format: float
          nullable: true
        motivo:
          type: string
          nullable: true
        cambiadoPor:
          type: string
          format: uuid
          nullable: true
    ActualizacionAnualCreate:
      type: object
      required: [fecha]
      properties:
        fecha:
          type: string
          format: date
        notas:
          type: string
    ActualizacionAnual:
      type: object
      required: [id, parqueId, fecha, fechaProximaActualizacion, registradoPor]
      properties:
        id:
          type: string
          format: uuid
        parqueId:
          type: string
          format: uuid
        fecha:
          type: string
          format: date
        fechaProximaActualizacion:
          type: string
          format: date
          description: Un año después de `fecha`.
        notas:
          type: string
          nullable: true
        registradoPor:
          type: string
          format: uuid
    HistorialParque:
      type: object
      required: [parque, generaciones, actualizacionesAnuales, autoevaluaciones, opiniones, dictamenes]
      properties:
        parque:
          $ref: '#/components/schemas/Parque'
        generaciones:
          type: array
          items:
            $ref: '#/components/schemas/Generacion'
        actualizacionesAnuales:
          type: array
          items:
            $ref: '#/components/schemas/ActualizacionAnual'
        autoevaluaciones:
          type: array
          items:
            $ref: '#/components/schemas/Autoevaluacion'
        opiniones:
          type: array
          items:
            $ref: '#/components/schemas/OpinionCumplimiento'
        dictamenes:
          type: array
          items:
            $ref: '#/components/schemas/Dictamen'

    # ---------------------------------------------------- Usuarios
    UsuarioCreate:
      type: object
      required: [correo, nombre, rol]
      properties:
        correo:
          type: string
          format: email
          example: gerente@parquex.mx
        nombre:
          type: string
          minLength: 1
        rol:
          $ref: '#/components/schemas/Rol'
        parqueId:
          type: string
          format: uuid
          description: Obligatorio para el rol `appi`; se ignora en los demás.
        desarrollador:
          type: string
          description: Obligatorio para el rol `gerente_corporativo`; se ignora en los demás.
    UsuarioUpdate:
      type: object
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 1
        rol:
          $ref: '#/components/schemas/Rol'
        parqueId:
          type: string
          format: uuid
        desarrollador:
          type: string
        estado:
          type: string
          description: Baja lógica del usuario.
          enum: [inactivo]
        motivo:
          type: string
          minLength: 1
          description: Motivo de la baja; obligatorio con `estado`.
    Usuario:
      type: object
      required: [id, correo, nombre, rol, estado, fechaAlta]
      properties:
        id:
          type: string
          format: uuid
        correo:
          type: string
          format: email
        nombre:
          type: string
        rol:
          $ref: '#/components/schemas/Rol'
        parqueId:
          type: string
          format: uuid
          nullable: true
        desarrollador:
          type: string
          nullable: true
        estado:
          $ref: '#/components/schemas/EstadoUsuario'
        fechaAlta:
          type: string
          format: date-time
    PaginaUsuarios:
      allOf:
        - $ref: '#/components/schemas/Paginacion'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Usuario'

    # ---------------------------------------------------- Asignaciones
    AsignacionConsultorCreate:
      type: object
      required: [consultorId]
      properties:
        consultorId:
          type: string
          format: uuid
    AsignacionConsultor:
      type: object
      required: [id, parqueId, generacionId, consultorId, consultorNombre, vigenteDesde, vigenteHasta, vigente]
      properties:
        id:
          type: string
          format: uuid
        parqueId:
          type: string
          format: uuid
        generacionId:
          type: string
          format: uuid
        consultorId:
          type: string
          format: uuid
        consultorNombre:
          type: string
        vigenteDesde:
          type: string
          format: date-time
        vigenteHasta:
          type: string
          format: date-time
          nullable: true
        vigente:
          type: boolean

    # ---------------------------------------------------- Criterios del parque
    CriterioParque:
      type: object
      required: [criterioId, clave, estandar, texto, marca, estadoCalificacion, fechaUltimoCambio, registradoPor, 
            atrasado, totalEvidencias]
      properties:
        criterioId:
          type: string
          format: uuid
        clave:
          type: string
          example: '2.8.1'
        estandar:
          type: integer
          minimum: 1
          maximum: 10
        texto:
          type: string
        marca:
          $ref: '#/components/schemas/MarcaAplicable'
        evidenciaSuficiente:
          type: string
          nullable: true
        estadoCalificacion:
          $ref: '#/components/schemas/EstadoCalificacion'
        fechaUltimoCambio:
          type: string
          format: date-time
          nullable: true
        registradoPor:
          type: string
          nullable: true
          description: Nombre del usuario que registró el último cambio.
        atrasado:
          type: boolean
        totalEvidencias:
          type: integer
          minimum: 0
    CriterioParqueUpdate:
      type: object
      required: [estadoCalificacion]
      properties:
        estadoCalificacion:
          type: string
          description: '`cumplido` o `no_cumplido` califican; `en_revision` reabre un criterio calificado.'
          enum: [cumplido, no_cumplido, en_revision]
        motivo:
          type: string
          minLength: 1
          description: Obligatorio para reabrir (`en_revision`); opcional al calificar.
          example: cambió la configuración de accesos del parque
    PaginaCriteriosParque:
      allOf:
        - $ref: '#/components/schemas/Paginacion'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CriterioParque'

    # ---------------------------------------------------- Autoevaluación
    AutoevaluacionUpsert:
      type: object
      required: [respuesta]
      properties:
        respuesta:
          $ref: '#/components/schemas/RespuestaAutoevaluacion'
        comentario:
          type: string
    Autoevaluacion:
      type: object
      required: [parqueId, generacionId, criterioId, respuesta, versionCatalogo, registradoPor, fecha]
      properties:
        parqueId:
          type: string
          format: uuid
        generacionId:
          type: string
          format: uuid
        criterioId:
          type: string
          format: uuid
        respuesta:
          $ref: '#/components/schemas/RespuestaAutoevaluacion'
        comentario:
          type: string
          nullable: true
        versionCatalogo:
          type: string
          example: catalogo-2023-v1
        registradoPor:
          type: string
          format: uuid
        fecha:
          type: string
          format: date-time
    PaginaAutoevaluaciones:
      allOf:
        - $ref: '#/components/schemas/Paginacion'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Autoevaluacion'

    # ---------------------------------------------------- Evidencias
    EvidenciaCreate:
      type: object
      required: [archivos, criterioIds, fase]
      properties:
        archivos:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: binary
          description: PDF, JPG, PNG, HEIC, XLSX o DOCX; cada archivo hasta el límite configurado (inclusive).
        criterioIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
          description: Criterios del parque a los que se vincula cada archivo (C-19).
        fase:
          $ref: '#/components/schemas/Fase'
        descripcion:
          type: string

    VersionEvidenciaCreate:
      type: object
      required: [archivo]
      properties:
        archivo:
          type: string
          format: binary
          description: PDF, JPG, PNG, HEIC, XLSX o DOCX; máximo 104,857,600 bytes inclusive.
        comentario:
          type: string
    Evidencia:
      type: object
      required: [id, parqueId, fase, categoria, nombreArchivo, tipoMime, tamanoBytes, versionActual, autorId, fechaCarga,
        eliminada, vinculos]
      properties:
        id:
          type: string
          format: uuid
        parqueId:
          type: string
          format: uuid
        fase:
          $ref: '#/components/schemas/Fase'
        categoria:
          $ref: '#/components/schemas/CategoriaEvidencia'
        nombreArchivo:
          type: string
        tipoMime:
          type: string
          enum:
            - application/pdf
            - image/jpeg
            - image/png
            - image/heic
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        tamanoBytes:
          type: integer
          minimum: 1
          maximum: 104857600
        versionActual:
          type: integer
          minimum: 1
        autorId:
          type: string
          format: uuid
        fechaCarga:
          type: string
          format: date-time
        descripcion:
          type: string
          nullable: true
        eliminada:
          type: boolean
          description: Baja lógica (RF-05-AC-9); la evidencia sigue en el historial.
        eliminadaEn:
          type: string
          format: date-time
          nullable: true
        eliminadaPor:
          type: string
          format: uuid
          nullable: true
        vinculos:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VinculoEvidencia'

    VersionEvidencia:
      type: object
      required: [numero, fechaCarga, autorId, tamanoBytes]
      properties:
        numero:
          type: integer
          minimum: 1
        fechaCarga:
          type: string
          format: date-time
        autorId:
          type: string
          format: uuid
        tamanoBytes:
          type: integer
          maximum: 104857600
    EvidenciaDetalle:
      allOf:
        - $ref: '#/components/schemas/Evidencia'
        - type: object
          required: [versiones, observaciones]
          properties:
            versiones:
              type: array
              items:
                $ref: '#/components/schemas/VersionEvidencia'
            observaciones:
              type: array
              items:
                $ref: '#/components/schemas/Observacion'
    ObservacionCreate:
      type: object
      required: [criterioId, motivo]
      properties:
        criterioId:
          type: string
          format: uuid
          description: Vínculo que se observa; los demás vínculos de la misma evidencia no cambian.
        motivo:
          type: string
          minLength: 1
          example: Falta el protocolo de retención del grabador

    Observacion:
      type: object
      required: [id, evidenciaId, criterioId, motivo, consultorId, fecha, notificadoAAppi]
      properties:
        id:
          type: string
          format: uuid
        evidenciaId:
          type: string
          format: uuid
        criterioId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          description: Versión de la evidencia observada (RF-05-AC-6).
        motivo:
          type: string
        consultorId:
          type: string
          format: uuid
        fecha:
          type: string
          format: date-time
        notificadoAAppi:
          type: boolean

    PaginaEvidencias:
      allOf:
        - $ref: '#/components/schemas/Paginacion'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Evidencia'

    # ---------------------------------------------------- Cumplimiento
    CifrasCumplimiento:
      type: object
      required: [obligatoriosAplicables, obligatoriosCumplidos, recomendadosAplicables, recomendadosCumplidos, 
            porcentajeObligatorios, porcentajeAvanceGeneral, noAplica, porcentajeRecomendados]
      properties:
        obligatoriosAplicables:
          type: integer
        obligatoriosCumplidos:
          type: integer
        recomendadosAplicables:
          type: integer
        recomendadosCumplidos:
          type: integer
        porcentajeObligatorios:
          type: number
          format: float
          nullable: true
          example: 90.0
        porcentajeAvanceGeneral:
          type: number
          format: float
          nullable: true
          example: 84.0
        noAplica:
          type: boolean
          description: Verdadero cuando no hay criterios O aplicables; la interfaz muestra "No aplica".
        porcentajeRecomendados:
          type: number
          format: float
          nullable: true
          example: 60.0
          description: Criterios R cumplidos entre R aplicables; nulo si no hay R aplicables.
      description: Los globales se calculan sumando criterios de los 10 estándares, nunca promediando porcentajes.
    CumplimientoEstandar:
      allOf:
        - type: object
          required: [estandar]
          properties:
            estandar:
              type: integer
              minimum: 1
              maximum: 10
        - $ref: '#/components/schemas/CifrasCumplimiento'
    Cumplimiento:
      type: object
      required: [parqueId, tipoPI, fechaCalculo, total, porEstandar]
      properties:
        parqueId:
          type: string
          format: uuid
        tipoPI:
          $ref: '#/components/schemas/TipoPI'
        fechaCalculo:
          type: string
          format: date-time
        total:
          $ref: '#/components/schemas/CifrasCumplimiento'
        porEstandar:
          type: array
          items:
            $ref: '#/components/schemas/CumplimientoEstandar'

    # ---------------------------------------------------- Plan de trabajo
    RenglonPlanTrabajoCreate:
      type: object
      required: [criterioId, responsableId, fechaComprometida]
      properties:
        criterioId:
          type: string
          format: uuid
        responsableId:
          type: string
          format: uuid
          description: Usuario con rol APPI del mismo parque.
        fechaComprometida:
          type: string
          format: date
          example: '2027-04-15'
    RenglonPlanTrabajoUpdate:
      type: object
      minProperties: 1
      properties:
        responsableId:
          type: string
          format: uuid
          description: Usuario con rol APPI del mismo parque.
        fechaComprometida:
          type: string
          format: date
    RenglonPlanTrabajo:
      type: object
      required: [id, parqueId, criterioId, responsableId, responsableNombre, fechaComprometida, estadoCriterio, atrasado,
        fechaMarcaAtraso]
      properties:
        id:
          type: string
          format: uuid
        parqueId:
          type: string
          format: uuid
        criterioId:
          type: string
          format: uuid
        responsableId:
          type: string
          format: uuid
        responsableNombre:
          type: string
        fechaComprometida:
          type: string
          format: date
        estadoCriterio:
          $ref: '#/components/schemas/EstadoCalificacion'
        atrasado:
          type: boolean
        fechaMarcaAtraso:
          type: string
          format: date
          nullable: true
    PaginaPlanTrabajo:
      allOf:
        - $ref: '#/components/schemas/Paginacion'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RenglonPlanTrabajo'

    # ---------------------------------------------------- Análisis de riesgos
    RevisionAnalisisRiesgosCreate:
      type: object
      required: [fechaRevision, version, firmante, resumen]
      properties:
        fechaRevision:
          type: string
          format: date
          example: '2027-03-10'
        version:
          type: string
          example: '1.0'
        firmante:
          type: string
          example: María López, gerente del parque
        resumen:
          type: string
          example: 12 riesgos identificados, 4 altos, con plan de tratamiento
    RevisionAnalisisRiesgos:
      type: object
      required: [id, parqueId, fechaRevision, version, firmante, resumen, ciclo, vigente, registradoPor]
      properties:
        id:
          type: string
          format: uuid
        parqueId:
          type: string
          format: uuid
        fechaRevision:
          type: string
          format: date
        version:
          type: string
        firmante:
          type: string
        resumen:
          type: string
        ciclo:
          type: string
          description: Generación en curso o periodo de renovación al que pertenece.
        vigente:
          type: boolean
        registradoPor:
          type: string
          format: uuid
    DocumentoAnalisisRiesgosUpload:
      type: object
      required: [archivo]
      properties:
        archivo:
          type: string
          format: binary
    DocumentoAnalisisRiesgos:
      type: object
      required: [parqueId, nombreArchivo, tamanoBytes, fechaCarga, subidoPor]
      properties:
        parqueId:
          type: string
          format: uuid
        nombreArchivo:
          type: string
        tamanoBytes:
          type: integer
        fechaCarga:
          type: string
          format: date-time
        subidoPor:
          type: string
          format: uuid

    # ---------------------------------------------------- Opiniones de Cumplimiento
    OpinionCumplimientoCreate:
      type: object
      required: [tipo]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoOpinion'
        favorable:
          type: boolean
          description: Obligatorio cuando `tipo` es `final`; se ignora en la intermedia.
        comentarios:
          type: string
    OpinionCumplimiento:
      type: object
      required: [id, parqueId, generacionId, tipo, favorable, porcentajeObligatorios, porcentajeAvanceGeneral, 
            consultorId, fecha]
      properties:
        id:
          type: string
          format: uuid
        parqueId:
          type: string
          format: uuid
        generacionId:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoOpinion'
        favorable:
          type: boolean
          nullable: true
          description: Nulo en la intermedia.
        porcentajeObligatorios:
          type: number
          format: float
          nullable: true
        porcentajeAvanceGeneral:
          type: number
          format: float
          nullable: true
        consultorId:
          type: string
          format: uuid
        fecha:
          type: string
          format: date-time
        comentarios:
          type: string
          nullable: true

    # ---------------------------------------------------- Comité
    SesionComiteCreate:
      type: object
      required: [consultorComiteId]
      properties:
        consultorComiteId:
          type: string
          format: uuid
    SesionComiteUpdate:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [cerrada]
    SesionComite:
      type: object
      required: [id, parqueId, generacionId, consultorComiteId, estado, fechaApertura, fechaCierre]
      properties:
        id:
          type: string
          format: uuid
        parqueId:
          type: string
          format: uuid
        generacionId:
          type: string
          format: uuid
        consultorComiteId:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/EstadoSesionComite'
        fechaApertura:
          type: string
          format: date-time
        fechaCierre:
          type: string
          format: date-time
          nullable: true
          description: Momento del cierre; nulo mientras la sesión está abierta.
    ElegibilidadComite:
      type: object
      required: [elegible, autoevaluacionRevisada, criteriosPendientesOEnRevision, opinionFinalFavorable, motivos]
      properties:
        elegible:
          type: boolean
        autoevaluacionRevisada:
          type: boolean
        criteriosPendientesOEnRevision:
          type: integer
          minimum: 0
        opinionFinalFavorable:
          type: boolean
        motivos:
          type: array
          description: Errores que devolvería la apertura de la sesión, con su `codigo` y `mensaje` literal.
          items:
            $ref: '#/components/schemas/Error'
    ExpedienteComite:
      type: object
      description: Expediente de solo lectura para el comité; no incluye el análisis de riesgos.
      required: [sesion, parque, cumplimiento, criterios, opiniones, evidencias]
      properties:
        sesion:
          $ref: '#/components/schemas/SesionComite'
        parque:
          $ref: '#/components/schemas/Parque'
        cumplimiento:
          $ref: '#/components/schemas/Cumplimiento'
        criterios:
          type: array
          items:
            $ref: '#/components/schemas/CriterioParque'
        opiniones:
          type: array
          items:
            $ref: '#/components/schemas/OpinionCumplimiento'
        evidencias:
          type: array
          items:
            $ref: '#/components/schemas/Evidencia'

    # ---------------------------------------------------- Dictámenes
    DictamenCreate:
      type: object
      required: [tipo, motivo]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDictamen'
        motivo:
          type: string
          minLength: 1
    DictamenEdicion:
      type: object
      description: Corrección de un dictamen en "borrador".
      minProperties: 1
      additionalProperties: false
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDictamen'
        motivo:
          type: string
          minLength: 1
    DictamenFirma:
      type: object
      description: Firma del dictamen por el Director General AMPIP.
      required: [estado]
      additionalProperties: false
      properties:
        estado:
          type: string
          enum: [firmado]
    Dictamen:
      type: object
      required: [id, parqueId, generacionId, sesionComiteId, tipo, motivo, estado, capturadoPor, fechaCaptura, 
            firmadoPor, fechaFirma, vigenciaHasta]
      properties:
        id:
          type: string
          format: uuid
        parqueId:
          type: string
          format: uuid
        generacionId:
          type: string
          format: uuid
        sesionComiteId:
          type: string
          format: uuid
          nullable: true
          description: Nulo si el dictamen se capturó sin sesión de comité abierta.
        tipo:
          $ref: '#/components/schemas/TipoDictamen'
        motivo:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoDictamen'
        capturadoPor:
          type: string
          format: uuid
        fechaCaptura:
          type: string
          format: date-time
        firmadoPor:
          type: string
          format: uuid
          nullable: true
        fechaFirma:
          type: string
          format: date-time
          nullable: true
        vigenciaHasta:
          type: string
          format: date
          nullable: true
          description: Solo para "otorgar" firmado; tres años desde la firma (RD-08, pendiente de confirmar con AMPIP).

    # ---------------------------------------------------- Reportes
      description: "Un dictamen por expediente (parque y generación). `sesionComiteId` es la sesión de comité abierta cuando
        se\ncapturó o se editó por última vez; es nulo si no había ninguna, como en el \"no otorgar\" de RF-14-AC-8.\n"
    AvanceParque:
      type: object
      required: [parqueId, nombre, desarrollador, region, fase, porcentajeObligatorios, porcentajeAvanceGeneral, 
            criteriosAtrasados, atrasadoActualizacion, fechaProximaActualizacion]
      properties:
        parqueId:
          type: string
          format: uuid
        nombre:
          type: string
        desarrollador:
          type: string
          nullable: true
        region:
          $ref: '#/components/schemas/Region'
        fase:
          $ref: '#/components/schemas/FaseNulable'
        porcentajeObligatorios:
          type: number
          format: float
          nullable: true
        porcentajeAvanceGeneral:
          type: number
          format: float
          nullable: true
        criteriosAtrasados:
          type: integer
          minimum: 0
        atrasadoActualizacion:
          type: boolean
          description: Fecha de actualización anual vencida sin actualización registrada.
        fechaProximaActualizacion:
          type: string
          format: date
          nullable: true
    RenglonReporteDireccion:
      type: object
      required: [parqueId, nombre, fase, atrasado, observacionesAbiertas]
      properties:
        parqueId:
          type: string
          format: uuid
        nombre:
          type: string
        fase:
          $ref: '#/components/schemas/FaseNulable'
        atrasado:
          type: boolean
        observacionesAbiertas:
          type: integer
          minimum: 0
    ReporteDireccionMensual:
      type: object
      required: [generacionId, mes, fechaGeneracion, parques]
      properties:
        generacionId:
          type: string
          format: uuid
        mes:
          type: string
          example: '2027-05'
        fechaGeneracion:
          type: string
          format: date-time
        parques:
          type: array
          items:
            $ref: '#/components/schemas/RenglonReporteDireccion'
    RegistroCreate:
      type: object
      required: [tokenInvitacion, contrasena]
      properties:
        tokenInvitacion:
          type: string
          minLength: 32
          description: Token de un solo uso que llegó en el correo de invitación (RF-03-AC-1).
        contrasena:
          type: string
          format: password
          minLength: 10
          writeOnly: true

    Configuracion:
      type: object
      required: [tamanoMaximoEvidenciaMB, vigenciaDistintivoAnios, actualizadoEn]
      properties:
        tamanoMaximoEvidenciaMB:
          type: integer
          minimum: 1
          maximum: 100
          example: 100
        vigenciaDistintivoAnios:
          type: integer
          minimum: 1
          maximum: 10
          example: 3
        actualizadoEn:
          type: string
          format: date-time
        actualizadoPor:
          type: string
          format: uuid
          nullable: true

    ConfiguracionUpdate:
      type: object
      minProperties: 1
      properties:
        tamanoMaximoEvidenciaMB:
          type: integer
          minimum: 1
          description: Valores mayores a 100 se rechazan con 422 `limite_excede_maximo`.
          example: 50
        vigenciaDistintivoAnios:
          type: integer
          minimum: 1
          maximum: 10

    CargaEvidencias:
      type: object
      required: [creadas, rechazadas]
      properties:
        creadas:
          type: array
          items:
            $ref: '#/components/schemas/Evidencia'
        rechazadas:
          type: array
          items:
            $ref: '#/components/schemas/ArchivoRechazado'

    ArchivoRechazado:
      type: object
      required: [nombreArchivo, codigo, mensaje]
      properties:
        nombreArchivo:
          type: string
        codigo:
          type: string
          example: archivo_excede_limite
        mensaje:
          type: string
          example: El archivo supera el límite de 100 MB

    EstadoVinculo:
      type: string
      description: Estado de la evidencia para un criterio (RF-05, RF-27). Vive en el vínculo, no en el archivo (C-19).
      enum: [enviada, observada, aceptada]
    VinculoEvidencia:
      type: object
      required: [evidenciaId, criterioId, claveCriterio, estado, fechaEstado, estadoCriterio]
      properties:
        evidenciaId:
          type: string
          format: uuid
        criterioId:
          type: string
          format: uuid
        claveCriterio:
          type: string
          example: '3.1'
        estado:
          $ref: '#/components/schemas/EstadoVinculo'
        fechaEstado:
          type: string
          format: date-time
        estadoCriterio:
          $ref: '#/components/schemas/EstadoCalificacion'

    VinculoEvidenciaUpdate:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          description: Única transición del consultor por PATCH; "observada" se registra con una Observación.
          enum: [aceptada]
    EstadoFase:
      type: string
      enum: [pendiente, en_proceso, completada, avanzada_por_excepcion]
    FaseExpediente:
      type: object
      required: [fase, orden, nombre, estado, actual]
      properties:
        fase:
          $ref: '#/components/schemas/Fase'
        orden:
          type: integer
          minimum: 1
          maximum: 9
        nombre:
          type: string
          example: Plan de trabajo
        estado:
          $ref: '#/components/schemas/EstadoFase'
        actual:
          type: boolean
        fechaInicio:
          type: string
          format: date-time
          nullable: true
        fechaCierre:
          type: string
          format: date-time
          nullable: true
        cerradaPor:
          type: string
          format: uuid
          nullable: true
        motivoExcepcion:
          type: string
          nullable: true

    AvanceFaseCreate:
      type: object
      required: [faseDestino]
      properties:
        faseDestino:
          $ref: '#/components/schemas/Fase'
        motivo:
          type: string
          description: Obligatorio; su ausencia responde 422 con el mensaje de RF-32-AC-4.
          example: Análisis entregado; el consultor lo revisa en la visita del 15 de abril

    EvaluacionDesempenoCreate:
      type: object
      required: [resultado]
      properties:
        resultado:
          type: string
          minLength: 1

    EvaluacionDesempeno:
      type: object
      required: [id, folio, parqueId, generacionId, fecha, consultorId, versionCatalogo, resultado]
      properties:
        id:
          type: string
          format: uuid
        folio:
          type: string
          pattern: ^ED-\d{4}-\d{4}$
          example: ED-2027-0007
        parqueId:
          type: string
          format: uuid
        generacionId:
          type: string
          format: uuid
        fecha:
          type: string
          format: date-time
        consultorId:
          type: string
          format: uuid
        versionCatalogo:
          type: string
          example: catalogo-2023-v1
        resultado:
          type: string

    UsuarioParque:
      allOf:
        - $ref: '#/components/schemas/Usuario'
        - type: object
          required: [contactoPrincipal]
          properties:
            contactoPrincipal:
              type: boolean

    ContactoPrincipalUpdate:
      type: object
      required: [usuarioId]
      properties:
        usuarioId:
          type: string
          format: uuid

    RegistroBitacora:
      type: object
      required: [id, fechaHora, accion, resultado]
      properties:
        id:
          type: integer
          format: int64
        fechaHora:
          type: string
          format: date-time
        usuarioId:
          type: string
          format: uuid
          nullable: true
        rol:
          type: string
          nullable: true
          description: Rol del usuario al momento de la operación (valor de `Rol`).
          enum: [coordinacion_ampip, director_general_ampip, appi, consultor, gerente_corporativo, administrador_tecnico,
            null]
        parqueId:
          type: string
          format: uuid
          nullable: true
        accion:
          type: string
          example: descargar
        recursoTipo:
          type: string
          nullable: true
          example: evidencia
        recursoId:
          type: string
          nullable: true
        resultado:
          type: string
          enum: [exitoso, denegado, fallido]
        detalle:
          type: string
          nullable: true

    PaginaBitacora:
      allOf:
        - $ref: '#/components/schemas/Paginacion'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RegistroBitacora'

    RecomendacionCreate:
      type: object
      required: [texto]
      properties:
        texto:
          type: string
          minLength: 1
          example: Incluir el plano con la ubicación de cámaras y el periodo de retención del grabador

    Recomendacion:
      type: object
      required: [id, parqueId, criterioId, texto, consultorId, fecha]
      properties:
        id:
          type: string
          format: uuid
        parqueId:
          type: string
          format: uuid
        criterioId:
          type: string
          format: uuid
        texto:
          type: string
        consultorId:
          type: string
          format: uuid
        fecha:
          type: string
          format: date-time
    CalificacionCriterio:
      type: object
      description: Un cambio del estado de calificación de un criterio del parque. Solo se agregan; nunca se editan.
      required: [id, criterioId, estadoAnterior, estadoNuevo, motivo, origen, consultorId, fecha]
      properties:
        id:
          type: string
          format: uuid
        criterioId:
          type: string
          format: uuid
        estadoAnterior:
          $ref: '#/components/schemas/EstadoCalificacion'
        estadoNuevo:
          $ref: '#/components/schemas/EstadoCalificacion'
        motivo:
          type: string
          nullable: true
          description: Obligatorio en la reapertura (RF-27-AC-8).
        origen:
          type: string
          enum: [consultor, sistema]
          description: '`sistema` para los cambios automáticos por evidencia enviada (RF-27-AC-4, RF-27-AC-7).'
        consultorId:
          type: string
          format: uuid
          nullable: true
          description: Nulo cuando `origen` es `sistema`.
        fecha:
          type: string
          format: date-time
    RestablecimientoContrasenaCreate:
      type: object
      required: [token, nuevaContrasena]
      properties:
        token:
          type: string
          minLength: 32
          description: Token del enlace de recuperación que llegó por correo.
        nuevaContrasena:
          type: string
          format: password
          minLength: 10
