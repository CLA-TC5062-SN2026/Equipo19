  # ================================================================ Usuarios
  /usuarios:
    get:
      tags: [Usuarios]
      operationId: listarUsuarios
      summary: Listar usuarios
      description: Lista usuarios con su rol y estado. Solo Coordinación AMPIP. `orden` admite `nombre`, `correo` y 
        `fechaAlta`.
      x-acceptance-criteria: [RF-03-AC-1]
      parameters:
        - name: rol
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Rol'
        - name: parqueId
          in: query
          required: false
          description: Usuarios APPI de ese parque.
          schema:
            type: string
            format: uuid
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoUsuario'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
        - $ref: '#/components/parameters/Orden'
      responses:
        '200':
          description: Página de usuarios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaUsuarios'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Usuarios]
      operationId: crearUsuario
      summary: Dar de alta usuario
      description: |
        Coordinación AMPIP da de alta un usuario con un rol. La cuenta se crea en "pendiente de activación" y se envía
        una invitación por correo, que se acepta con `POST /auth/register`. Para el rol `appi` se indica
        `parqueId`; para `gerente_corporativo`, `desarrollador`. El rol `consultor` es global: su relación con un
        parque solo se escribe con `POST /parques/{parqueId}/asignaciones-consultor`. La cuenta de
        `administrador_tecnico` se crea sin acceso a ningún parque ni evidencia.

        Errores:
        - 409 `correo_duplicado`: ya existe un usuario con ese correo.
        - 422 `roles_incompatibles`: "Un usuario no puede ser APPI y Consultor del mismo parque" (la regla se valida
          contra las asignaciones vigentes del usuario).
        - 422 `parque_no_existe`: `parqueId` no corresponde a ningún parque.
      x-acceptance-criteria: [RF-03-AC-1, RF-03-AC-2, RF-03-AC-3]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCreate'
      responses:
        '201':
          description: Usuario creado en "pendiente de activación".
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /usuarios/{usuarioId}:
    parameters:
      - $ref: '#/components/parameters/UsuarioId'
    get:
      tags: [Usuarios]
      operationId: obtenerUsuario
      summary: Consultar usuario
      description: Devuelve un usuario con su rol, parque o desarrollador y estado.
      x-acceptance-criteria: [RF-03-AC-1]
      responses:
        '200':
          description: Usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Usuarios]
      operationId: actualizarUsuario
      summary: Cambiar rol o dar de baja usuario
      description: |
        Coordinación AMPIP cambia el nombre o el rol del usuario, o lo da de baja con `estado: inactivo`. La baja
        revoca todas sus sesiones y cierra sus asignaciones de consultor vigentes, así que pierde de inmediato el
        acceso a todos los parques que tenía asignados. Repetir la baja de un usuario inactivo responde 200 sin
        efectos. Una APPI recibe 403, incluso sobre su propia cuenta.

        Errores:
        - 422 `roles_incompatibles`: "Un usuario no puede ser APPI y Consultor del mismo parque" (por ejemplo, cambiar
          a `appi` del parque X a un consultor con asignación vigente en X).
        - 422 `parque_no_existe`: `parqueId` no corresponde a ningún parque.
      x-acceptance-criteria: [RF-03-AC-2, RF-03-AC-3, RF-29-AC-1, RF-29-AC-2]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioUpdate'
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  # ================================================================ Asignaciones
  /parques/{parqueId}/asignaciones-consultor:
    parameters:
      - $ref: '#/components/parameters/ParqueId'
    get:
      tags: [Asignaciones]
      operationId: listarAsignacionesConsultor
      summary: Consultar historial de asignaciones de consultor
      description: Devuelve las asignaciones del parque, vigente y cerradas, con `vigenteDesde` y `vigenteHasta`.
      x-acceptance-criteria: [RF-10-AC-2]
      responses:
        '200':
          description: Historial de asignaciones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AsignacionConsultor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Asignaciones]
      operationId: crearAsignacionConsultor
      summary: Asignar o reasignar consultor al parque
      description: |
        Coordinación AMPIP crea la asignación vigente del parque. La generación se deriva del parque. Si había una
        asignación vigente, se cierra con `vigenteHasta` = momento de la operación, se conserva en el historial y el
        consultor anterior pierde el acceso al expediente desde ese momento. Una APPI recibe 403.

        Errores:
        - 409 `consultor_ya_asignado`: el consultor indicado ya es el asignado vigente del parque.
        - 422 `consultor_no_existe`: `consultorId` no corresponde a ningún usuario.
        - 422 `usuario_no_es_consultor`: el usuario no tiene rol `consultor` o está inactivo.
        - 422 `roles_incompatibles`: "Un usuario no puede ser APPI y Consultor del mismo parque".
      x-acceptance-criteria: [RF-10-AC-1, RF-10-AC-2, RF-10-AC-3, RF-03-AC-2]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignacionConsultorCreate'
      responses:
        '201':
          description: Asignación creada; la anterior quedó cerrada.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsignacionConsultor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /parques/{parqueId}/asignaciones-consultor/{asignacionId}:
    parameters:
      - $ref: '#/components/parameters/ParqueId'
      - $ref: '#/components/parameters/AsignacionId'
    get:
      tags: [Asignaciones]
      operationId: obtenerAsignacionConsultor
      summary: Consultar una asignación de consultor
      description: Devuelve una asignación consultor-parque-generación; es el destino del `Location` de su alta.
      x-acceptance-criteria: [RF-10-AC-1]
      responses:
        '200':
          description: Asignación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsignacionConsultor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ================================================================ Criterios del parque
  /parques/{parqueId}/criterios:
    parameters:
      - $ref: '#/components/parameters/ParqueId'
    get:
      tags: [Criterios del parque]
      operationId: listarCriteriosParque
      summary: Listar criterios aplicables del parque con su estado
      description: |
        Único listado de criterios de un parque. Devuelve solo los criterios O o R del tipo de PI del parque (omite
        los NA), con su estado de calificación, la fecha y el autor del último cambio y la marca `atrasado`. Es la vía
        para que la APPI y el consultor asignado vean los criterios aplicables sin descargar el archivo maestro, y
        para que AMPIP vea el estado de cada criterio. La respuesta no incluye enlaces al contenido de evidencias.

        `atrasado=true` devuelve el listado de atrasos del parque: criterios con fecha comprometida vencida sin llegar
        a "cumplido", según la revisión diaria de plazos. `orden` admite `clave`, `estandar` y `fechaUltimoCambio`
        (por defecto `clave`).
      x-acceptance-criteria: [RF-04-AC-1, RF-07-AC-1, RF-09-AC-2, RF-09-AC-3, RF-25-AC-1, RF-25-AC-4]
      parameters:
        - $ref: '#/components/parameters/Estandar'
        - name: marca
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MarcaAplicable'
        - name: estado
          in: query
          required: false
