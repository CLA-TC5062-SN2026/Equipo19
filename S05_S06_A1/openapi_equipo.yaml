      operationId: obtenerCumplimientoParque
      summary: Calcular cumplimiento del parque
      description: |
        Devuelve, total y por estándar, el cumplimiento de obligatorios (O cumplidos ÷ O aplicables × 100, sin NA) y
        el avance general ((O+R cumplidos) ÷ (O+R aplicables) × 100). Un estándar sin O aplicables reporta
        `noAplica: true` y `porcentajeObligatorios: null`. Los criterios "no cumplido" cuentan como no cumplidos; un R
        no cumplido no cuenta en contra del cumplimiento de O.
      x-acceptance-criteria: [RF-08-AC-1, RF-08-AC-2, RF-08-AC-3, RF-08-AC-4, RF-08-AC-5, RF-27-AC-2, RF-27-AC-6]
      responses:
        '200':
          description: Cifras de cumplimiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cumplimiento'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ================================================================ Plan de trabajo
