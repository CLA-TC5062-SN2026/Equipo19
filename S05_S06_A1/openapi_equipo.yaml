    post:
      tags: [Evidencias]
      operationId: crearEvidencias
      summary: Subir uno o varios archivos de evidencia vinculados a uno o varios criterios
      description: |
        La APPI del parque sube de 1 a 10 archivos en una operación y los vincula a uno o más criterios aplicables del
        parque. Por cada archivo válido se crea una evidencia con un vínculo por criterio, cada vínculo en estado
        "enviada" (C-19). Se guardan nombre original, tipo, tamaño, fecha y hora, versión, autor y la referencia al
        objeto; el archivo nunca se guarda en PostgreSQL. Como efecto lateral, cada criterio vinculado que estaba
        "pendiente", "cumplido" o "no cumplido" pasa a "en revisión".

        Los archivos que no pasan la validación se reportan en `rechazadas` con su motivo y no detienen a los demás
        (RF-05-AC-8). Si se envía un solo archivo y se rechaza, la respuesta es el error correspondiente (413 o 422).
        El límite de tamaño es el configurado en `/configuracion` (inicial 100 MB, inclusive). Formatos permitidos:
        PDF, JPG, PNG, HEIC, XLSX y DOCX. Gerente corporativo, Coordinación AMPIP y consultores reciben 403.

        Errores:
        - 413 `archivo_excede_limite`: "El archivo supera el límite de {n} MB".
        - 422 `formato_video_no_permitido`: "Este sistema no acepta archivos de video; suba una fotografía o captura de
          pantalla con fecha visible".
        - 422 `formato_no_permitido`: "Formato de archivo no permitido; use PDF, JPG, PNG, HEIC, XLSX o DOCX".
        - 422 `criterio_no_aplica`: "Este criterio no aplica al tipo de PI del parque".
