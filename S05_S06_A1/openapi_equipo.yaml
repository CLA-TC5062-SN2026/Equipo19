          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenglonPlanTrabajo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Plan de trabajo]
      operationId: eliminarRenglonPlanTrabajo
      summary: Eliminar un renglón del plan de trabajo
      description: El consultor asignado elimina un renglón del plan de trabajo. La eliminación queda en la bitácora.
      x-acceptance-criteria: []
      x-justificacion: >-
        Ningún AC del SRS cubre eliminar un renglón. Existe para corregir un renglón capturado sobre el criterio
        equivocado: como el renglón es único por criterio (409 en el POST) y el PATCH solo cambia responsable y fecha,
        sin DELETE no habría forma de liberar el criterio.
      responses:
        '204':
          description: Renglón eliminado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

