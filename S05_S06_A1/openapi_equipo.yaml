  # ================================================================ Comité
  /parques/{parqueId}/sesiones-comite:
    parameters:
      - $ref: '#/components/parameters/ParqueId'
    get:
      tags: [Comité]
      operationId: listarSesionesComite
      summary: Listar sesiones de comité del parque
      description: Devuelve las sesiones de comité del parque con su estado (abierta o cerrada).
      x-acceptance-criteria: [RF-13-AC-1]
      responses:
        '200':
          description: Sesiones de comité.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SesionComite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Comité]
      operationId: crearSesionComite
      summary: Abrir sesión de comité y asignar consultor de comité
      description: |
        Coordinación AMPIP abre la sesión de comité del parque y asigna al consultor de comité. Antes de abrirla, el
        sistema valida el expediente (RF-15, mismas reglas que `GET /parques/{parqueId}/elegibilidad-comite`). Si todo
        pasa, otorga al consultor de comité acceso temporal de solo lectura al expediente, sin el análisis de riesgos,
        hasta que la sesión se cierre con `PATCH /sesiones-comite/{sesionId}`.

        Errores:
        - 409 `sesion_comite_abierta`: el parque ya tiene una sesión de comité abierta.
        - 422 `consultor_comite_conflicto`: "El consultor asignado a este parque no puede ser su consultor de comité".
        - 422 `autoevaluacion_no_revisada`: "No se puede abrir la sesión de comité: la autoevaluación no está revisada".
        - 422 `sin_opinion_final_favorable`: "No se puede abrir la sesión de comité sin la Opinión de Cumplimiento
          final favorable del consultor".
        - 422 `consultor_no_existe` / `usuario_no_es_consultor`: `consultorComiteId` inexistente o sin rol `consultor`.
      x-acceptance-criteria: [RF-13-AC-1, RF-13-AC-2, RF-15-AC-1, RF-15-AC-2, RF-15-AC-3]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SesionComiteCreate'
      responses:
        '201':
          description: Sesión abierta y acceso temporal otorgado.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionComite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /parques/{parqueId}/elegibilidad-comite:
    parameters:
      - $ref: '#/components/parameters/ParqueId'
    get:
      tags: [Comité]
      operationId: obtenerElegibilidadComite
      summary: Consultar elegibilidad del expediente para comité
      description: |
        Recurso calculado de solo lectura: indica si el expediente cumple las condiciones para abrir la sesión de
        comité (autoevaluación revisada y Opinión de Cumplimiento final favorable) y, si no, cuáles faltan, con los
        mismos mensajes que devolvería la apertura. No abre la sesión.
      x-acceptance-criteria: [RF-15-AC-1, RF-15-AC-2, RF-15-AC-3]
      responses:
        '200':
          description: Elegibilidad del expediente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElegibilidadComite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sesiones-comite/{sesionId}:
    parameters:
      - $ref: '#/components/parameters/SesionId'
    get:
      tags: [Comité]
      operationId: obtenerSesionComite
      summary: Consultar una sesión de comité
      description: Devuelve la sesión de comité con su consultor de comité, fechas y estado.
      x-acceptance-criteria: [RF-13-AC-1]
      responses:
        '200':
          description: Sesión de comité.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionComite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Comité]
      operationId: actualizarSesionComite
      summary: Cerrar sesión de comité
      description: |
        Coordinación AMPIP cierra la sesión con `estado: cerrada`. El cierre registra `fechaCierre` y es la única
        fuente de verdad del fin del acceso: desde ese momento el consultor de comité pierde el acceso al expediente
        (403).

        Errores:
        - 409 `sesion_comite_cerrada`: la sesión ya está cerrada.
      x-acceptance-criteria: [RF-13-AC-3]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SesionComiteUpdate'
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionComite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /sesiones-comite/{sesionId}/expediente:
    parameters:
      - $ref: '#/components/parameters/SesionId'
    get:
      tags: [Comité]
      operationId: obtenerExpedienteComite
      summary: Consultar expediente en sesión de comité
      description: |
        Acceso de solo lectura al expediente para los miembros del comité mientras la sesión está abierta, incluida la
        marca favorable o no favorable de la Opinión final. Excluye el registro y el documento del análisis de
        riesgos. Tras el cierre de la sesión, el consultor de comité recibe 403.
      x-acceptance-criteria: [RF-12-AC-6, RF-13-AC-1, RF-13-AC-3]
      responses:
        '200':
          description: Expediente para comité.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpedienteComite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ================================================================ Dictámenes
  /parques/{parqueId}/dictamenes:
    parameters:
      - $ref: '#/components/parameters/ParqueId'
    get:
      tags: [Dictámenes]
      operationId: listarDictamenes
      summary: Consultar dictámenes del parque
      description: "Devuelve el dictamen de cada expediente del parque (la generación vigente y las anteriores), en \"borrador\"\
        \ o\n\"firmado\".\n"
      x-acceptance-criteria: [RF-14-AC-6]
      responses:
        '200':
          description: Dictámenes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dictamen'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Dictámenes]
      operationId: crearDictamen
      summary: Capturar dictamen en borrador
      description: |
        Coordinación AMPIP o el consultor de comité capturan el dictamen del expediente vigente (`otorgar` o
        `no_otorgar`) con su motivo. Queda en "borrador", visible para Coordinación AMPIP, el Director General y, si hay
        sesión de comité abierta, su consultor de comité, sin contar todavía como dictamen oficial.

        - `otorgar` se valida una sola vez, en la captura, contra las tres condiciones de RD-09 (y de nuevo si un PATCH
          cambia el tipo a `otorgar`).
        - `no_otorgar` no exige ninguna condición (RF-14-AC-8) y se puede capturar aunque RF-15 impida abrir la sesión
          de comité.

        Ninguno de los dos exige sesión de comité. Si hay una abierta, el dictamen queda ligado a ella
        (`sesionComiteId`); sin sesión, solo Coordinación AMPIP captura, porque no hay consultor de comité. Un
        consultor asignado recibe 403.

        Errores:
        - 409 `dictamen_duplicado`: el expediente vigente ya tiene un dictamen (en "borrador" se corrige con PATCH).
        - 422 `otorgar_sin_100_obligatorios`: "No se puede otorgar sin el 100 % de los obligatorios cumplidos".
        - 422 `otorgar_sin_autoevaluacion_revisada`: "No se puede otorgar sin la autoevaluación revisada: hay
          criterios pendientes o en revisión".
        - 422 `otorgar_sin_opinion_favorable`: "No se puede otorgar sin la Opinión de Cumplimiento final favorable del
          consultor".
      x-acceptance-criteria: [RF-14-AC-2, RF-14-AC-3, RF-14-AC-4, RF-14-AC-5, RF-14-AC-6, RF-14-AC-8]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DictamenCreate'
      responses:
        '201':
          description: Dictamen capturado en "borrador".
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dictamen'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /dictamenes/{dictamenId}:
    parameters:
      - $ref: '#/components/parameters/DictamenId'
    get:
      tags: [Dictámenes]
      operationId: obtenerDictamen
      summary: Consultar un dictamen
      description: Devuelve un dictamen con su estado, captura y, si está firmado, fecha y firmante.
      x-acceptance-criteria: [RF-14-AC-1, RF-14-AC-6]
      responses:
        '200':
          description: Dictamen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dictamen'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Dictámenes]
      operationId: actualizarDictamen
      summary: Editar dictamen en borrador o firmarlo
      description: |
        Dos usos, excluyentes en un mismo cuerpo. Si el dictamen no tenía sesión de comité y hay una abierta, la edición
        lo liga a ella.
        - `DictamenEdicion` (`tipo`, `motivo`): Coordinación AMPIP o el consultor de comité corrigen un dictamen en
          "borrador". Si el tipo queda en `otorgar`, se repite la validación de RD-09 con los mismos mensajes que la
          captura.
        - `DictamenFirma` (`estado: firmado`): solo el Director General AMPIP. Registra fecha y firmante sin repetir
          la validación y, si es `otorgar`, desde esa fecha corre la vigencia del distintivo (RD-08). Cualquier otro
          usuario recibe 403.

        Errores:
        - 409 `dictamen_ya_firmado`: el dictamen ya está firmado; no admite edición ni otra firma.
        - 422 `otorgar_sin_100_obligatorios`, `otorgar_sin_autoevaluacion_revisada`, `otorgar_sin_opinion_favorable`:
          mismos mensajes literales que en la captura.
      x-acceptance-criteria: [RF-14-AC-1, RF-14-AC-3, RF-14-AC-4, RF-14-AC-5, RF-14-AC-7]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DictamenEdicion'
                - $ref: '#/components/schemas/DictamenFirma'
      responses:
        '200':
          description: Dictamen actualizado o firmado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dictamen'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  # ================================================================ Reportes
  /reportes/avance-parques:
    get:
      tags: [Reportes]
      operationId: obtenerReporteAvanceParques
      summary: Vista de avance de parques para AMPIP
      description: |
        Cartera de parques activos con fase, cifras de cumplimiento, número de criterios atrasados (revisión diaria de
        plazos) y marca de atraso por falta de actualización anual del programa: la fecha de próxima actualización
        pasó sin una actualización registrada. Excluye parques inactivos. Solo Coordinación AMPIP y Director General.
      x-acceptance-criteria: [RF-07-AC-1, RF-09-AC-2, RF-29-AC-3, RF-30-AC-2, RF-30-AC-3]
      parameters:
        - $ref: '#/components/parameters/GeneracionIdQuery'
        - name: region
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Region'
        - name: atrasado
          in: query
          required: false
          description: Solo parques con la marca de atraso por actualización anual vencida.
          schema:
            type: boolean
      responses:
        '200':
          description: Vista de avance.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvanceParque'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /reportes/direccion-mensual:
    get:
      tags: [Reportes]
      operationId: obtenerReporteDireccionMensual
      summary: Reporte mensual para Dirección
      description: |
        Reporte de una generación y un mes con el nombre de cada parque, su fase, si está atrasado y su número de
        observaciones abiertas. Solo Coordinación AMPIP; una APPI recibe 403.

        Errores:
        - 422: falta `generacionId` o `mes`, o `mes` no tiene el formato AAAA-MM.
      x-acceptance-criteria: [RF-21-AC-1, RF-21-AC-2]
      parameters:
        - name: generacionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: mes
          in: query
          required: true
          description: Mes del reporte en formato AAAA-MM.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: '2027-05'
      responses:
        '200':
          description: Reporte mensual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteDireccionMensual'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /reportes/portafolio-corporativo:
    get:
      tags: [Reportes]
      operationId: obtenerReportePortafolioCorporativo
