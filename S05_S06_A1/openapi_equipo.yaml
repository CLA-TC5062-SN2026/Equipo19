        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ================================================================ Opiniones de Cumplimiento
  /parques/{parqueId}/opiniones-cumplimiento:
    parameters:
      - $ref: '#/components/parameters/ParqueId'
    get:
      tags: [Opiniones de Cumplimiento]
      operationId: listarOpinionesCumplimiento
      summary: Consultar Opiniones de Cumplimiento del parque
      description: Devuelve las Opiniones intermedia y final del parque, con la marca favorable o no favorable de la 
        final.
      x-acceptance-criteria: [RF-12-AC-6]
      parameters:
        - $ref: '#/components/parameters/GeneracionIdQuery'
        - name: tipo
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TipoOpinion'
      responses:
        '200':
          description: Opiniones de Cumplimiento.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpinionCumplimiento'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Opiniones de Cumplimiento]
      operationId: crearOpinionCumplimiento
      summary: Emitir Opinión de Cumplimiento
      description: |
        El consultor asignado emite la Opinión intermedia o la final para la generación en curso del parque. Hay a lo
        sumo una de cada tipo por parque y generación (índice único parque, generación, tipo). La intermedia no exige
        mínimo de cumplimiento; guarda los porcentajes vigentes y cambia la fase del parque a "Opinión intermedia
        emitida". La final exige la marca `favorable`. Un consultor sin el parque asignado recibe 403.

        Errores:
        - 409 `opinion_final_duplicada`: "Ya existe una Opinión final para este parque en esta generación".
        - 409 `opinion_intermedia_duplicada`: ya existe una Opinión intermedia para el parque en la generación.
        - 422 `politica_seguridad_no_cumplida`: "No se puede emitir la Opinión sin la política de seguridad firmada".
        - 422 `opinion_sin_analisis_riesgos`: "No se puede emitir la Opinión sin un análisis de riesgos vigente".
        - 422 `favorable_requerido`: "Indica si la Opinión final es favorable o no favorable".
      x-acceptance-criteria: [RF-12-AC-1, RF-12-AC-2, RF-12-AC-3, RF-12-AC-4, RF-12-AC-5, RF-12-AC-6]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpinionCumplimientoCreate'
      responses:
        '201':
          description: Opinión registrada.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpinionCumplimiento'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /opiniones-cumplimiento/{opinionId}:
    parameters:
      - $ref: '#/components/parameters/OpinionId'
    get:
      tags: [Opiniones de Cumplimiento]
      operationId: obtenerOpinionCumplimiento
      summary: Consultar una Opinión de Cumplimiento
      description: Devuelve una Opinión de Cumplimiento con sus porcentajes y, si es final, su marca favorable o no 
        favorable.
      x-acceptance-criteria: [RF-12-AC-1, RF-12-AC-6]
      responses:
        '200':
          description: Opinión de Cumplimiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpinionCumplimiento'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
