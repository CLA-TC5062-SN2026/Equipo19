  # ---------------------------------------------------------------- Operación
  /salud:
    get:
      tags: [Operación]
      operationId: obtenerSalud
      summary: Estado del servicio para el monitoreo externo
      description: |
        La consulta el monitoreo externo cada 5 minutos (RNF-08). No requiere sesión y no devuelve datos del
        programa: solo el estado de la API, si la base de datos responde y la fecha de la última corrida del worker.
        Responde 503 si la base no contesta o si el worker lleva más de 24 horas sin correr. No cuenta como
        actividad de ninguna sesión.
      security: []
      x-acceptance-criteria: []
      x-justificacion: >-
        Ningún AC del SRS describe el health check; existe para medir la disponibilidad de RNF-08 y detectar el worker
        detenido (diagrama de despliegue de S04_A1).
      responses:
        '200':
          description: Servicio operando.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
        '503':
          description: La base de datos no responde o el worker lleva más de 24 horas sin correr.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
        '500':
          $ref: '#/components/responses/InternalError'

  /evidencias/{evidenciaId}/vinculos/{criterioId}:
    parameters:
