openapi: 3.0.3
info:
  title: SGPIS API (contrato de equipo)
  version: 2.0.0
  description: |
    API REST del backend de SGPIS (Sistema de Gestión del Programa Parque Industrial Seguro, AMPIP).
    Backend en Python 3.12 + FastAPI con PostgreSQL 16; la consume una SPA en React.

    Alcance: requerimientos funcionales de `SRS_equipo.md` v2.0 con prioridad "MVP feb-2027" y "2027".
    Quedan fuera los RF con prioridad "Posterior" (RF-18, RF-19, RF-20, RF-22, RF-37, RF-38, RF-39).
    Contrato consolidado del equipo 19 (S05-S06-A1); las diferencias con los diseños individuales y su resolución
    están en `diferencias_diseno.md`.

    ## Convenciones
    - URIs con sustantivos en plural, minúsculas y kebab-case, sin verbos. Un solo camino de escritura por recurso.
      Lo que pertenece a un parque se anida bajo `/parques/{parqueId}`; los recursos con id global propio
      (evidencias, sesiones de comité, dictámenes, Opiniones de Cumplimiento) tienen además su URI de elemento
      de primer nivel para GET y PATCH.
    - El dominio guarda un expediente por parque y generación (`diagrama_clases_equipo.puml`). Las rutas bajo
      `/parques/{parqueId}` operan sobre el expediente de la generación vigente del parque, y `Parque` expone sus
      datos (generación, fase, fechas del programa) aplanados; los expedientes anteriores se consultan en
      `GET /parques/{parqueId}/historial`.
    - Propiedades JSON en camelCase; valores de enumeración en snake_case. En FastAPI, todos los modelos heredan de
      un `BaseModel` común con `alias_generator=to_camel` y `populate_by_name=True`.
    - Todas las fechas de negocio se calculan y comparan en America/Mexico_City (RNF-11).
    - Toda operación sobre evidencias genera un registro de bitácora de solo append (RNF-03).
    - Cada operación declara en `x-acceptance-criteria` los criterios de aceptación del SRS que satisface. Una lista
      vacía solo se admite con `x-justificacion`.

    ## Códigos de estado
    - **400**: el cuerpo no se puede parsear o está malformado (JSON inválido, multipart roto). Solo aplica a
      operaciones con cuerpo.
    - **401**: sin token, token inválido, sesión revocada o expirada por inactividad.
    - **403**: autenticado sin permiso. El aislamiento entre parques (RNF-01) responde 403, como exige el SRS.
    - **404**: solo cuando no existe el recurso de la RUTA, o el usuario no tiene ninguna relación con él que le
      permita saber que existe. Un id referenciado dentro del cuerpo que no existe responde 422, no 404.
    - **409**: conflicto con el estado actual del recurso destino: duplicado o violación de unicidad, transición de
      estado no permitida desde el estado actual, sesión de comité ya abierta, dictamen ya firmado, evidencia ya
      aceptada.
    - **410**: enlace de un solo uso (invitación o recuperación de contraseña) ya usado o vencido.
    - **413**: archivo de evidencia mayor al límite configurado (inicial 100 MB = 104,857,600 bytes, RF-06-AC-6).
    - **422**: cuerpo o parámetros sintácticamente válidos que violan una regla de esquema o de negocio (enumeración
      inválida, campo faltante, criterio NA, umbral del dictamen, id referenciado inexistente).
    - **429**: cuenta bloqueada por 5 intentos fallidos de inicio de sesión, con cabecera `Retry-After`.
    - **500**: error interno; declarado en todas las operaciones.

    ## Formato de error
    Todo error responde con el esquema `Error` (`codigo` en snake_case, `mensaje` con el texto literal del SRS
    cuando el AC lo da, `detalles` opcional). El backend registra exception handlers globales para
    `RequestValidationError` y `HTTPException`, de modo que la validación de Pydantic y los errores de FastAPI
    también respondan con `Error` y nunca con `{"detail": ...}`. El handler de validación traduce el campo fallido a
    `codigo`/`mensaje` con una tabla por operación (por ejemplo, `tipoPI` inválido responde "Debe seleccionar un
    tipo de PI válido" en el alta de parque y "Tipo de PI inválido" en el cambio de tipo de PI). El esquema
    `HTTPValidationError` que FastAPI inyecta en el OpenAPI generado se sobrescribe para que coincida con este
    contrato.

    ## Paginación
    Los listados que pueden crecer (parques, usuarios, criterios del parque, autoevaluaciones, evidencias y plan de
    trabajo) se paginan con los parámetros compartidos `pagina`, `tamanoPagina` (máximo 100) y `orden`, y responden
    con un sobre `{pagina, tamanoPagina, total, items}`. Las colecciones acotadas por naturaleza (versiones del
    catálogo, generaciones, historial de tipo de PI, asignaciones, revisiones del análisis de riesgos, Opiniones,
    sesiones de comité y dictámenes de un parque) devuelven un arreglo simple.

    ## Transiciones de estado
    Todas las transiciones se modelan como `PATCH` del recurso con el campo `estado` (más `motivo` cuando aplica).
    Una transición no permitida desde el estado actual responde 409. Repetir un `PATCH` que deja el recurso en el
    estado en que ya está responde 200 sin efectos, salvo donde la operación indique otra cosa. La excepción es
    registrar una observación (`POST /evidencias/{evidenciaId}/observaciones`), que crea un recurso Observación y,
    como efecto, pasa a "observada" el vínculo de la evidencia con ese criterio.

    ## Procesos sin endpoint
    - **Revisión diaria de plazos** (RF-09-AC-2, RF-09-AC-3, RF-30-AC-2, RF-30-AC-3): job programado del backend con
      corte a las 00:00 de Ciudad de México. Su resultado se expone en
      `GET /parques/{parqueId}/criterios?atrasado=true` y en `GET /reportes/avance-parques`.
    - **Transiciones automáticas del criterio** (RF-27-AC-4, RF-27-AC-7, RF-11-AC-4): efecto lateral de
      `POST /parques/{parqueId}/evidencias`, `POST /evidencias/{evidenciaId}/versiones` y
      `PUT /parques/{parqueId}/tipo-pi`.
    - **Notificaciones por correo** (RF-05-AC-2, aviso de observación a la APPI; RF-03-AC-1, invitación de alta;
      recuperación de contraseña de RF-26-AC-4): efecto lateral de la operación que las origina, con 3 reintentos y
      registro en bitácora si fallan (RNF-12).
  x-procesos-programados:
    - nombre: revision-diaria-plazos
      horario: Diario a las 00:00, America/Mexico_City
      descripcion: |
        Marca como atrasado un renglón del plan de trabajo cuando vence su fecha comprometida y el criterio no está
        cumplido, y marca el parque como atrasado cuando vence su fecha de próxima actualización anual.
      x-acceptance-criteria: [RF-09-AC-2, RF-09-AC-3, RF-30-AC-2, RF-30-AC-3]
    - nombre: envio-correos
      horario: Cada minuto
      descripcion: |
        Envía los mensajes pendientes de la outbox (invitaciones, recuperación de contraseña, avisos de observación) con
        hasta 3 intentos; la falla definitiva queda registrada (RNF-12).
      x-acceptance-criteria: []
servers:
  - url: http://localhost:8000/api
    description: Entorno local (docker compose)
security:
  - BearerAuth: []
tags:
  - name: Autenticación
    description: Registro con invitación, inicio y cierre de sesión, recuperación de contraseña (RF-03, RF-26).
  - name: Catálogo
    description: Versiones del catálogo, archivo maestro y criterios con su evidencia suficiente (RF-01, RF-24, RF-25).
  - name: Generaciones
    description: Generaciones del programa (RF-28).
  - name: Parques
    description: Alta, baja, tipo de PI, fechas del programa e historial de parques (RF-02, RF-11, RF-29, RF-30, RF-31).
  - name: Usuarios
    description: Alta, cambio de rol y baja de usuarios (RF-03, RF-29).
  - name: Asignaciones
    description: Asignación y reasignación del consultor de un parque (RF-10).
  - name: Criterios del parque
    description: Criterios aplicables del parque, su estado de calificación y la calificación del consultor (RF-04, 
      RF-07, RF-09, RF-17, RF-25, RF-27).
  - name: Autoevaluación
    description: Respuestas de la autoevaluación de diagnóstico (RF-04).
  - name: Evidencias
    description: Carga, versiones, observación, aceptación y descarga de evidencias (RF-05, RF-06, RF-07, RF-27).
  - name: Cumplimiento
    description: Cumplimiento de obligatorios y avance general (RF-08).
  - name: Plan de trabajo
    description: Responsable y fecha comprometida por criterio (RF-09).
  - name: Análisis de riesgos
    description: Revisiones del análisis de riesgos y documento opcional (RF-16).
  - name: Opiniones de Cumplimiento
    description: Opinión intermedia y final del consultor asignado (RF-12).
  - name: Comité
    description: Sesiones de comité, elegibilidad del expediente y acceso temporal del consultor de comité (RF-13, 
      RF-15).
  - name: Dictámenes
    description: Captura, edición y firma del dictamen (RF-14).
  - name: Reportes
    description: Vista de avance para AMPIP, reporte mensual de Dirección y vista corporativa (RF-07, RF-21, RF-23, 
      RF-29, RF-30).
  - name: Operación
    description: Estado del servicio para el monitoreo externo (RNF-08).

  - name: Fases
    description: Fases del expediente, cierre y avance por excepción (RF-32).
  - name: Configuración
    description: 'Parámetros del programa: límite de archivo y vigencia del distintivo (RF-06, RD-08).'
  - name: Bitácora
    description: Consulta de la bitácora de solo append (RF-35, RNF-03).
paths:
  # ================================================================ Autenticación
  /auth/register:
    post:
      tags: [Autenticación]
      operationId: registrarUsuario
      summary: Registrar la contraseña de una cuenta invitada
      description: |
        Completa el registro de una cuenta que Coordinación AMPIP dio de alta con `POST /usuarios` (RF-03-AC-1). El
        usuario envía el token de la invitación que recibió por correo y su contraseña; el servidor guarda solo el hash
        bcrypt, pasa la cuenta de "pendiente de activación" a "activo" y responde 201 con los datos del usuario, nunca
        con la contraseña ni con el hash.

        No existe auto-registro abierto: el SRS de equipo (RF-03) reserva el alta de cuentas y la asignación de rol a
        Coordinación AMPIP. Sin un token de invitación vigente no se crea ninguna credencial.

        Errores:
        - 410 `enlace_no_vigente`: la invitación ya se usó o venció.
        - 422 `contrasena_debil`: "La contraseña debe tener al menos 10 caracteres".
      security: []
      x-acceptance-criteria: [RF-03-AC-1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroCreate'
      responses:
        '201':
          description: Credencial creada y cuenta activada.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Autenticación]
      operationId: iniciarSesion
      summary: Iniciar sesión
      description: |
        Autentica con correo y contraseña, crea una sesión en servidor y devuelve un JWT con los claims `sub`
        (usuario), `sid` (sesión), `iat` y `exp`. `exp` es la expiración absoluta del token (variable de entorno
        `JWT_EXPIRATION`); además, la sesión expira tras 60 minutos sin actividad (RF-26-AC-6). Lo que ocurra primero.

        Tras 5 intentos fallidos consecutivos la cuenta queda bloqueada 15 minutos, aun con la contraseña correcta.
        El contador corre también para correos que no existen, para no revelar qué cuentas están registradas. Una
        cuenta "pendiente de activación" o "inactiva" responde 401 con el mismo mensaje que credenciales inválidas.

        Errores:
        - 401 `credenciales_invalidas`: "Correo o contraseña incorrectos".
        - 429 `cuenta_bloqueada`: "Cuenta bloqueada temporalmente; intente de nuevo en 15 minutos", con `Retry-After`.
      security: []
      x-acceptance-criteria: [RF-26-AC-1, RF-26-AC-2, RF-26-AC-3]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SesionCreate'
      responses:
        '200':
          description: Sesión creada; se entrega el token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionCreada'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [Autenticación]
      operationId: obtenerUsuarioActual
      summary: Consultar el usuario y la sesión del token
      description: |
        Devuelve los datos del usuario autenticado y de su sesión. Si la sesión lleva 60 minutos sin actividad, fue
        revocada, el token expiró o el usuario fue dado de baja, responde 401. Como cualquier otra solicitud, esta
        consulta cuenta como actividad.
      x-acceptance-criteria: [RF-26-AC-6]
      responses:
        '200':
          description: Sesión vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionActual'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Autenticación]
      operationId: cerrarSesion
      summary: Cerrar sesión
      description: |
        Revoca la sesión `sid` del token. Cualquier solicitud posterior con ese token responde 401. Se conserva la forma
        RPC del espacio `/auth` (register, login, logout) que fijó la tarea T-10 del Sprint 1.
      x-acceptance-criteria: [RF-26-AC-5]
      responses:
        '204':
          description: Sesión revocada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /recuperaciones-contrasena:
    post:
      tags: [Autenticación]
      operationId: crearRecuperacionContrasena
      summary: Solicitar enlace de recuperación de contraseña
      description: |
        Si el correo pertenece a una cuenta activa, envía por correo un enlace de un solo uso con vigencia de 30
        minutos. Siempre responde 202, exista o no el correo, para no revelar qué cuentas están registradas.
      security: []
      x-acceptance-criteria: [RF-26-AC-4]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperacionContrasenaCreate'
      responses:
        '202':
          description: Solicitud aceptada.
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /versiones-catalogo:
    get:
      tags: [Catálogo]
      operationId: listarVersionesCatalogo
      summary: Listar versiones del catálogo
      description: Lista las versiones cargadas del catálogo e indica cuál está vigente. Solo Coordinación AMPIP.
      x-acceptance-criteria: [RF-01-AC-1]
      responses:
        '200':
          description: Versiones del catálogo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VersionCatalogo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Catálogo]
      operationId: crearVersionCatalogo
      summary: Cargar una versión del catálogo desde CSV
      description: |
        Coordinación AMPIP sube un CSV con las columnas `estandar, subestandar, criterio, metodo_verificacion,
        marca_construccion_abierto, marca_construccion_cerrado, marca_operacion_abierto, marca_operacion_cerrado`.
        Si el archivo es válido, crea la versión y la marca como vigente para las evaluaciones nuevas. Cualquier otro
        rol recibe 403 y no se crea ninguna versión.

        Errores:
        - 409 `version_catalogo_duplicada`: ya existe una versión con ese `nombreVersion`.
        - 422 `catalogo_invalido`: columna faltante o marca distinta de O, R o NA. Se rechaza el archivo completo;
          `mensaje` indica la fila y la columna del primer error y `detalles` lista cada error (`campo` = columna,
          `problema` incluye la fila).
      x-acceptance-criteria: [RF-01-AC-1, RF-01-AC-2, RF-01-AC-4]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VersionCatalogoCreate'
      responses:
        '201':
          description: Versión creada y marcada como vigente.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionCatalogo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /versiones-catalogo/{versionId}:
    parameters:
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [Catálogo]
      operationId: obtenerVersionCatalogo
      summary: Consultar una versión del catálogo
      description: Devuelve los metadatos de una versión del catálogo. Solo Coordinación AMPIP.
      x-acceptance-criteria: [RF-01-AC-1, RF-01-AC-5]
      responses:
        '200':
          description: Versión del catálogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionCatalogo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /versiones-catalogo/{versionId}/archivo:
    parameters:
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [Catálogo]
      operationId: obtenerArchivoVersionCatalogo
      summary: Descargar el archivo maestro de una versión del catálogo
      description: |
        Devuelve el archivo maestro con todos los criterios de la versión (286 en el catálogo 2023) y sus cuatro
        columnas O/R/NA. Solo Coordinación AMPIP. La APPI y el consultor asignado ven los criterios aplicables de sus
        parques en `GET /parques/{parqueId}/criterios`, no aquí.

        Errores:
        - 403 `descarga_catalogo_restringida`: "La descarga del archivo maestro del catálogo está restringida a
          Coordinación AMPIP" (cualquier rol distinto de Coordinación AMPIP).
      x-acceptance-criteria: [RF-25-AC-2, RF-25-AC-3, RF-25-AC-4]
      responses:
        '200':
          description: Archivo maestro en CSV.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /criterios/{criterioId}:
    parameters:
      - $ref: '#/components/parameters/CriterioId'
    get:
      tags: [Catálogo]
      operationId: obtenerCriterio
      summary: Consultar un criterio del catálogo
      description: |
        Devuelve un criterio con su descripción de evidencia suficiente. Coordinación AMPIP ve las cuatro marcas
        O/R/NA. La APPI y el consultor asignado solo pueden consultar criterios aplicables (O o R) al tipo de PI de
        sus parques, y en ese caso `marcas` se omite; para otros criterios reciben 403.
      x-acceptance-criteria: [RF-24-AC-1, RF-25-AC-1]
      responses:
        '200':
          description: Criterio del catálogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Criterio'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Catálogo]
      operationId: actualizarCriterio
      summary: Definir la evidencia suficiente de un criterio
      description: |
        Coordinación AMPIP captura o reemplaza la descripción de la evidencia suficiente del criterio; se muestra al
        consultor y a la APPI al abrir el criterio. Consultores, APPI y demás roles reciben 403.
      x-acceptance-criteria: [RF-01-AC-5, RF-24-AC-1, RF-24-AC-2]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriterioUpdate'
      responses:
        '200':
          description: Criterio actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Criterio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  # ================================================================ Generaciones
        '409':
          $ref: '#/components/responses/Conflict'
  /generaciones:
    get:
      tags: [Generaciones]
      operationId: listarGeneraciones
      summary: Listar generaciones
      description: Lista las generaciones del programa con su versión de catálogo asociada.
      x-acceptance-criteria: [RF-28-AC-1]
      responses:
        '200':
          description: Generaciones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Generacion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Generaciones]
      operationId: crearGeneracion
      summary: Crear generación
      description: |
        Coordinación AMPIP crea una generación con nombre, fecha de inicio y la versión vigente del catálogo. APPI y
        consultores reciben 403.

        Errores:
        - 409 `generacion_duplicada`: ya existe una generación con ese nombre.
        - 422 `version_catalogo_no_existe`: `versionCatalogoId` no corresponde a ninguna versión.
      x-acceptance-criteria: [RF-01-AC-5, RF-28-AC-1, RF-28-AC-2]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneracionCreate'
      responses:
        '201':
          description: Generación creada.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generacion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
