          application/json:
            schema:
              $ref: '#/components/schemas/FechasPrograma'
      responses:
        '200':
          description: Fechas guardadas en el expediente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FechasPrograma'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /parques/{parqueId}/actualizaciones-anuales:
    post:
      tags: [Parques]
      operationId: registrarActualizacionAnual
      summary: Registrar actualización anual del programa
      description: |
        Coordinación AMPIP registra la actualización anual del parque. El sistema calcula la siguiente fecha de
        actualización un año después de la registrada y retira la marca de atraso si existía.
      x-acceptance-criteria: [RF-30-AC-3]
      parameters:
        - $ref: '#/components/parameters/ParqueId'
      requestBody:
        required: true
        content:
          application/json:
