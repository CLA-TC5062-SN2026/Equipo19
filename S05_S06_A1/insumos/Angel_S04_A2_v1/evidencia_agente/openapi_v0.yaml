openapi: 3.0.3
info:
  title: SGPIS API
  version: 0.1.0
  description: |
    API REST del backend de SGPIS (Sistema de Gestión del Programa Parque Industrial Seguro, AMPIP).
    Backend en Python 3.12 + FastAPI con PostgreSQL 16; la consume una SPA en React.

    Alcance: requerimientos funcionales del SRS v1.4 con prioridad "MVP feb-2027" y "2027".
    Quedan fuera los RF con prioridad "Posterior" (RF-18, RF-19, RF-20, RF-22).

    Convenciones:
    - Todas las fechas de negocio se interpretan en America/Mexico_City (RNF-11).
    - Toda operación sobre evidencias genera un registro de bitácora de solo append (RNF-03).
    - Los errores siguen el esquema `Error`; el campo `mensaje` lleva el texto literal que exige el SRS.
    - Cada operación declara en `x-acceptance-criteria` los criterios de aceptación del SRS que satisface.
servers:
  - url: http://localhost:8000/api/v1
    description: Entorno local (docker compose)
  - url: https://sgpis.example.mx/api/v1
    description: Producción
security:
  - bearerAuth: []
tags:
  - name: Autenticación
    description: Inicio y cierre de sesión, recuperación de contraseña (RF-26).
  - name: Catálogo
    description: Versiones del catálogo de criterios, evidencia suficiente y descarga del archivo maestro (RF-01, RF-24, RF-25).
  - name: Generaciones
    description: Generaciones del programa (RF-28).
  - name: Parques
    description: Alta, baja, tipo de PI, fechas del programa e historial de parques (RF-02, RF-11, RF-29, RF-30, RF-31).
  - name: Usuarios
    description: Alta, roles y baja de usuarios (RF-03, RF-29).
  - name: Asignaciones
    description: Asignación y reasignación de consultores a parques (RF-10).
  - name: Autoevaluación
    description: Autoevaluación de diagnóstico filtrada por tipo de PI (RF-04, RF-25).
  - name: Criterios del parque
    description: Estado de calificación de cada criterio por parque y su máquina de estados (RF-07, RF-17, RF-27).
  - name: Evidencias
    description: Carga, observación, aceptación y consulta de evidencias (RF-05, RF-06, RF-07, RF-27).
  - name: Cumplimiento
    description: Cálculo de cumplimiento de obligatorios y avance general (RF-08).
  - name: Plan de trabajo
    description: Plan de trabajo por criterio y detección de atraso (RF-09).
  - name: Análisis de riesgos
    description: Registro de revisión del análisis de riesgos y documento opcional (RF-16).
  - name: Opiniones de Cumplimiento
    description: Opinión intermedia y final del consultor asignado (RF-12).
  - name: Comité
    description: Sesiones de comité, validación del expediente y acceso temporal del consultor de comité (RF-13, RF-15).
  - name: Dictámenes
    description: Captura y firma del dictamen (RF-14).
  - name: Reportes
    description: Vista de avance para AMPIP, reporte mensual de Dirección y vista corporativa (RF-07, RF-21, RF-23, RF-30).

paths:
  # ---------------------------------------------------------------- Autenticación
  /auth/login:
    post:
      tags: [Autenticación]
      operationId: iniciarSesion
      summary: Iniciar sesión
      description: |
        Autentica con correo y contraseña y entrega un token JWT de sesión que expira tras 60 minutos de inactividad.
        Tras 5 intentos fallidos consecutivos la cuenta se bloquea 15 minutos, aun con la contraseña correcta.
      security: []
      x-acceptance-criteria: [RF-26-AC-1, RF-26-AC-2, RF-26-AC-3]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas; se entrega el token de sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 'Credenciales inválidas ("Correo o contraseña incorrectos") o cuenta bloqueada ("Cuenta bloqueada temporalmente; intente de nuevo en 15 minutos").'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Autenticación]
      operationId: cerrarSesion
      summary: Cerrar sesión
      description: Invalida el token de la sesión actual; cualquier solicitud posterior con ese token responde 401.
      x-acceptance-criteria: [RF-26-AC-5]
      responses:
        '204':
          description: Sesión cerrada y token invalidado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/recuperacion:
    post:
      tags: [Autenticación]
      operationId: solicitarRecuperacionContrasena
      summary: Solicitar enlace de recuperación de contraseña
      description: |
        Envía por correo un enlace de recuperación de un solo uso con vigencia de 30 minutos.
        Responde 202 aunque el correo no exista, para no revelar qué cuentas están registradas.
      security: []
      x-acceptance-criteria: [RF-26-AC-4]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperacionRequest'
      responses:
        '202':
          description: Solicitud aceptada; si la cuenta existe se envía el enlace.
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/recuperacion/confirmar:
    post:
      tags: [Autenticación]
      operationId: restablecerContrasena
      summary: Restablecer contraseña con enlace de recuperación
      description: Usa el token del enlace de recuperación para fijar una contraseña nueva. El token deja de funcionar a los 30 minutos o tras su primer uso.
      security: []
      x-acceptance-criteria: [RF-26-AC-4]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecerContrasenaRequest'
      responses:
        '200':
          description: Contraseña actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '400':
          description: Token de recuperación expirado o ya utilizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [Autenticación]
      operationId: obtenerSesionActual
      summary: Consultar el usuario de la sesión actual
      description: Devuelve el usuario autenticado y sus roles. Si la sesión lleva 60 minutos sin actividad responde 401 y el cliente debe iniciar sesión de nuevo.
      x-acceptance-criteria: [RF-26-AC-6]
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Catálogo
  /catalogo/versiones:
    get:
      tags: [Catálogo]
      operationId: listarVersionesCatalogo
      summary: Listar versiones del catálogo
      description: Lista las versiones cargadas del catálogo e indica cuál está vigente. Solo Coordinación AMPIP.
      x-acceptance-criteria: [RF-01-AC-1]
      responses:
        '200':
          description: Versiones del catálogo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VersionCatalogo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Catálogo]
      operationId: cargarVersionCatalogo
      summary: Cargar una nueva versión del catálogo desde CSV
      description: |
        Coordinación AMPIP sube un CSV con las columnas `estandar, subestandar, criterio, metodo_verificacion,
        marca_construccion_abierto, marca_construccion_cerrado, marca_operacion_abierto, marca_operacion_cerrado`.
        El sistema valida columnas y marcas (O, R o NA); si hay cualquier error rechaza el archivo completo
        indicando fila y columna, y no crea ninguna versión. Si es válido, crea la versión y la marca como vigente.
        Cualquier otro rol recibe 403.
      x-acceptance-criteria: [RF-01-AC-1, RF-01-AC-2, RF-01-AC-4]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CargaCatalogoRequest'
      responses:
        '201':
          description: Versión creada y marcada como vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionCatalogo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: El archivo tiene una columna faltante o una marca distinta de O, R o NA. `detalles` indica fila y columna.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalogo/versiones/{versionId}:
    get:
      tags: [Catálogo]
      operationId: obtenerVersionCatalogo
      summary: Consultar una versión del catálogo
      description: Devuelve los metadatos de una versión del catálogo. Solo Coordinación AMPIP.
      x-acceptance-criteria: [RF-01-AC-1]
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Versión del catálogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionCatalogo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalogo/exportar:
    get:
      tags: [Catálogo]
      operationId: exportarCatalogoMaestro
      summary: Descargar el archivo maestro del catálogo
      description: |
        Genera el archivo maestro con los 286 criterios y sus cuatro columnas O/R/NA.
        Restringido a Coordinación AMPIP; APPI y consultores reciben 403 con el mensaje
        "La descarga del archivo maestro del catálogo está restringida a Coordinación AMPIP".
      x-acceptance-criteria: [RF-25-AC-2, RF-25-AC-3, RF-25-AC-4]
      parameters:
        - name: versionId
          in: query
          required: false
          description: Versión a exportar; si se omite, la vigente.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Archivo maestro del catálogo.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalogo/criterios/{criterioId}:
    get:
      tags: [Catálogo]
      operationId: obtenerCriterio
      summary: Consultar un criterio del catálogo
      description: |
        Devuelve un criterio individual con su descripción de evidencia suficiente.
        La APPI y el consultor asignado solo pueden consultar criterios aplicables (O o R) al tipo de PI de sus parques;
        para otros criterios reciben 403.
      x-acceptance-criteria: [RF-25-AC-1, RF-24-AC-1]
      parameters:
        - $ref: '#/components/parameters/CriterioId'
      responses:
        '200':
          description: Criterio del catálogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Criterio'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalogo/criterios/{criterioId}/evidencia-suficiente:
    put:
      tags: [Catálogo]
      operationId: definirEvidenciaSuficiente
      summary: Definir la evidencia suficiente de un criterio
      description: Coordinación AMPIP captura o reemplaza la descripción de la evidencia suficiente de un criterio. Consultores y APPI reciben 403.
      x-acceptance-criteria: [RF-24-AC-1, RF-24-AC-2]
      parameters:
        - $ref: '#/components/parameters/CriterioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenciaSuficienteRequest'
      responses:
        '200':
          description: Descripción guardada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Criterio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Generaciones
  /generaciones:
    get:
      tags: [Generaciones]
      operationId: listarGeneraciones
      summary: Listar generaciones
      description: Lista las generaciones del programa con su versión de catálogo asociada.
      x-acceptance-criteria: [RF-28-AC-1]
      responses:
        '200':
          description: Generaciones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Generacion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Generaciones]
      operationId: crearGeneracion
      summary: Crear generación
      description: Coordinación AMPIP crea una generación con nombre, fecha de inicio y versión vigente del catálogo. APPI y consultores reciben 403.
      x-acceptance-criteria: [RF-28-AC-1, RF-28-AC-2]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneracionCreate'
      responses:
        '201':
          description: Generación creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generacion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: La versión de catálogo indicada no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /generaciones/{generacionId}:
    get:
      tags: [Generaciones]
      operationId: obtenerGeneracion
      summary: Consultar generación
      description: Devuelve una generación y el número de parques inscritos.
      x-acceptance-criteria: [RF-28-AC-1]
      parameters:
        - $ref: '#/components/parameters/GeneracionId'
      responses:
        '200':
          description: Generación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generacion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Parques
  /parques:
    get:
      tags: [Parques]
      operationId: listarParques
      summary: Listar parques
      description: |
        Lista los parques visibles para el usuario según su rol: Coordinación AMPIP ve todos; el consultor asignado,
        sus parques asignados; la APPI, su parque. Por defecto omite los parques dados de baja.
      x-acceptance-criteria: [RF-29-AC-3]
      parameters:
        - name: generacionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoParque'
        - name: incluirHistoricos
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
      responses:
        '200':
          description: Página de parques.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaParques'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Parques]
      operationId: crearParque
      summary: Dar de alta parque
      description: |
        Coordinación AMPIP da de alta un parque con nombre, desarrollador, tipo de PI, región (estado de la República)
        y generación. El parque se crea en estado "activo" con fecha de alta igual a la fecha de la operación.
        Rechaza tipo de PI inválido ("Debe seleccionar un tipo de PI válido"), región inválida
        ("Debe seleccionar una región válida") o falta de generación ("Debe indicar la generación del parque").
      x-acceptance-criteria: [RF-02-AC-1, RF-02-AC-2, RF-02-AC-3, RF-28-AC-3]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParqueCreate'
      responses:
        '201':
          description: Parque creado en estado "activo".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parque'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: La generación indicada no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /parques/{parqueId}:
    get:
      tags: [Parques]
      operationId: obtenerParque
      summary: Consultar expediente del parque
      description: |
        Devuelve los datos del expediente del parque, incluida la versión del catálogo contra la que fue evaluado
        (solo lectura) y las fechas de término y de actualización anual del programa. Un usuario sin relación con
        el parque recibe 403 (RNF-01).
      x-acceptance-criteria: [RF-01-AC-3, RF-30-AC-1]
      parameters:
        - $ref: '#/components/parameters/ParqueId'
      responses:
        '200':
          description: Expediente del parque.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parque'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Parques]
      operationId: actualizarParque
      summary: Actualizar datos generales del parque
      description: |
        Coordinación AMPIP actualiza nombre, desarrollador o región. No permite modificar la versión del catálogo
        ni el tipo de PI (este último se cambia en `/parques/{parqueId}/tipo-pi`).
      x-acceptance-criteria: [RF-01-AC-3, RF-02-AC-3]
      parameters:
        - $ref: '#/components/parameters/ParqueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParqueUpdate'
      responses:
        '200':
          description: Parque actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parque'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Parques]
      operationId: darDeBajaParque
      summary: Dar de baja parque
      description: |
        Baja lógica: el parque pasa a estado "baja", se retira de inmediato el acceso a todos los usuarios asociados
        (APPI y consultor asignado) y deja de mostrarse en la vista de avance activa. El historial se conserva.
        Solo Coordinación AMPIP.
      x-acceptance-criteria: [RF-29-AC-3]
      parameters:
        - $ref: '#/components/parameters/ParqueId'
      responses:
        '200':
          description: Parque dado de baja.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parque'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /parques/{parqueId}/tipo-pi:
    put:
      tags: [Parques]
      operationId: cambiarTipoPI
      summary: Cambiar el tipo de PI del parque
      description: |
        Coordinación AMPIP cambia el tipo de PI. El sistema cierra el historial anterior (fecha_hasta), abre uno nuevo
        (fecha_desde), recalcula los criterios O/R/NA, conserva el cumplimiento anterior asociado a la clasificación
        previa y asigna "pendiente" a los criterios que dejan de ser NA. Un valor fuera de los cuatro válidos se
        rechaza con 422 "Tipo de PI inválido" sin crear historial.
      x-acceptance-criteria: [RF-11-AC-1, RF-11-AC-2, RF-11-AC-3, RF-11-AC-4]
      parameters:
        - $ref: '#/components/parameters/ParqueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioTipoPIRequest'
      responses:
        '200':
          description: Tipo de PI actualizado y criterios recalculados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CambioTipoPIResultado'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /parques/{parqueId}/historial-tipo-pi:
    get:
      tags: [Parques]
      operationId: listarHistorialTipoPI
      summary: Consultar historial de tipo de PI
      description: Devuelve los periodos de clasificación del parque con el cumplimiento registrado bajo cada uno.
      x-acceptance-criteria: [RF-11-AC-1, RF-11-AC-2]
      parameters:
        - $ref: '#/components/parameters/ParqueId'
      responses:
        '200':
          description: Historial de tipo de PI.
          content:
            application/json:
              schema:
                type: array
