openapi: 3.0.3
info:
  title: API del Sistema de Gestión del Programa Parque Industrial Seguro (SGPIS)
  version: 1.0.0
  description: "API REST para gestionar parques industriales, usuarios y roles, checklist de seguridad, planes de
    trabajo, fases, respuestas a criterios, evidencias, opiniones, evaluaciones y auditoría. Los archivos binarios
    de evidencias se almacenan en un servicio de almacenamiento de objetos; PostgreSQL conserva sus metadatos y
    referencias.\n\nConvenciones REST: rutas de recursos en minúsculas y colecciones plurales; parámetros de ruta
    y consulta en snake_case. PUT reemplaza de forma idempotente, DELETE aplica baja lógica idempotente y POST admite
    Idempotency-Key para reintentos, además de controles de unicidad específicos del dominio."
servers:
- url: https://api.sgpis.example.com/v1
  description: Servidor de ejemplo; sustituir por la URL del entorno desplegado.
tags:
- name: Autenticación
- name: Usuarios y roles
- name: Parques industriales
- name: Checklist de seguridad
- name: Planes y fases
- name: Respuestas a criterios
- name: Evidencias
- name: Opiniones y evaluaciones
- name: Auditoría
security:
- BearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Autenticación
      operationId: login
      summary: Iniciar sesión y obtener un JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Credenciales incorrectas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
      x-acceptance-criteria:
      - RF-26-AC-1
      - RF-26-AC-2
      - RF-26-AC-3
  /usuarios:
    get:
      tags:
      - Usuarios y roles
      operationId: listUsers
      summary: Consultar usuarios
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: activo
        in: query
        schema:
          type: boolean
      - name: parque_id
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Lista de usuarios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      x-acceptance-criteria: []
    post:
      tags:
      - Usuarios y roles
      operationId: createUser
      summary: Crear un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '409':
          $ref: '#/components/responses/Conflict'
      x-acceptance-criteria:
      - RF-03-AC-1
      - RF-03-AC-3
      - RF-34-AC-1
      - RF-34-AC-2
      description: La dirección de correo debe ser única. Una cuenta existente con el mismo correo produce 409
        Conflict. Si se proporciona Idempotency-Key, los reintentos con la misma clave y carga útil devuelven 
        el resultado original.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
  /parques:
    get:
      tags:
      - Parques industriales
      operationId: listParks
      summary: Consultar parques industriales accesibles para el usuario
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: tipo
        in: query
        schema:
          $ref: '#/components/schemas/TipoParque'
      - name: estado
        in: query
        schema:
          $ref: '#/components/schemas/EstadoParque'
      responses:
        '200':
          description: Lista de parques.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      x-acceptance-criteria: []
    post:
      tags:
      - Parques industriales
      operationId: createPark
      summary: Registrar un parque industrial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParkCreate'
      responses:
        '201':
          description: Parque registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Park'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '409':
          $ref: '#/components/responses/Conflict'
      x-acceptance-criteria:
      - RF-02-AC-1
      - RF-02-AC-2
      - RF-02-AC-3
      description: Se rechaza con 409 Conflict si ya existe un registro que represente el mismo parque 
        conforme a la clave de negocio configurada. Los reintentos con la misma Idempotency-Key y carga útil 
        devuelven el resultado original.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
  /auditoria:
    get:
      tags:
      - Auditoría
      operationId: listAuditEvents
      summary: Consultar eventos de auditoría
      description: Acceso restringido a roles autorizados; los eventos históricos no se editan ni eliminan.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: entidad
        in: query
        schema:
          type: string
      - name: entidad_id
        in: query
        schema:
          type: string
          format: uuid
      - name: desde
        in: query
        schema:
          type: string
          format: date-time
      - name: hasta
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Eventos de auditoría.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      x-acceptance-criteria:
      - RF-35-AC-1
      - RF-35-AC-2
      - RF-35-AC-3
      - RF-35-AC-4
  /estandares:
    get:
      tags:
      - Checklist de seguridad
      operationId: listStandards
      summary: Consultar estándares de seguridad
      responses:
        '200':
          description: Estándares registrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Standard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      x-acceptance-criteria: []
    post:
      tags:
      - Checklist de seguridad
      operationId: createStandard
      summary: Crear un estándar de seguridad
      description: Se rechaza con 409 Conflict si ya existe un estándar con el mismo identificador o nombre 
        único dentro de la versión del catálogo. Se admite Idempotency-Key para reintentos seguros.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandardCreate'
      responses:
        '201':
          description: Estándar creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Standard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '409':
          $ref: '#/components/responses/Conflict'
      x-acceptance-criteria: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
  /estandares/{estandar_id}/criterios:
    parameters:
    - name: estandar_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Checklist de seguridad
      operationId: listCriteriaByStandard
      summary: Consultar criterios de un estándar
      responses:
        '200':
          description: Criterios del estándar.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Criterion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      x-acceptance-criteria: []
    post:
      tags:
      - Checklist de seguridad
      operationId: createCriterion
      summary: Agregar un criterio a un estándar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriterionCreate'
      responses:
        '201':
          description: Criterio creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Criterion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '409':
          $ref: '#/components/responses/Conflict'
      x-acceptance-criteria: []
      description: Se rechaza con 409 Conflict si el identificador del criterio ya existe dentro de la versión
        del catálogo. Se admite Idempotency-Key para reintentos seguros.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
  /usuarios/{usuario_id}:
    parameters:
    - $ref: '#/components/parameters/UsuarioId'
    get:
      tags:
      - Usuarios y roles
      operationId: getUser
      summary: Obtener un usuario
      responses:
        '200':
          description: Usuario encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      x-acceptance-criteria: []
    put:
      tags:
      - Usuarios y roles
      operationId: replaceUser
      summary: Reemplazar los datos editables de un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '409':
          $ref: '#/components/responses/Conflict'
      x-acceptance-criteria: []
      description: 'Operación idempotente: reemplaza la representación editable del usuario. Repetir la misma solicitud
        con el mismo cuerpo deja exactamente los mismos datos y no duplica roles, eventos de negocio ni efectos
        secundarios. No modifica el identificador ni el historial.'
    patch:
      tags:
      - Usuarios y roles
      operationId: updateUser
      summary: Actualizar parcialmente un usuario
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
      x-acceptance-criteria: []
      description: La operación establece valores explícitos y no aplica incrementos relativos; repetir el 
        mismo documento de actualización produce el mismo estado final. Los cambios incompatibles con el 
        estado actual del dominio pueden responder 409 Conflict.
    delete:
      tags:
      - Usuarios y roles
      operationId: deactivateUser
      summary: Desactivar un usuario (baja lógica)
      responses:
        '200':
          description: Usuario desactivado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      x-acceptance-criteria:
      - RF-29-AC-1
      - RF-29-AC-2
      description: Baja lógica idempotente. Si el usuario ya está inactivo, la solicitud vuelve a confirmar el
        estado inactivo sin restaurar acceso ni duplicar efectos secundarios. Se conserva la auditoría 
        histórica.
  /usuarios/{usuario_id}/roles:
    parameters:
    - $ref: '#/components/parameters/UsuarioId'
    get:
      tags:
      - Usuarios y roles
      operationId: listUserRoles
      summary: Consultar roles asignados a un usuario
      responses:
        '200':
          description: Roles del usuario.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      x-acceptance-criteria: []
    put:
      tags:
      - Usuarios y roles
      operationId: setUserRoles
      summary: Sustituir el conjunto de roles de un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - roles
              properties:
                roles:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/TipoRol'
      responses:
        '200':
          description: Roles actualizados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '409':
          $ref: '#/components/responses/Conflict'
      x-acceptance-criteria:
      - RF-03-AC-2
      description: 'Operación idempotente: reemplaza por completo el conjunto de roles asignados. Repetir el mismo
        conjunto produce el mismo resultado y no agrega asignaciones duplicadas.'
  /parques/{parque_id}:
    parameters:
    - $ref: '#/components/parameters/ParqueId'
    get:
      tags:
      - Parques industriales
      operationId: getPark
      summary: Consultar un parque industrial
      responses:
        '200':
          description: Parque encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Park'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      x-acceptance-criteria: []
    put:
      tags:
      - Parques industriales
      operationId: updatePark
      summary: Actualizar los datos de un parque
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParkCreate'
      responses:
        '200':
          description: Parque actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Park'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '409':
          $ref: '#/components/responses/Conflict'
      x-acceptance-criteria: []
      description: 'Operación idempotente: reemplaza los datos editables del parque. Repetir la misma solicitud
        deja exactamente el mismo estado y no altera el historial de evaluaciones.'
    patch:
      tags:
      - Parques industriales
      operationId: patchPark
      summary: Modificar parcialmente un parque
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ParkPatch'
      responses:
        '200':
          description: Parque actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Park'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '409':
          $ref: '#/components/responses/Conflict'
      x-acceptance-criteria: []
      description: La operación establece valores explícitos y no aplica incrementos relativos; repetir el 
        mismo documento de actualización produce el mismo estado final. Los cambios incompatibles con el 
        estado actual del dominio pueden responder 409 Conflict.
    delete:
      tags:
      - Parques industriales
      operationId: deactivatePark
      summary: Marcar un parque como inactivo
      description: Baja lógica idempotente. Si el parque ya está inactivo, la solicitud conserva ese estado y 
        no vuelve a revocar accesos ni duplica efectos secundarios. Se preservan evaluaciones y auditoría.
      responses:
        '200':
          description: Parque desactivado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      x-acceptance-criteria:
      - RF-29-AC-3
  /criterios/{criterio_id}:
    parameters:
    - name: criterio_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Checklist de seguridad
      operationId: getCriterion
      summary: Obtener un criterio
      responses:
        '200':
          description: Criterio encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Criterion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      x-acceptance-criteria: []
    put:
      tags:
      - Checklist de seguridad
      operationId: updateCriterion
      summary: Actualizar un criterio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriterionCreate'
      responses:
        '200':
          description: Criterio actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Criterion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '409':
          $ref: '#/components/responses/Conflict'
      x-acceptance-criteria: []
      description: 'Operación idempotente: reemplaza los datos editables del criterio. Repetir la misma solicitud
        deja el mismo estado y no genera registros duplicados; el historial del catálogo se conserva según las reglas
        del dominio.'
    patch:
      tags:
      - Checklist de seguridad
      operationId: patchCriterion
      summary: Modificar parcialmente un criterio
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/CriterionPatch'
      responses:
        '200':
          description: Criterio actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Criterion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '409':
          $ref: '#/components/responses/Conflict'
      x-acceptance-criteria: []
      description: La operación establece valores explícitos y no aplica incrementos relativos; repetir el 
        mismo documento de actualización produce el mismo estado final. Los cambios incompatibles con el 
        estado actual del dominio pueden responder 409 Conflict.
    delete:
