          $ref: '#/components/responses/ValidationError'
      x-acceptance-criteria: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Enviar el token como Authorization: Bearer <JWT>.'
  parameters:
    UsuarioId:
      name: usuario_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ParqueId:
      name: parque_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Número de página, empezando en 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: Cantidad de elementos por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Clave opaca única por intento lógico. Si se reenvía la misma clave con la misma solicitud, 
        se devuelve el resultado original sin crear duplicados. La clave se conserva durante al menos 24 
        horas. Si la misma clave se reutiliza con un cuerpo distinto, la API responde 409 Conflict.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    BadRequest:
      description: Solicitud incorrecta o parámetros incompatibles.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token ausente, inválido o expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: El usuario autenticado no tiene permisos para el recurso o parque solicitado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: El cuerpo o los parámetros no cumplen el esquema o una regla de dominio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    ServerError:
      description: Error interno no esperado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicto con el estado actual del recurso o con una restricción de unicidad del dominio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: FORBIDDEN
        message:
          type: string
          example: No tiene permisos para realizar esta operación.
        requestId:
          type: string
          format: uuid
        details:
          type: object
          additionalProperties: true
    ValidationError:
      type: object
      required:
      - code
      - message
      - errors
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    Message:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    LoginRequest:
      type: object
      required:
      - correo
      - contrasena
      properties:
        correo:
          type: string
          format: email
        contrasena:
          type: string
          format: password
          minLength: 8
    TokenResponse:
      type: object
      required:
      - accessToken
      - tokenType
      - expiresIn
      properties:
        accessToken:
          type: string
          description: JWT de acceso
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          description: Duración del token en segundos
        usuario:
          $ref: '#/components/schemas/User'
    TipoRol:
      type: string
      enum:
      - COORDINACION_AMPIP
      - DIRECTOR_GENERAL_AMPIP
      - APPI
      - CONSULTOR_ASIGNADO
      - CONSULTOR_COMITE
      - GERENTE_CORPORATIVO
      - ADMIN_TECNICO
    RoleAssignment:
      type: object
      required:
      - id
      - nombre
      - descripcion
      properties:
        id:
          type: string
          format: uuid
        nombre:
          $ref: '#/components/schemas/TipoRol'
        descripcion:
          type: string
    UserCreate:
      type: object
      required:
      - nombre
      - correo
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 150
        correo:
          type: string
          format: email
          maxLength: 254
        activo:
          type: boolean
          default: true
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TipoRol'
        parquesAsignados:
          type: array
          items:
            type: string
            format: uuid
    UserPatch:
      type: object
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 150
        correo:
          type: string
          format: email
          maxLength: 254
        activo:
          type: boolean
    User:
      allOf:
      - $ref: '#/components/schemas/UserCreate'
      - type: object
        required:
        - id
        - fechaCreacion
        properties:
          id:
            type: string
            format: uuid
          fechaCreacion:
            type: string
            format: date-time
    UserList:
      type: object
      required:
      - items
      - page
      - pageSize
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    TipoParque:
      type: string
      enum:
      - EN_CONSTRUCCION_ABIERTO
      - EN_CONSTRUCCION_CERRADO
      - EN_OPERACION_ABIERTO
      - EN_OPERACION_CERRADO
    EstadoParque:
      type: string
      enum:
      - ACTIVO
      - INACTIVO
    ParkCreate:
      type: object
      required:
      - nombre
      - ubicacion
      - tipo
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 200
        ubicacion:
          type: string
          minLength: 2
          maxLength: 500
        tipo:
          $ref: '#/components/schemas/TipoParque'
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoParque'
          default: ACTIVO
    ParkPatch:
      type: object
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 200
        ubicacion:
          type: string
          maxLength: 500
        tipo:
          $ref: '#/components/schemas/TipoParque'
        estado:
          $ref: '#/components/schemas/EstadoParque'
    Park:
      allOf:
      - $ref: '#/components/schemas/ParkCreate'
      - type: object
        required:
        - id
        - fechaRegistro
        properties:
          id:
            type: string
            format: uuid
          fechaRegistro:
            type: string
            format: date-time
    ParkList:
      type: object
      required:
      - items
      - page
      - pageSize
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Park'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    StandardCreate:
      type: object
      required:
      - nombre
      - orden
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 200
        descripcion:
          type: string
          maxLength: 2000
        orden:
          type: integer
          minimum: 1
    Standard:
      allOf:
      - $ref: '#/components/schemas/StandardCreate'
      - type: object
        required:
        - id
        properties:
          id:
            type: string
            format: uuid
    CriterionCreate:
      type: object
      required:
      - codigo
      - descripcion
      - versionChecklist
      properties:
        codigo:
          type: string
          maxLength: 50
        descripcion:
          type: string
          minLength: 1
          maxLength: 4000
        versionChecklist:
          type: string
          example: '2023'
    CriterionPatch:
      type: object
      minProperties: 1
      properties:
        codigo:
          type: string
          maxLength: 50
        descripcion:
          type: string
          maxLength: 4000
        versionChecklist:
          type: string
    Criterion:
      allOf:
      - $ref: '#/components/schemas/CriterionCreate'
      - type: object
        required:
        - id
        - estandarId
        properties:
          id:
            type: string
            format: uuid
          estandarId:
            type: string
            format: uuid
    EstadoPlan:
      type: string
      enum:
      - BORRADOR
      - ACTIVO
      - CERRADO
    WorkPlanCreate:
      type: object
      required:
      - descripcion
      properties:
        descripcion:
          type: string
          minLength: 1
          maxLength: 4000
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoPlan'
          default: BORRADOR
    WorkPlanPatch:
      type: object
      minProperties: 1
      properties:
        descripcion:
          type: string
          maxLength: 4000
        estado:
          $ref: '#/components/schemas/EstadoPlan'
    WorkPlan:
      allOf:
      - $ref: '#/components/schemas/WorkPlanCreate'
