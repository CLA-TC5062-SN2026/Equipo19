          type: string
          format: date-time
        usuarioId:
          type: string
          format: uuid
          nullable: true
        accion:
          type: string
        entidad:
          type: string
        entidadId:
          type: string
          format: uuid
        detalle:
          type: string
        resultado:
          type: string
