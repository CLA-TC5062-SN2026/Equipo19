openapi: 3.0.3
info:
  title: SGPIS API
  version: 0.1.0
  description: |
    API del Sistema de Gestión del Programa Parque Industrial Seguro (AMPIP).
    Primera pasada generada a partir de SRS_equipo.md v2.0 y de las tareas del Sprint 1.
    Las rutas que el SRS o las tareas ya nombran se respetan tal cual.
servers:
  - url: http://localhost:8000/api/v1
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: Autenticación
  - name: Usuarios
  - name: Desarrolladores
  - name: Generaciones
  - name: Catálogo
  - name: Parques
  - name: Criterios del parque
  - name: Autoevaluaciones
  - name: Plan de trabajo
  - name: Evidencias
  - name: Análisis de riesgos
  - name: Fases
  - name: Opiniones
  - name: Evaluaciones de desempeño
  - name: Comité
  - name: Dictámenes
  - name: Reportes
  - name: Bitácora
  - name: Configuración
  - name: Sistema

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Estado del servicio
      operationId: obtenerSalud
      security: []
      x-acceptance-criteria: []
      responses:
        '200':
          description: Servicio arriba
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      operationId: login
      security: []
      x-acceptance-criteria: [RF-26-AC-1, RF-26-AC-2, RF-26-AC-3]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credenciales' }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionCreada' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
        '423': { $ref: '#/components/responses/CuentaBloqueada' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión
      operationId: logout
      x-acceptance-criteria: [RF-26-AC-5]
      responses:
        '204': { description: Sesión cerrada }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /auth/yo:
    get:
      tags: [Autenticación]
      summary: Usuario de la sesión actual
      operationId: obtenerUsuarioActual
      x-acceptance-criteria: [RF-26-AC-6]
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /auth/recuperacion:
    post:
      tags: [Autenticación]
      summary: Solicitar recuperación de contraseña
      operationId: solicitarRecuperacion
      security: []
      x-acceptance-criteria: [RF-26-AC-4]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudRecuperacion' }
      responses:
        '202': { description: Solicitud recibida }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /auth/restablecimiento:
    post:
      tags: [Autenticación]
      summary: Restablecer contraseña con token
      operationId: restablecerContrasena
      security: []
      x-acceptance-criteria: [RF-26-AC-4]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Restablecimiento' }
      responses:
        '204': { description: Contraseña restablecida }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /auth/activacion:
    post:
      tags: [Autenticación]
      summary: Activar cuenta desde la invitación
      operationId: activarCuenta
      security: []
      x-acceptance-criteria: [RF-03-AC-1]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Activacion' }
      responses:
        '204': { description: Cuenta activada }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios
      operationId: listarUsuarios
      x-acceptance-criteria: []
      parameters:
        - { name: rol, in: query, schema: { $ref: '#/components/schemas/Rol' } }
        - { name: parque_id, in: query, schema: { type: string, format: uuid } }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoUsuario' } }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Página de usuarios
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaUsuarios' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    post:
      tags: [Usuarios]
      summary: Dar de alta usuario
      operationId: crearUsuario
      x-acceptance-criteria: [RF-03-AC-1, RF-03-AC-2, RF-03-AC-3]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioCrear' }
      responses:
        '201':
          description: Usuario creado en estado pendiente_activacion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /usuarios/{usuario_id}:
    parameters:
      - $ref: '#/components/parameters/UsuarioId'
    get:
      tags: [Usuarios]
      summary: Consultar usuario
      operationId: obtenerUsuario
      x-acceptance-criteria: []
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    patch:
      tags: [Usuarios]
      summary: Modificar usuario
      operationId: actualizarUsuario
      x-acceptance-criteria: [RF-03-AC-2]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioActualizar' }
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /usuarios/{usuario_id}/baja:
    parameters:
      - $ref: '#/components/parameters/UsuarioId'
    post:
      tags: [Usuarios]
      summary: Dar de baja usuario
      operationId: darDeBajaUsuario
      x-acceptance-criteria: [RF-29-AC-1, RF-29-AC-2]
      responses:
        '200':
          description: Usuario desactivado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /desarrolladores:
    get:
      tags: [Desarrolladores]
      summary: Listar desarrolladores
      operationId: listarDesarrolladores
      x-acceptance-criteria: []
      responses:
        '200':
          description: Desarrolladores
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos:
                    type: array
                    items: { $ref: '#/components/schemas/Desarrollador' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    post:
      tags: [Desarrolladores]
      summary: Registrar desarrollador
      operationId: crearDesarrollador
      x-acceptance-criteria: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesarrolladorCrear' }
      responses:
        '201':
          description: Desarrollador creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Desarrollador' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /generaciones:
    get:
      tags: [Generaciones]
      summary: Listar generaciones
      operationId: listarGeneraciones
      x-acceptance-criteria: []
      responses:
        '200':
          description: Generaciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos:
                    type: array
                    items: { $ref: '#/components/schemas/Generacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    post:
      tags: [Generaciones]
      summary: Crear generación
      operationId: crearGeneracion
      x-acceptance-criteria: [RF-28-AC-1, RF-28-AC-2, RF-01-AC-5]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GeneracionCrear' }
      responses:
        '201':
          description: Generación creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Generacion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /generaciones/{generacion_id}:
    parameters:
      - $ref: '#/components/parameters/GeneracionId'
    get:
      tags: [Generaciones]
      summary: Consultar generación
      operationId: obtenerGeneracion
      x-acceptance-criteria: [RF-28-AC-1]
      responses:
        '200':
          description: Generación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Generacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /catalogo/versiones:
    get:
      tags: [Catálogo]
      summary: Listar versiones del catálogo
      operationId: listarVersionesCatalogo
      x-acceptance-criteria: [RF-01-AC-5]
      responses:
        '200':
          description: Versiones
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos:
                    type: array
                    items: { $ref: '#/components/schemas/VersionCatalogo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    post:
      tags: [Catálogo]
      summary: Cargar nueva versión del catálogo (CSV)
      operationId: cargarVersionCatalogo
      x-acceptance-criteria: [RF-01-AC-1, RF-01-AC-2, RF-01-AC-4]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/CargaCatalogo' }
      responses:
        '201':
          description: Versión creada y marcada vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionCatalogo' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /catalogo/versiones/{version_id}:
    parameters:
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [Catálogo]
      summary: Consultar versión del catálogo
      operationId: obtenerVersionCatalogo
      x-acceptance-criteria: [RF-01-AC-5]
      responses:
        '200':
          description: Versión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionCatalogo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /catalogo/versiones/{version_id}/criterios:
    parameters:
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [Catálogo]
      summary: Listar criterios de una versión
      operationId: listarCriteriosVersion
      x-acceptance-criteria: []
      parameters:
        - { name: estandar, in: query, schema: { type: integer, minimum: 1, maximum: 10 } }
      responses:
        '200':
          description: Criterios
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos:
                    type: array
                    items: { $ref: '#/components/schemas/CriterioCatalogo' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /catalogo/exportar:
    get:
      tags: [Catálogo]
      summary: Exportar archivo maestro del catálogo vigente
      operationId: exportarCatalogo
      x-acceptance-criteria: [RF-25-AC-2, RF-25-AC-3, RF-25-AC-4]
      responses:
        '200':
          description: CSV con los 286 criterios y sus cuatro marcas
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /catalogo/criterios/{criterio_id}/evidencia-suficiente:
    parameters:
      - $ref: '#/components/parameters/CriterioId'
    put:
      tags: [Catálogo]
      summary: Definir evidencia suficiente de un criterio
      operationId: definirEvidenciaSuficiente
      x-acceptance-criteria: [RF-24-AC-1, RF-24-AC-2]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenciaSuficienteGuardar' }
      responses:
        '200':
          description: Descripción guardada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenciaSuficiente' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /parques:
    get:
      tags: [Parques]
      summary: Listar parques visibles para el usuario
      operationId: listarParques
      x-acceptance-criteria: [RF-23-AC-1, RF-29-AC-3, RF-30-AC-2]
      parameters:
        - { name: generacion_id, in: query, schema: { type: string, format: uuid } }
        - { name: region, in: query, schema: { $ref: '#/components/schemas/Region' } }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoParque' } }
        - { name: atrasado, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Página de parques
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaParques' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    post:
      tags: [Parques]
      summary: Dar de alta parque (activo o histórico)
      operationId: crearParque
      x-acceptance-criteria: [RF-02-AC-1, RF-02-AC-2, RF-02-AC-3, RF-28-AC-3, RF-31-AC-2]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParqueCrear' }
      responses:
        '201':
          description: Parque creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parque' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /parques/{parque_id}:
    parameters:
      - $ref: '#/components/parameters/ParqueId'
    get:
      tags: [Parques]
      summary: Consultar expediente del parque
      operationId: obtenerParque
      x-acceptance-criteria: [RF-01-AC-3, RF-30-AC-1, RF-13-AC-1, RF-13-AC-3, RF-35-AC-2, RF-34-AC-3]
      responses:
        '200':
          description: Expediente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parque' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    patch:
      tags: [Parques]
      summary: Modificar datos del parque y fechas del programa
      operationId: actualizarParque
      x-acceptance-criteria: [RF-30-AC-1, RF-01-AC-3]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParqueActualizar' }
      responses:
        '200':
          description: Parque actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parque' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /parques/{parque_id}/baja:
    parameters:
      - $ref: '#/components/parameters/ParqueId'
    post:
      tags: [Parques]
      summary: Dar de baja parque
      operationId: darDeBajaParque
      x-acceptance-criteria: [RF-29-AC-3]
      responses:
        '200':
          description: Parque desactivado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parque' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /parques/{parque_id}/tipo-pi:
    parameters:
      - $ref: '#/components/parameters/ParqueId'
    put:
      tags: [Parques]
      summary: Cambiar tipo de PI y recalcular criterios
      operationId: cambiarTipoPI
      x-acceptance-criteria: [RF-11-AC-1, RF-11-AC-3, RF-11-AC-4, RF-11-AC-5, RF-11-AC-6]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambioTipoPICrear' }
      responses:
        '200':
          description: Tipo cambiado; devuelve el nuevo registro de historial
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CambioTipoPI' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /parques/{parque_id}/cumplimiento:
    parameters:
      - $ref: '#/components/parameters/ParqueId'
    get:
      tags: [Parques]
      summary: Cifras de cumplimiento
      operationId: obtenerCumplimiento
      x-acceptance-criteria: [RF-08-AC-1, RF-08-AC-2, RF-08-AC-3, RF-08-AC-4, RF-08-AC-5, RF-11-AC-2, RF-11-AC-6, RF-27-AC-6]
      responses:
        '200':
          description: Cifras
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cumplimiento' }
