components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UsuarioId: { name: usuario_id, in: path, required: true, schema: { type: string, format: uuid } }
    GeneracionId: { name: generacion_id, in: path, required: true, schema: { type: string, format: uuid } }
    VersionId: { name: version_id, in: path, required: true, schema: { type: string, format: uuid } }
    CriterioId: { name: criterio_id, in: path, required: true, schema: { type: string, format: uuid } }
    ParqueId: { name: parque_id, in: path, required: true, schema: { type: string, format: uuid } }
    EvidenciaId: { name: evidencia_id, in: path, required: true, schema: { type: string, format: uuid } }
    RevisionId: { name: revision_id, in: path, required: true, schema: { type: string, format: uuid } }
    SesionComiteId: { name: sesion_id, in: path, required: true, schema: { type: string, format: uuid } }
    DictamenId: { name: dictamen_id, in: path, required: true, schema: { type: string, format: uuid } }
    FaseClave: { name: fase, in: path, required: true, schema: { type: string } }
    Pagina: { name: pagina, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PorPagina: { name: por_pagina, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }

  responses:
    SolicitudInvalida:
      description: Solicitud mal formada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoAutenticado:
      description: Sin sesión válida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SinPermiso:
      description: Sin permiso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoEncontrado:
      description: No existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflicto:
      description: Duplicado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ReglaIncumplida:
      description: Regla de negocio incumplida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CuentaBloqueada:
      description: Cuenta bloqueada temporalmente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ErrorInterno:
      description: Error no controlado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [mensaje]
      properties:
        mensaje: { type: string }
        detalles:
          type: array
          items:
            type: object
            properties:
              campo: { type: string }
              fila: { type: integer }
              columna: { type: string }
              mensaje: { type: string }

    Paginacion:
      type: object
      properties:
        pagina: { type: integer }
        por_pagina: { type: integer }
        total: { type: integer }

    Salud:
      type: object
      properties:
        estado: { type: string, enum: [ok, degradado] }
        version: { type: string }
        base_datos: { type: string, enum: [ok, sin_conexion] }

    Rol:
      type: string
      enum: [coordinacion_ampip, director_general, appi, consultor, gerente_corporativo, administrador_tecnico]

    EstadoUsuario:
      type: string
      enum: [pendiente_activacion, activo, inactivo]

    TipoPI:
      type: string
      enum: [construccion_abierto, construccion_cerrado, operacion_abierto, operacion_cerrado]

    Region:
      type: string
      enum: [Aguascalientes, Baja California, Baja California Sur, Campeche, Chiapas, Chihuahua, Ciudad de México, Coahuila, Colima, Durango, Estado de México, Guanajuato, Guerrero, Hidalgo, Jalisco, Michoacán, Morelos, Nayarit, Nuevo León, Oaxaca, Puebla, Querétaro, Quintana Roo, San Luis Potosí, Sinaloa, Sonora, Tabasco, Tamaulipas, Tlaxcala, Veracruz, Yucatán, Zacatecas]

    Marca:
      type: string
      enum: [O, R, NA]

    EstadoCalificacion:
      type: string
      enum: [pendiente, en_revision, cumplido, no_cumplido]

    EstadoEvidencia:
      type: string
      enum: [enviada, observada, aceptada, eliminada]

    EstadoParque:
      type: string
      enum: [activo, inactivo, historico]

    RespuestaAutoevaluacion:
      type: string
      enum: [cumple, cumple_parcialmente, no_cumple]

    Credenciales:
      type: object
      required: [correo, contrasena]
      properties:
        correo: { type: string, format: email }
        contrasena: { type: string, format: password }

    SesionCreada:
      type: object
      properties:
        token: { type: string }
        tipo_token: { type: string, enum: [Bearer] }
        expira_por_inactividad_min: { type: integer, example: 60 }
        usuario: { $ref: '#/components/schemas/UsuarioResumen' }

    SolicitudRecuperacion:
      type: object
      required: [correo]
      properties:
        correo: { type: string, format: email }

    Restablecimiento:
      type: object
      required: [token, contrasena_nueva]
      properties:
        token: { type: string }
        contrasena_nueva: { type: string, format: password, minLength: 12 }

    Activacion:
      type: object
      required: [token, contrasena]
      properties:
        token: { type: string }
        contrasena: { type: string, format: password, minLength: 12 }

    RolAsignado:
      type: object
      required: [rol]
      properties:
        rol: { $ref: '#/components/schemas/Rol' }
        parque_id: { type: string, format: uuid, nullable: true }
        desarrollador_id: { type: string, format: uuid, nullable: true }

    UsuarioResumen:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        correo: { type: string, format: email }

    Usuario:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        correo: { type: string, format: email }
        estado: { $ref: '#/components/schemas/EstadoUsuario' }
        roles:
          type: array
          items: { $ref: '#/components/schemas/RolAsignado' }
        creado_en: { type: string, format: date-time }

    UsuarioCrear:
      type: object
      required: [nombre, correo, roles]
      properties:
        nombre: { type: string }
        correo: { type: string, format: email }
        roles:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RolAsignado' }

    UsuarioActualizar:
      type: object
      properties:
        nombre: { type: string }
        roles:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RolAsignado' }

    UsuarioDeParque:
      allOf:
        - $ref: '#/components/schemas/UsuarioResumen'
        - type: object
          properties:
            estado: { $ref: '#/components/schemas/EstadoUsuario' }
            es_contacto_principal: { type: boolean }

    PaginaUsuarios:
      type: object
      properties:
        datos:
          type: array
          items: { $ref: '#/components/schemas/Usuario' }
        paginacion: { $ref: '#/components/schemas/Paginacion' }

    Desarrollador:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }

    DesarrolladorCrear:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string }

    Generacion:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, example: '2027' }
        fecha_inicio: { type: string, format: date }
        version_catalogo_id: { type: string, format: uuid }
        creada_en: { type: string, format: date-time }

    GeneracionCrear:
      type: object
      required: [nombre, fecha_inicio, version_catalogo_id]
      properties:
        nombre: { type: string }
        fecha_inicio: { type: string, format: date }
        version_catalogo_id: { type: string, format: uuid }

    VersionCatalogo:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, example: catalogo-2023-v1 }
        vigente: { type: boolean }
        solo_lectura: { type: boolean }
        total_criterios: { type: integer, example: 286 }
        cargada_en: { type: string, format: date-time }
        cargada_por: { $ref: '#/components/schemas/UsuarioResumen' }

    CargaCatalogo:
      type: object
      required: [nombre, archivo]
      properties:
        nombre: { type: string }
        archivo: { type: string, format: binary }

    MarcasPorTipo:
      type: object
      properties:
        construccion_abierto: { $ref: '#/components/schemas/Marca' }
        construccion_cerrado: { $ref: '#/components/schemas/Marca' }
        operacion_abierto: { $ref: '#/components/schemas/Marca' }
        operacion_cerrado: { $ref: '#/components/schemas/Marca' }

    CriterioCatalogo:
      type: object
      properties:
        id: { type: string, format: uuid }
        clave: { type: string, example: '2.8.1' }
        estandar: { type: integer }
        subestandar: { type: string }
        descripcion: { type: string }
        metodo_verificacion: { type: string }
        marcas: { $ref: '#/components/schemas/MarcasPorTipo' }
        evidencia_suficiente: { type: string, nullable: true }

    EvidenciaSuficiente:
      type: object
      properties:
        criterio_id: { type: string, format: uuid }
        descripcion: { type: string }
        actualizada_en: { type: string, format: date-time }
        actualizada_por: { $ref: '#/components/schemas/UsuarioResumen' }

    EvidenciaSuficienteGuardar:
      type: object
      required: [descripcion]
      properties:
        descripcion: { type: string, maxLength: 4000 }

    Parque:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        desarrollador: { $ref: '#/components/schemas/Desarrollador' }
        tipo_pi: { $ref: '#/components/schemas/TipoPI' }
        region: { $ref: '#/components/schemas/Region' }
        generacion_id: { type: string, format: uuid }
        version_catalogo: { type: string, readOnly: true }
        estado: { $ref: '#/components/schemas/EstadoParque' }
        fecha_alta: { type: string, format: date }
        fecha_termino_programa: { type: string, format: date, nullable: true }
        fecha_proxima_actualizacion: { type: string, format: date, nullable: true }
        atrasado: { type: boolean }
        contacto_principal:
          allOf: [ { $ref: '#/components/schemas/UsuarioResumen' } ]
          nullable: true
        consultor_asignado:
          allOf: [ { $ref: '#/components/schemas/UsuarioResumen' } ]
          nullable: true
        fase_actual: { type: string, nullable: true }

    ParqueResumen:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        region: { $ref: '#/components/schemas/Region' }
        tipo_pi: { $ref: '#/components/schemas/TipoPI' }
        fase_actual: { type: string, nullable: true }
        atrasado: { type: boolean }
        cumplimiento_obligatorios: { type: number, nullable: true }
        avance_general: { type: number, nullable: true }

    PaginaParques:
      type: object
      properties:
        datos:
          type: array
          items: { $ref: '#/components/schemas/ParqueResumen' }
        paginacion: { $ref: '#/components/schemas/Paginacion' }

    ParqueCrear:
      oneOf:
        - $ref: '#/components/schemas/ParqueCrearActivo'
        - $ref: '#/components/schemas/ParqueCrearHistorico'
      discriminator:
        propertyName: tipo_registro
        mapping:
          activo: '#/components/schemas/ParqueCrearActivo'
          historico: '#/components/schemas/ParqueCrearHistorico'

    ParqueCrearActivo:
      type: object
      required: [tipo_registro, nombre, desarrollador_id, tipo_pi, region, generacion_id]
      properties:
        tipo_registro: { type: string, enum: [activo] }
        nombre: { type: string }
        desarrollador_id: { type: string, format: uuid }
        tipo_pi: { $ref: '#/components/schemas/TipoPI' }
        region: { $ref: '#/components/schemas/Region' }
        generacion_id: { type: string, format: uuid }

    ParqueCrearHistorico:
      type: object
      required: [tipo_registro, nombre, region, fecha_ultimo_dictamen, fecha_termino_programa]
      properties:
        tipo_registro: { type: string, enum: [historico] }
        nombre: { type: string }
        region: { $ref: '#/components/schemas/Region' }
        fecha_ultimo_dictamen: { type: string, format: date }
        fecha_termino_programa: { type: string, format: date }

    ParqueActualizar:
      type: object
      properties:
        nombre: { type: string }
        desarrollador_id: { type: string, format: uuid }
        region: { $ref: '#/components/schemas/Region' }
        fecha_termino_programa: { type: string, format: date }
        fecha_proxima_actualizacion: { type: string, format: date }

    CambioTipoPI:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipo_pi_anterior: { $ref: '#/components/schemas/TipoPI' }
        tipo_pi: { $ref: '#/components/schemas/TipoPI' }
        fecha_desde: { type: string, format: date }
        fecha_hasta: { type: string, format: date, nullable: true }
        motivo: { type: string }
        registrado_por: { $ref: '#/components/schemas/UsuarioResumen' }

    CambioTipoPICrear:
      type: object
      required: [tipo_pi, motivo, fecha_desde]
      properties:
        tipo_pi: { $ref: '#/components/schemas/TipoPI' }
        motivo: { type: string }
        fecha_desde: { type: string, format: date }

    ActualizacionAnual:
      type: object
      properties:
        id: { type: string, format: uuid }
        fecha: { type: string, format: date }
        siguiente_actualizacion: { type: string, format: date }
        registrada_por: { $ref: '#/components/schemas/UsuarioResumen' }

    ActualizacionAnualCrear:
      type: object
      required: [fecha]
      properties:
        fecha: { type: string, format: date }

    ContactoPrincipalGuardar:
      type: object
      required: [usuario_id]
      properties:
        usuario_id: { type: string, format: uuid }

    AsignacionConsultor:
      type: object
      properties:
        id: { type: string, format: uuid }
        consultor: { $ref: '#/components/schemas/UsuarioResumen' }
        generacion_id: { type: string, format: uuid }
        desde: { type: string, format: date-time }
        hasta: { type: string, format: date-time, nullable: true }
        vigente: { type: boolean }

    AsignacionConsultorCrear:
      type: object
      required: [consultor_id, generacion_id]
      properties:
        consultor_id: { type: string, format: uuid }
        generacion_id: { type: string, format: uuid }

    Fase:
      type: object
      properties:
        clave: { type: string, example: plan_trabajo }
        nombre: { type: string, example: Plan de trabajo }
        orden: { type: integer }
        estado: { type: string, enum: [pendiente, en_proceso, completada, avanzada_por_excepcion] }
        actual: { type: boolean }
        motivo_excepcion: { type: string, nullable: true }
        cerrada_por:
          allOf: [ { $ref: '#/components/schemas/UsuarioResumen' } ]
          nullable: true
        cerrada_en: { type: string, format: date-time, nullable: true }

    Cifra:
      type: object
      properties:
        aplicables: { type: integer }
        cumplidos: { type: integer }
        porcentaje: { type: number, nullable: true }
        no_aplica: { type: boolean }

    Cumplimiento:
      type: object
      properties:
        parque_id: { type: string, format: uuid }
        tipo_pi: { $ref: '#/components/schemas/TipoPI' }
        version_catalogo: { type: string }
        obligatorios: { $ref: '#/components/schemas/Cifra' }
        recomendados: { $ref: '#/components/schemas/Cifra' }
        avance_general: { $ref: '#/components/schemas/Cifra' }
        por_estandar:
          type: array
          items:
            type: object
            properties:
              estandar: { type: integer }
              obligatorios: { $ref: '#/components/schemas/Cifra' }
              recomendados: { $ref: '#/components/schemas/Cifra' }
              avance_general: { $ref: '#/components/schemas/Cifra' }
        clasificaciones_anteriores:
          type: array
          items:
            type: object
            properties:
              tipo_pi: { $ref: '#/components/schemas/TipoPI' }
              fecha_desde: { type: string, format: date }
              fecha_hasta: { type: string, format: date }
              obligatorios: { $ref: '#/components/schemas/Cifra' }

    HistorialParque:
      type: object
      properties:
        parque: { $ref: '#/components/schemas/ParqueResumen' }
        participaciones:
          type: array
          items:
            type: object
            properties:
              generacion: { $ref: '#/components/schemas/Generacion' }
              fecha_termino_programa: { type: string, format: date, nullable: true }
              fecha_proxima_actualizacion: { type: string, format: date, nullable: true }
              autoevaluaciones_respondidas: { type: integer }
              opiniones:
                type: array
                items: { $ref: '#/components/schemas/Opinion' }
              dictamenes:
                type: array
                items: { $ref: '#/components/schemas/Dictamen' }

    CriterioParque:
      type: object
      properties:
        criterio_id: { type: string, format: uuid }
        clave: { type: string }
        estandar: { type: integer }
        subestandar: { type: string }
        descripcion: { type: string }
        marca: { type: string, enum: [O, R] }
        estado_calificacion: { $ref: '#/components/schemas/EstadoCalificacion' }
        actualizado_en: { type: string, format: date-time, nullable: true }
        actualizado_por:
          allOf: [ { $ref: '#/components/schemas/UsuarioResumen' } ]
          nullable: true
        atrasado: { type: boolean }

    CriterioParqueDetalle:
      allOf:
        - $ref: '#/components/schemas/CriterioParque'
        - type: object
          properties:
            metodo_verificacion: { type: string }
            evidencia_suficiente: { type: string, nullable: true }

    Recomendacion:
      type: object
      properties:
        id: { type: string, format: uuid }
        texto: { type: string }
        autor: { $ref: '#/components/schemas/UsuarioResumen' }
        creada_en: { type: string, format: date-time }

    RecomendacionCrear:
      type: object
      required: [texto]
      properties:
        texto: { type: string, maxLength: 4000 }

    Autoevaluacion:
      type: object
      properties:
        criterio_id: { type: string, format: uuid }
        respuesta: { $ref: '#/components/schemas/RespuestaAutoevaluacion' }
        comentario: { type: string, nullable: true }
        actualizada_en: { type: string, format: date-time }
        actualizada_por: { $ref: '#/components/schemas/UsuarioResumen' }

    Compromiso:
      type: object
      properties:
        criterio_id: { type: string, format: uuid }
        clave: { type: string }
        responsable: { $ref: '#/components/schemas/UsuarioResumen' }
        fecha_comprometida: { type: string, format: date }
        atrasado: { type: boolean }
        estado_calificacion: { $ref: '#/components/schemas/EstadoCalificacion' }

    VersionEvidencia:
      type: object
      properties:
        numero: { type: integer }
        nombre_original: { type: string }
        tipo_mime: { type: string }
        tamano_bytes: { type: integer }
        cargada_en: { type: string, format: date-time }
        cargada_por: { $ref: '#/components/schemas/UsuarioResumen' }
        vigente: { type: boolean }

    Evidencia:
      type: object
      properties:
        id: { type: string, format: uuid }
        parque_id: { type: string, format: uuid }
        criterio_id: { type: string, format: uuid }
        clave_criterio: { type: string }
        fase: { type: string }
        estado: { $ref: '#/components/schemas/EstadoEvidencia' }
        es_administrativa: { type: boolean }
        documento_id: { type: string, format: uuid }
        versiones:
          type: array
          items: { $ref: '#/components/schemas/VersionEvidencia' }
        creada_en: { type: string, format: date-time }
        creada_por: { $ref: '#/components/schemas/UsuarioResumen' }
        eliminada_en: { type: string, format: date-time, nullable: true }

    PaginaEvidencias:
      type: object
      properties:
        datos:
          type: array
          items: { $ref: '#/components/schemas/Evidencia' }
        paginacion: { $ref: '#/components/schemas/Paginacion' }

    CargaEvidencias:
      type: object
      required: [archivos, criterio_ids, fase]
      properties:
        archivos:
          type: array
          minItems: 1
          items: { type: string, format: binary }
        criterio_ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        fase: { type: string }
        es_administrativa: { type: boolean, default: false }

    ResultadoCargaEvidencias:
      type: object
      properties:
        creadas:
          type: array
          items: { $ref: '#/components/schemas/Evidencia' }
        rechazadas:
          type: array
          items:
            type: object
            properties:
              nombre_archivo: { type: string }
              motivo: { type: string }

    Observacion:
      type: object
      properties:
        id: { type: string, format: uuid }
        evidencia_id: { type: string, format: uuid }
        version: { type: integer }
        texto: { type: string }
        autor: { $ref: '#/components/schemas/UsuarioResumen' }
        creada_en: { type: string, format: date-time }

    ObservacionCrear:
      type: object
      required: [texto]
      properties:
        texto: { type: string, maxLength: 4000 }

    EnlaceDescarga:
      type: object
      properties:
        url: { type: string, format: uri }
        expira_en: { type: string, format: date-time }

    RevisionAnalisisRiesgos:
      type: object
      properties:
        id: { type: string, format: uuid }
        parque_id: { type: string, format: uuid }
        fecha_revision: { type: string, format: date }
        version_documento: { type: string }
        firmado_por: { type: string }
        resumen: { type: string }
        vigente: { type: boolean }
        tiene_documento: { type: boolean }
        registrada_por: { $ref: '#/components/schemas/UsuarioResumen' }
        registrada_en: { type: string, format: date-time }

    RevisionAnalisisRiesgosCrear:
      type: object
      required: [fecha_revision, version_documento, firmado_por, resumen]
      properties:
        fecha_revision: { type: string, format: date }
        version_documento: { type: string }
        firmado_por: { type: string }
        resumen: { type: string, maxLength: 4000 }

    Opinion:
      type: object
      properties:
        id: { type: string, format: uuid }
        parque_id: { type: string, format: uuid }
        generacion_id: { type: string, format: uuid }
        tipo: { type: string, enum: [intermedia, final] }
        favorable: { type: boolean, nullable: true }
        comentario: { type: string, nullable: true }
        cumplimiento_obligatorios: { type: number, nullable: true }
        avance_general: { type: number, nullable: true }
        emitida_por: { $ref: '#/components/schemas/UsuarioResumen' }
        emitida_en: { type: string, format: date-time }

    OpinionCrear:
      type: object
      required: [tipo]
      properties:
        tipo: { type: string, enum: [intermedia, final] }
        favorable: { type: boolean }
        comentario: { type: string, maxLength: 4000 }

    EvaluacionDesempeno:
      type: object
      properties:
        id: { type: string, format: uuid }
        folio: { type: string, example: ED-2027-0007 }
        fecha: { type: string, format: date }
        consultor: { $ref: '#/components/schemas/UsuarioResumen' }
        version_catalogo: { type: string }
        resultado: { type: string }
        tiene_archivo: { type: boolean }

    EvaluacionDesempenoCrear:
      type: object
      required: [fecha, resultado]
      properties:
        fecha: { type: string, format: date }
        resultado: { type: string, maxLength: 8000 }
        archivo: { type: string, format: binary }

    SesionComite:
      type: object
      properties:
        id: { type: string, format: uuid }
        parque_id: { type: string, format: uuid }
        consultor_comite: { $ref: '#/components/schemas/UsuarioResumen' }
        estado: { type: string, enum: [abierta, cerrada] }
        abierta_en: { type: string, format: date-time }
        cerrada_en: { type: string, format: date-time, nullable: true }

    SesionComiteCrear:
      type: object
      required: [consultor_comite_id]
      properties:
        consultor_comite_id: { type: string, format: uuid }

    SesionComiteActualizar:
      type: object
      required: [estado]
      properties:
        estado: { type: string, enum: [cerrada] }

    Dictamen:
      type: object
      properties:
        id: { type: string, format: uuid }
        parque_id: { type: string, format: uuid }
        generacion_id: { type: string, format: uuid }
        resultado: { type: string, enum: [otorgar, no_otorgar] }
        motivo: { type: string }
        estado: { type: string, enum: [borrador, firmado] }
        capturado_por: { $ref: '#/components/schemas/UsuarioResumen' }
        capturado_en: { type: string, format: date-time }
        firmado_por:
          allOf: [ { $ref: '#/components/schemas/UsuarioResumen' } ]
          nullable: true
        firmado_en: { type: string, format: date-time, nullable: true }
        vigencia_hasta: { type: string, format: date, nullable: true }

    DictamenCrear:
      type: object
      required: [resultado, motivo]
      properties:
        resultado: { type: string, enum: [otorgar, no_otorgar] }
        motivo: { type: string, maxLength: 4000 }

    ReporteMensual:
      type: object
      properties:
        generacion: { type: string }
        periodo: { type: string, example: 2027-05 }
        generado_en: { type: string, format: date-time }
        parques:
          type: array
          items:
            type: object
            properties:
              parque_id: { type: string, format: uuid }
              nombre: { type: string }
              fase_actual: { type: string }
              atrasado: { type: boolean }
              observaciones_abiertas: { type: integer }

    EventoBitacora:
      type: object
      properties:
        id: { type: string, format: uuid }
        fecha_hora: { type: string, format: date-time }
        usuario_id: { type: string, format: uuid, nullable: true }
        rol: { type: string, nullable: true }
        parque_id: { type: string, format: uuid, nullable: true }
        accion: { type: string }
        recurso_tipo: { type: string }
        recurso_id: { type: string, nullable: true }
        resultado: { type: string, enum: [exitoso, denegado, fallido] }

    PaginaEventosBitacora:
      type: object
      properties:
        datos:
          type: array
          items: { $ref: '#/components/schemas/EventoBitacora' }
        paginacion: { $ref: '#/components/schemas/Paginacion' }

    Configuracion:
      type: object
      properties:
        limite_tamano_archivo_mb: { type: integer, example: 100 }
        vigencia_distintivo_anios: { type: integer, example: 3 }
