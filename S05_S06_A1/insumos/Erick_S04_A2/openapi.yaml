openapi: 3.0.3
info:
  title: SGPIS API
  version: 1.0.0
  description: >-
    API REST del Sistema de Gestion del Programa Parque Industrial Seguro. Las
    autorizaciones por rol, parque y asignacion se aplican en el servidor. Las
    operaciones se identifican por alcance en x-scope; los procesos diarios se
    documentan en x-background-processes y no se exponen como endpoints.
x-scope:
  mvp: [RF-01, RF-02, RF-03, RF-04, RF-05, RF-06, RF-07, RF-08, RF-09, RF-10, RF-16, RF-17, RF-25, RF-26, RF-27, RF-28, RF-29, RF-30, RF-31, RF-32, RF-34, RF-35]
  2027: [RF-11, RF-12, RF-13, RF-14, RF-15, RF-21, RF-23, RF-24, RF-33, RF-36]
  posterior: [RF-18, RF-19, RF-20, RF-22, RF-37, RF-38, RF-39]
x-background-processes:
  - name: revision-diaria-atrasos
    schedule: Diario, America/Mexico_City
    description: Marca un criterio como atrasado solo tras vencer su fecha comprometida y mientras no este cumplido. Marca el parque como atrasado si vence fechaProximaActualizacion; al registrar fechaActualizacion calcula la siguiente fecha un ano despues.
    x-acceptance-criteria: [RF-09-AC-2, RF-09-AC-3, RF-30-AC-2, RF-30-AC-3]
  - name: avisos-vencimiento-y-auditoria
    schedule: Diario, America/Mexico_City
    x-acceptance-criteria: [RF-19-AC-1, RF-19-AC-2, RF-19-AC-3, RF-19-AC-4, RF-19-AC-5, RF-20-AC-1, RF-20-AC-2, RF-38-AC-2, RF-39-AC-1, RF-39-AC-2]
servers:
  - url: https://api.sgpis.example.com/api/v1
    description: Produccion
tags:
  - name: Autenticacion
  - name: Usuarios
  - name: Catalogo
  - name: Generaciones
  - name: Parques
  - name: Expedientes
  - name: Evidencias
  - name: Cumplimiento
  - name: Comite y dictamen
  - name: Reportes y bitacora
security:
  - bearerAuth: []
paths:
  /auth/sesiones:
    post:
      tags: [Autenticacion]
      summary: Iniciar sesion
      security: []
      x-acceptance-criteria: [RF-26-AC-1, RF-26-AC-2, RF-26-AC-3]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses:
        '200': {description: Sesion creada, content: {application/json: {schema: {$ref: '#/components/schemas/Token'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /auth/sesiones/actual:
    delete:
      tags: [Autenticacion]
      summary: Cerrar la sesion actual
      x-acceptance-criteria: [RF-26-AC-5, RF-26-AC-6]
      responses: {'204': {description: Token invalidado}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /auth/recuperaciones-contrasena:
    post:
      tags: [Autenticacion]
      summary: Solicitar enlace de recuperacion de un solo uso
      security: []
      x-acceptance-criteria: [RF-26-AC-4]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmailRequest'}}}}
      responses: {'202': {description: Solicitud procesada}, '422': {$ref: '#/components/responses/ValidationError'}}
  /auth/recuperaciones-contrasena/{token}:
    post:
      tags: [Autenticacion]
      summary: Establecer una nueva contrasena con un token de un solo uso
      security: []
      x-acceptance-criteria: [RF-26-AC-4]
      parameters: [{name: token, in: path, required: true, schema: {type: string, minLength: 1}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordResetConfirm'}}}}
      responses: {'204': {description: Contrasena actualizada y token invalidado}, '400': {$ref: '#/components/responses/BadRequest'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /usuarios:
    post:
      tags: [Usuarios]
      summary: Dar de alta un usuario y su rol
      x-acceptance-criteria: [RF-03-AC-1, RF-03-AC-2, RF-03-AC-3]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserCreate'}}}}
      responses: {'201': {description: Usuario pendiente de activacion, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /usuarios/{usuarioId}:
    patch:
      tags: [Usuarios]
      summary: Actualizar estado o asignaciones de usuario
      x-acceptance-criteria: [RF-29-AC-1, RF-29-AC-2]
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserPatch'}}}}
      responses: {'200': {description: Usuario actualizado, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /catalogo/versiones:
    post:
      tags: [Catalogo]
      summary: Cargar una version de catalogo mediante CSV
      x-acceptance-criteria: [RF-01-AC-1, RF-01-AC-2, RF-01-AC-4, RF-01-AC-5]
      requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: '#/components/schemas/CatalogUpload'}}}}
      responses: {'201': {description: Version creada, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogVersion'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /catalogo/exportar:
    get:
      tags: [Catalogo]
      summary: Descargar el archivo maestro del catalogo
      x-acceptance-criteria: [RF-25-AC-2, RF-25-AC-3, RF-25-AC-4]
      responses: {'200': {description: CSV maestro, content: {text/csv: {schema: {type: string, format: binary}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /catalogo/criterios/{criterioId}:
    get:
      tags: [Catalogo]
      summary: Consultar un criterio aplicable
      x-acceptance-criteria: [RF-24-AC-1, RF-25-AC-1]
      parameters: [{$ref: '#/components/parameters/CriterionId'}]
      responses: {'200': {description: Criterio, content: {application/json: {schema: {$ref: '#/components/schemas/Criterion'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
    patch:
      tags: [Catalogo]
      summary: Definir evidencia suficiente para un criterio
      x-acceptance-criteria: [RF-24-AC-1, RF-24-AC-2]
      parameters: [{$ref: '#/components/parameters/CriterionId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CriterionPatch'}}}}
      responses: {'200': {description: Criterio actualizado, content: {application/json: {schema: {$ref: '#/components/schemas/Criterion'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /generaciones:
    post:
      tags: [Generaciones]
      summary: Crear una generacion con su catalogo
      x-acceptance-criteria: [RF-28-AC-1, RF-28-AC-2]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GenerationCreate'}}}}
      responses: {'201': {description: Generacion creada, content: {application/json: {schema: {$ref: '#/components/schemas/Generation'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /parques:
    get:
      tags: [Parques]
      summary: Listar parques visibles al solicitante
      x-acceptance-criteria: [RF-23-AC-1, RF-31-AC-3]
      parameters: [{$ref: '#/components/parameters/GenerationQuery'}, {$ref: '#/components/parameters/DeveloperQuery'}]
      responses: {'200': {description: Parques, content: {application/json: {schema: {$ref: '#/components/schemas/ParkList'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}
    post:
      tags: [Parques]
      summary: Dar de alta un parque activo o historico
      x-acceptance-criteria: [RF-02-AC-1, RF-02-AC-2, RF-02-AC-3, RF-28-AC-3, RF-31-AC-2]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ParkCreate'}}}}
      responses: {'201': {description: Parque creado, content: {application/json: {schema: {$ref: '#/components/schemas/Park'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /parques/{parqueId}:
    get:
      tags: [Parques]
      summary: Consultar parque e historial del programa
      x-acceptance-criteria: [RF-01-AC-3, RF-31-AC-1]
      parameters: [{$ref: '#/components/parameters/ParkId'}]
      responses: {'200': {description: Parque, content: {application/json: {schema: {$ref: '#/components/schemas/Park'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
    patch:
      tags: [Parques]
      summary: Actualizar tipo, estado o fechas del programa
      x-acceptance-criteria: [RF-11-AC-1, RF-11-AC-2, RF-11-AC-3, RF-11-AC-4, RF-11-AC-5, RF-11-AC-6, RF-29-AC-3, RF-30-AC-1]
      parameters: [{$ref: '#/components/parameters/ParkId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ParkPatch'}}}}
      responses: {'200': {description: Parque actualizado, content: {application/json: {schema: {$ref: '#/components/schemas/Park'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /parques/{parqueId}/usuarios-appi:
    get:
      tags: [Parques, Usuarios]
      summary: Listar usuarios APPI y el contacto principal
      x-acceptance-criteria: [RF-34-AC-1, RF-34-AC-3]
      parameters: [{$ref: '#/components/parameters/ParkId'}]
      responses: {'200': {description: Vinculos APPI, content: {application/json: {schema: {$ref: '#/components/schemas/AppiLinkList'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /parques/{parqueId}/usuarios-appi/{usuarioId}:
    patch:
      tags: [Parques, Usuarios]
      summary: Marcar el contacto principal APPI
      x-acceptance-criteria: [RF-34-AC-2]
      parameters: [{$ref: '#/components/parameters/ParkId'}, {$ref: '#/components/parameters/UserId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AppiLinkPatch'}}}}
      responses: {'200': {description: Vinculo actualizado, content: {application/json: {schema: {$ref: '#/components/schemas/AppiLink'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /parques/{parqueId}/asignacion-consultor:
    put:
      tags: [Parques]
      summary: Asignar o reasignar el consultor vigente
      x-acceptance-criteria: [RF-10-AC-1, RF-10-AC-2, RF-10-AC-3]
      parameters: [{$ref: '#/components/parameters/ParkId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConsultantAssignmentRequest'}}}}
      responses: {'200': {description: Asignacion vigente, content: {application/json: {schema: {$ref: '#/components/schemas/ConsultantAssignment'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /parques/{parqueId}/expediente:
    get:
      tags: [Expedientes]
      summary: Consultar expediente y avance sin exponer evidencia restringida
      x-acceptance-criteria: [RF-07-AC-1, RF-07-AC-2, RF-08-AC-1, RF-08-AC-2, RF-08-AC-3, RF-08-AC-4, RF-08-AC-5, RF-32-AC-1, RF-32-AC-2]
      parameters: [{$ref: '#/components/parameters/ParkId'}]
      responses: {'200': {description: Expediente, content: {application/json: {schema: {$ref: '#/components/schemas/CaseFile'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /parques/{parqueId}/autoevaluaciones:
    get:
      tags: [Expedientes]
      summary: Consultar criterios O y R aplicables a la autoevaluacion
      x-acceptance-criteria: [RF-04-AC-1]
      parameters: [{$ref: '#/components/parameters/ParkId'}]
      responses: {'200': {description: Criterios aplicables, content: {application/json: {schema: {$ref: '#/components/schemas/CriterionEvaluationList'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /autoevaluaciones:
    post:
      tags: [Expedientes]
      summary: Registrar autoevaluacion de un criterio aplicable
      x-acceptance-criteria: [RF-04-AC-2]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SelfAssessmentCreate'}}}}
      responses: {'201': {description: Autoevaluacion registrada, content: {application/json: {schema: {$ref: '#/components/schemas/CriterionEvaluation'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /parques/{parqueId}/fases/{faseId}/cierre:
    post:
      tags: [Expedientes]
      summary: Cerrar una fase del expediente
      description: Repetir la solicitud cuando la fase ya esta completada devuelve su estado actual sin crear una transicion ni evento de bitacora adicional.
      x-idempotency: La operacion es idempotente por estado de fase.
      x-acceptance-criteria: [RF-32-AC-3]
      parameters: [{$ref: '#/components/parameters/ParkId'}, {$ref: '#/components/parameters/PhaseId'}]
      responses: {'200': {description: Fase cerrada, content: {application/json: {schema: {$ref: '#/components/schemas/CasePhase'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /parques/{parqueId}/fases/avance-excepcion:
    post:
      tags: [Expedientes]
      summary: Avanzar fase por excepcion con motivo
      description: Repetir la misma solicitud tras el avance devuelve el estado actual sin crear un segundo avance ni evento de bitacora.
      x-idempotency: La operacion es idempotente por estado de fase y destino.
      x-acceptance-criteria: [RF-32-AC-4, RF-32-AC-5]
      parameters: [{$ref: '#/components/parameters/ParkId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PhaseExceptionCreate'}}}}
      responses: {'200': {description: Fase avanzada, content: {application/json: {schema: {$ref: '#/components/schemas/CasePhase'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /parques/{parqueId}/analisis-riesgos:
    post:
      tags: [Expedientes]
      summary: Registrar revision del analisis de riesgos
      x-acceptance-criteria: [RF-16-AC-1, RF-16-AC-4]
      parameters: [{$ref: '#/components/parameters/ParkId'}]
      requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: '#/components/schemas/RiskReviewCreate'}}}}
      responses: {'201': {description: Revision creada, content: {application/json: {schema: {$ref: '#/components/schemas/RiskReview'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /parques/{parqueId}/planes-trabajo:
    post:
      tags: [Expedientes]
      summary: Crear plan de trabajo para un criterio
      x-acceptance-criteria: [RF-09-AC-1, RF-09-AC-4]
      parameters: [{$ref: '#/components/parameters/ParkId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkPlanCreate'}}}}
      responses: {'201': {description: Plan creado, content: {application/json: {schema: {$ref: '#/components/schemas/WorkPlan'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /parques/{parqueId}/opiniones-cumplimiento:
    post:
      tags: [Cumplimiento]
      summary: Emitir opinion intermedia o final
      x-acceptance-criteria: [RF-12-AC-1, RF-12-AC-2, RF-12-AC-3, RF-12-AC-4, RF-12-AC-5, RF-12-AC-6]
      parameters: [{$ref: '#/components/parameters/ParkId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OpinionCreate'}}}}
      responses: {'201': {description: Opinion emitida, content: {application/json: {schema: {$ref: '#/components/schemas/Opinion'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /parques/{parqueId}/evaluaciones-desempeno:
    post:
      tags: [Cumplimiento]
      summary: Registrar Evaluacion de Desempeno
      x-acceptance-criteria: [RF-33-AC-1, RF-33-AC-2, RF-33-AC-3]
      parameters: [{$ref: '#/components/parameters/ParkId'}]
      requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: '#/components/schemas/PerformanceEvaluationCreate'}}}}
      responses: {'201': {description: Evaluacion registrada, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceEvaluation'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /parques/{parqueId}/sesiones-comite:
    post:
      tags: [Comite y dictamen]
      summary: Abrir sesion y otorgar acceso temporal al consultor de comite
      x-acceptance-criteria: [RF-13-AC-1, RF-13-AC-2, RF-13-AC-3, RF-15-AC-1, RF-15-AC-2, RF-15-AC-3]
      parameters: [{$ref: '#/components/parameters/ParkId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CommitteeSessionCreate'}}}}
      responses: {'201': {description: Sesion abierta, content: {application/json: {schema: {$ref: '#/components/schemas/CommitteeSession'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /sesiones-comite/{sesionId}:
    delete:
      tags: [Comite y dictamen]
      summary: Cerrar una sesion de comite y retirar acceso temporal
      description: Solo Coordinacion AMPIP puede cerrar la sesion. Retira el acceso de solo lectura del consultor de comite. Repetir la solicitud sobre una sesion ya cerrada devuelve 204 sin crear un nuevo evento de bitacora.
      x-idempotency: La operacion es idempotente por estado de la sesion.
      x-acceptance-criteria: [RF-13-AC-3]
      parameters: [{name: sesionId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Sesion cerrada y acceso temporal retirado}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /parques/{parqueId}/dictamenes:
    post:
      tags: [Comite y dictamen]
      summary: Capturar dictamen en borrador
      x-acceptance-criteria: [RF-14-AC-2, RF-14-AC-3, RF-14-AC-4, RF-14-AC-5, RF-14-AC-6, RF-14-AC-8]
      parameters: [{$ref: '#/components/parameters/ParkId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VerdictCreate'}}}}
      responses: {'201': {description: Dictamen borrador, content: {application/json: {schema: {$ref: '#/components/schemas/Verdict'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /dictamenes/{dictamenId}/firma:
    post:
      tags: [Comite y dictamen]
      summary: Firmar dictamen en borrador
      description: Repetir la solicitud sobre un dictamen ya firmado devuelve el dictamen firmado sin registrar una firma ni evento de bitacora adicional.
      x-idempotency: La operacion es idempotente por estado del dictamen.
      x-acceptance-criteria: [RF-14-AC-1, RF-14-AC-7]
      parameters: [{$ref: '#/components/parameters/VerdictId'}]
      responses: {'200': {description: Dictamen firmado, content: {application/json: {schema: {$ref: '#/components/schemas/Verdict'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /evidencias:
    post:
      tags: [Evidencias]
      summary: Cargar una o varias evidencias y vincularlas a criterios
      x-acceptance-criteria: [RF-05-AC-1, RF-05-AC-4, RF-05-AC-5, RF-05-AC-7, RF-05-AC-8, RF-06-AC-1, RF-06-AC-2, RF-06-AC-3, RF-06-AC-4, RF-06-AC-5, RF-06-AC-6, RF-23-AC-2, RF-27-AC-4, RF-27-AC-7]
      requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: '#/components/schemas/EvidenceUpload'}}}}
      responses: {'201': {description: Evidencias creadas; EvidenceUploadResult identifica individualmente los archivos creados y los rechazados, content: {application/json: {schema: {$ref: '#/components/schemas/EvidenceUploadResult'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /evidencias/{evidenciaId}:
    get:
      tags: [Evidencias]
      summary: Consultar metadatos e historial de evidencia
      x-acceptance-criteria: [RF-05-AC-6]
      parameters: [{$ref: '#/components/parameters/EvidenceId'}]
      responses: {'200': {description: Evidencia, content: {application/json: {schema: {$ref: '#/components/schemas/Evidence'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
    delete:
      tags: [Evidencias]
      summary: Eliminar logicamente una evidencia enviada
      x-acceptance-criteria: [RF-05-AC-9, RF-05-AC-10]
      parameters: [{$ref: '#/components/parameters/EvidenceId'}]
