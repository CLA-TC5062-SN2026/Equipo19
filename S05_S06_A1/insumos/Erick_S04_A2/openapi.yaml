      responses: {'201': {description: Renovacion o prorroga creada, content: {application/json: {schema: {$ref: '#/components/schemas/Badge'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /reportes/mensual:
