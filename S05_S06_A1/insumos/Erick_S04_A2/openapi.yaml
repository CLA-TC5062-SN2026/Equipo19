      responses: {'201': {description: Visita creada, content: {application/json: {schema: {$ref: '#/components/schemas/ValidationVisit'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}}
