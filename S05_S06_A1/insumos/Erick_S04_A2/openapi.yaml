      responses: {'200': {description: Reporte mensual, content: {application/json: {schema: {$ref: '#/components/schemas/MonthlyReport'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}
