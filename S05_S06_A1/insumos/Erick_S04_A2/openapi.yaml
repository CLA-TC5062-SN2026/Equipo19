      responses: {'200': {description: Eventos ordenados descendentemente, content: {application/json: {schema: {$ref: '#/components/schemas/AuditLogList'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /configuracion/cargas:
