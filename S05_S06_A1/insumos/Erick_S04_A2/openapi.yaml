      responses: {'201': {description: Recomendacion creada, content: {application/json: {schema: {$ref: '#/components/schemas/Recommendation'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /auditorias:
