components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    ParkId: {name: parqueId, in: path, required: true, schema: {type: string, format: uuid}}
    UserId: {name: usuarioId, in: path, required: true, schema: {type: string, format: uuid}}
    CriterionId: {name: criterioId, in: path, required: true, schema: {type: string, format: uuid}}
    EvidenceId: {name: evidenciaId, in: path, required: true, schema: {type: string, format: uuid}}
    EvaluationId: {name: evaluacionId, in: path, required: true, schema: {type: string, format: uuid}}
    VerdictId: {name: dictamenId, in: path, required: true, schema: {type: string, format: uuid}}
    BadgeId: {name: distintivoId, in: path, required: true, schema: {type: string, format: uuid}}
    PhaseId: {name: faseId, in: path, required: true, schema: {type: string}}
    GenerationQuery: {name: generacionId, in: query, schema: {type: string, format: uuid}}
    DeveloperQuery: {name: desarrolladorId, in: query, schema: {type: string, format: uuid}}
    ParkQuery: {name: parqueId, in: query, schema: {type: string, format: uuid}}
  responses:
    BadRequest: {description: Solicitud invalida, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: 'Token ausente, invalido, revocado o expirado', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Sin permisos sobre el recurso, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Recurso no encontrado, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ValidationError: {description: Regla de negocio o validacion incumplida, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    InternalServerError: {description: Error inesperado del servidor, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Id: {type: string, format: uuid}
    DateTime: {type: string, format: date-time}
    Role: {type: string, enum: [coordinacion_ampip, director_general_ampip, appi, consultor_asignado, consultor_comite, gerente_corporativo, administrador_tecnico]}
    PiType: {type: string, enum: [construccion_abierto, construccion_cerrado, operacion_abierto, operacion_cerrado]}
    Error: {type: object, required: [codigo, mensaje], properties: {codigo: {type: string, example: VALIDATION_ERROR}, mensaje: {type: string}, detalles: {type: array, items: {type: object, properties: {campo: {type: string}, mensaje: {type: string}, fila: {type: integer, minimum: 1, description: Fila del CSV cuando corresponda.}, columna: {type: string, description: Columna del CSV cuando corresponda.}}}}}}
    FileLimitPatch: {type: object, required: [maximoMB], properties: {maximoMB: {type: integer, minimum: 1, maximum: 100}}}
    FileLimit: {$ref: '#/components/schemas/FileLimitPatch'}
    LoginRequest: {type: object, required: [correo, contrasena], properties: {correo: {type: string, format: email}, contrasena: {type: string, format: password, minLength: 8}}}
    EmailRequest: {type: object, required: [correo], properties: {correo: {type: string, format: email}}}
    PasswordResetConfirm: {type: object, required: [nuevaContrasena], properties: {nuevaContrasena: {type: string, format: password, minLength: 8}}}
    Token: {type: object, required: [accessToken, tokenType, expiraPorInactividadMinutos], properties: {accessToken: {type: string}, tokenType: {type: string, enum: [Bearer]}, expiraPorInactividadMinutos: {type: integer, example: 60}}}
    UserCreate: {type: object, required: [correo, rol], properties: {correo: {type: string, format: email}, rol: {$ref: '#/components/schemas/Role'}, parqueId: {$ref: '#/components/schemas/Id'}, desarrolladorId: {$ref: '#/components/schemas/Id'}}}
    UserPatch: {type: object, properties: {estado: {type: string, enum: [activo, inactivo]}, rol: {$ref: '#/components/schemas/Role'}}}
    User: {type: object, required: [id, correo, rol, estado, fechaAlta], properties: {id: {$ref: '#/components/schemas/Id'}, correo: {type: string, format: email}, rol: {$ref: '#/components/schemas/Role'}, estado: {type: string, enum: [pendiente_activacion, activo, inactivo]}, fechaAlta: {$ref: '#/components/schemas/DateTime'}}}
    CatalogUpload: {type: object, required: [identificador, archivo], properties: {identificador: {type: string, example: catalogo-2023-v1}, archivo: {type: string, format: binary, description: CSV con columnas requeridas del SRS}}}
    CatalogVersion: {type: object, required: [id, identificador, vigente], properties: {id: {$ref: '#/components/schemas/Id'}, identificador: {type: string}, vigente: {type: boolean}}}
    GenerationCreate: {type: object, required: [nombre, fechaInicio, versionCatalogoId], properties: {nombre: {type: string}, fechaInicio: {type: string, format: date}, versionCatalogoId: {$ref: '#/components/schemas/Id'}}}
    Generation: {allOf: [{$ref: '#/components/schemas/GenerationCreate'}, {type: object, required: [id], properties: {id: {$ref: '#/components/schemas/Id'}}}]}
    ParkCreate: {oneOf: [{$ref: '#/components/schemas/ActiveParkCreate'}, {$ref: '#/components/schemas/HistoricalParkCreate'}]}
    ActiveParkCreate: {type: object, description: Alta de parque activo de una generacion (RF-02 y RF-28)., required: [nombre, desarrolladorId, tipoPI, region, generacionId], properties: {nombre: {type: string}, desarrolladorId: {$ref: '#/components/schemas/Id'}, tipoPI: {$ref: '#/components/schemas/PiType'}, region: {type: string, enum: [Aguascalientes, Baja_California, Baja_California_Sur, Campeche, Chiapas, Chihuahua, Ciudad_de_Mexico, Coahuila, Colima, Durango, Estado_de_Mexico, Guanajuato, Guerrero, Hidalgo, Jalisco, Michoacan, Morelos, Nayarit, Nuevo_Leon, Oaxaca, Puebla, Queretaro, Quintana_Roo, San_Luis_Potosi, Sinaloa, Sonora, Tabasco, Tamaulipas, Tlaxcala, Veracruz, Yucatan, Zacatecas]}, generacionId: {$ref: '#/components/schemas/Id'}, historico: {type: boolean, enum: [false], default: false}}}
    HistoricalParkCreate: {type: object, description: Alta minima de parque historico sin expediente migrado (RF-31)., required: [nombre, region, historico, fechaUltimoDictamen, fechaTermino], properties: {nombre: {type: string}, region: {type: string, enum: [Aguascalientes, Baja_California, Baja_California_Sur, Campeche, Chiapas, Chihuahua, Ciudad_de_Mexico, Coahuila, Colima, Durango, Estado_de_Mexico, Guanajuato, Guerrero, Hidalgo, Jalisco, Michoacan, Morelos, Nayarit, Nuevo_Leon, Oaxaca, Puebla, Queretaro, Quintana_Roo, San_Luis_Potosi, Sinaloa, Sonora, Tabasco, Tamaulipas, Tlaxcala, Veracruz, Yucatan, Zacatecas]}, historico: {type: boolean, enum: [true], description: Indicador tecnico para distinguir el alta minima historica.}, fechaUltimoDictamen: {type: string, format: date}, fechaTermino: {type: string, format: date}}}
    ParkPatch: {type: object, properties: {tipoPI: {$ref: '#/components/schemas/PiType'}, motivoCambioTipo: {type: string, minLength: 1}, estado: {type: string, enum: [activo, inactivo]}, fechaTermino: {type: string, format: date}, fechaActualizacion: {type: string, format: date, description: Fecha de actualizacion realizada; recalcula la proxima anual.}, fechaProximaActualizacion: {type: string, format: date, description: Fecha inicial programada para la siguiente actualizacion anual.}}}
    ParkTypeHistoryEntry: {type: object, required: [tipoPI, fechaDesde, cambiadoPor, cumplimientoAlCierre], properties: {tipoPI: {$ref: '#/components/schemas/PiType'}, fechaDesde: {type: string, format: date}, fechaHasta: {type: string, format: date, nullable: true}, motivo: {type: string, nullable: true}, cambiadoPor: {$ref: '#/components/schemas/Id'}, cumplimientoAlCierre: {$ref: '#/components/schemas/Compliance'}}}
    Park: {type: object, required: [id, nombre, region, estado, fechaAlta], properties: {id: {$ref: '#/components/schemas/Id'}, nombre: {type: string}, region: {type: string}, tipoPI: {$ref: '#/components/schemas/PiType'}, estado: {type: string, enum: [activo, inactivo, historico]}, fechaAlta: {type: string, format: date}, fechaTermino: {type: string, format: date, nullable: true}, fechaProximaActualizacion: {type: string, format: date, nullable: true}, atrasadoPorActualizacion: {type: boolean, description: Indica atraso por vencimiento de fechaProximaActualizacion.}, historialTipos: {type: array, items: {$ref: '#/components/schemas/ParkTypeHistoryEntry'}}, historial: {type: array, items: {$ref: '#/components/schemas/CaseFile'}}}}
    ParkList: {type: array, items: {$ref: '#/components/schemas/Park'}}
    AppiLinkPatch: {type: object, required: [esContactoPrincipal], properties: {esContactoPrincipal: {type: boolean}}}
    AppiLink: {type: object, required: [usuario, activo, esContactoPrincipal], properties: {usuario: {$ref: '#/components/schemas/User'}, activo: {type: boolean}, esContactoPrincipal: {type: boolean}}}
    AppiLinkList: {type: array, items: {$ref: '#/components/schemas/AppiLink'}}
    ConsultantAssignmentRequest: {type: object, required: [consultorId], properties: {consultorId: {$ref: '#/components/schemas/Id'}}}
    ConsultantAssignment: {type: object, required: [id, consultorId, fechaInicio], properties: {id: {$ref: '#/components/schemas/Id'}, consultorId: {$ref: '#/components/schemas/Id'}, fechaInicio: {type: string, format: date}, fechaFin: {type: string, format: date, nullable: true}}}
    CriterionPatch: {type: object, required: [evidenciaSuficiente], properties: {evidenciaSuficiente: {type: string}}}
    Criterion: {type: object, required: [id, numero, descripcion, metodoVerificacion], properties: {id: {$ref: '#/components/schemas/Id'}, numero: {type: string}, descripcion: {type: string}, metodoVerificacion: {type: string}, evidenciaSuficiente: {type: string, nullable: true}}}
    SelfAssessmentCreate: {type: object, required: [parqueId, criterioId], properties: {parqueId: {$ref: '#/components/schemas/Id'}, criterioId: {$ref: '#/components/schemas/Id'}}}
    CriterionEvaluationPatch: {type: object, required: [estado], properties: {estado: {type: string, enum: [cumplido, no_cumplido, en_revision]}, motivoReapertura: {type: string}}}
    CriterionEvaluation: {type: object, required: [id, criterio, marcaAplicable, fechaUltimoCambio], properties: {id: {$ref: '#/components/schemas/Id'}, criterio: {$ref: '#/components/schemas/Criterion'}, marcaAplicable: {type: string, enum: [O, R]}, estado: {type: string, enum: [pendiente, en_revision, cumplido, no_cumplido], nullable: true}, fechaUltimoCambio: {$ref: '#/components/schemas/DateTime'}, actualizadoPor: {$ref: '#/components/schemas/Id'}, motivoReapertura: {type: string, nullable: true}}}
    CriterionEvaluationList: {type: array, items: {$ref: '#/components/schemas/CriterionEvaluation'}}
    CasePhase: {type: object, required: [id, nombre, estado, fechaCambio], properties: {id: {$ref: '#/components/schemas/Id'}, nombre: {type: string}, estado: {type: string, enum: [pendiente, en_proceso, completada, avanzada_por_excepcion]}, motivoExcepcion: {type: string, nullable: true}, fechaCambio: {$ref: '#/components/schemas/DateTime'}, evidenciasEntregadas: {type: integer, minimum: 0, description: Evidencias entregadas en la fase; no implica que la fase este validada o completada.}}}
    PhaseExceptionCreate: {type: object, required: [faseDestinoId, motivo], properties: {faseDestinoId: {type: string}, motivo: {type: string, minLength: 1}}}
    RiskReviewCreate: {type: object, required: [fechaRevision, version, firmante, resumen, ciclo], properties: {fechaRevision: {type: string, format: date}, version: {type: string}, firmante: {type: string}, resumen: {type: string}, ciclo: {type: string}, documento: {type: string, format: binary, description: Archivo opcional; solo APPI y consultor asignado pueden abrirlo}}}
    RiskReview: {allOf: [{$ref: '#/components/schemas/RiskReviewCreate'}, {type: object, required: [id, vigente], properties: {id: {$ref: '#/components/schemas/Id'}, vigente: {type: boolean}, documentoEvidenciaId: {type: string, format: uuid, nullable: true, description: Evidencia del documento opcional; su contenido se consulta solo mediante el endpoint autorizado de evidencia.}}}]}
    WorkPlanCreate: {type: object, required: [evaluacionCriterioId, responsableId, fechaComprometida], properties: {evaluacionCriterioId: {$ref: '#/components/schemas/Id'}, responsableId: {$ref: '#/components/schemas/Id'}, fechaComprometida: {type: string, format: date}}}
    WorkPlan: {allOf: [{$ref: '#/components/schemas/WorkPlanCreate'}, {type: object, required: [id, atrasado], properties: {id: {$ref: '#/components/schemas/Id'}, atrasado: {type: boolean}}}]}
    Compliance: {type: object, required: [obligatorios, recomendados, avanceGeneral], properties: {obligatorios: {type: number, format: float, nullable: true}, recomendados: {type: number, format: float, nullable: true}, avanceGeneral: {type: number, format: float, nullable: true}}}
    CaseFile: {type: object, required: [id, parqueId, generacionId, versionCatalogo, fases, cumplimiento], properties: {id: {$ref: '#/components/schemas/Id'}, parqueId: {$ref: '#/components/schemas/Id'}, generacionId: {$ref: '#/components/schemas/Id'}, versionCatalogo: {type: string}, faseActualId: {$ref: '#/components/schemas/Id'}, fases: {type: array, items: {$ref: '#/components/schemas/CasePhase'}}, cumplimiento: {$ref: '#/components/schemas/Compliance'}, evaluaciones: {$ref: '#/components/schemas/CriterionEvaluationList'}, opiniones: {type: array, items: {$ref: '#/components/schemas/Opinion'}}, dictamenes: {type: array, items: {$ref: '#/components/schemas/Verdict'}}}}
    EvidenceUpload: {type: object, required: [parqueId, criterioIds, archivos], properties: {parqueId: {$ref: '#/components/schemas/Id'}, criterioIds: {type: array, minItems: 1, description: Un archivo puede vincularse a varios criterios del mismo expediente, items: {$ref: '#/components/schemas/Id'}}, faseId: {type: string}, fechaVencimiento: {type: string, format: date}, archivos: {type: array, minItems: 1, description: 'PDF, JPG, PNG, HEIC, XLSX o DOCX; tamano maximo configurado, hasta 100 MB; los videos no se aceptan.', items: {type: string, format: binary}}}}
    EvidenceUploadResult: {type: object, required: [creadas, rechazadas], description: La respuesta 201 informa individualmente las evidencias creadas y los archivos rechazados en la misma carga., properties: {creadas: {type: array, description: Archivos aceptados y creados., items: {$ref: '#/components/schemas/Evidence'}}, rechazadas: {type: array, description: Archivos no creados junto con su motivo de rechazo., items: {type: object, required: [nombre, motivo], properties: {nombre: {type: string}, motivo: {type: string}}}}}}
